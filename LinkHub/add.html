<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Link - LinkHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --card-bg: #f8f9fa;
            --card-hover: #e9ecef;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaa;
            --border: #333;
            --card-bg: #2a2a2a;
            --card-hover: #3a3a3a;
            --header-bg: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
        }

        h2 {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.8;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        [data-theme="dark"] .status-success {
            background: #1e4620;
            color: #75b798;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        [data-theme="dark"] .status-error {
            background: #4a1a1a;
            color: #ea868f;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            text-align: center;
            color: #007aff;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🚀 Dodaj Link</h2>
        <p class="subtitle">AI automatycznie sklasyfikuje link i doda go do odpowiedniej kategorii.</p>

        <form id="add-link-form">
            <div class="input-group">
                <label for="url">Adres URL</label>
                <input type="url" id="url" placeholder="https://example.com" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">Wyślij do AI</button>
        </form>

        <div id="status" class="status-msg"></div>

        <a href="index.html" class="back-link">← Wróć do przeglądania</a>
    </div>

    <script>
        // Theme sync
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        const form = document.getElementById('add-link-form');
        const status = document.getElementById('status');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value;

            btn.disabled = true;
            btn.textContent = 'Trwa wysyłanie...';
            status.style.display = 'none';

            try {
                let token = localStorage.getItem('gh_pat');
                if (!token) {
                    const pass = prompt('Wprowadź swój GitHub Personal Access Token (PAT):');
                    if (pass) {
                        localStorage.setItem('gh_pat', pass);
                        token = pass;
                    } else {
                        throw new Error('Wymagany token PAT do autoryzacji.');
                    }
                }

                let owner = 'snakex21';
                let repo = 'snakex21';

                if (window.location.hostname.includes('github.io')) {
                    const parts = window.location.hostname.split('.');
                    owner = parts[0];
                    repo = window.location.pathname.split('/')[1] || repo;
                }

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: 'add_link',
                        client_payload: {
                            link_url: url
                        }
                    })
                });

                if (response.ok) {
                    status.textContent = 'Sukces! Link zostanie dodany za około minutę.';
                    status.className = 'status-msg status-success';
                    form.reset();
                } else {
                    const errData = await response.json();
                    throw new Error(errData.message || 'Błąd podczas wysyłania.');
                }

            } catch (err) {
                status.textContent = 'Błąd: ' + err.message;
                status.className = 'status-msg status-error';
                if (err.message.includes('401') || err.message.includes('Bad credentials')) {
                    localStorage.removeItem('gh_pat');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Wyślij do AI';
                status.style.display = 'block';
            }
        });
    </script>
</body>

</html>
