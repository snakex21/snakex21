<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Linki - LinkHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --card-bg: #f8f9fa;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #3b82f6;
            --success: #22c55e;
            --error: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaa;
            --border: #333;
            --card-bg: #2a2a2a;
            --header-bg: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        main {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 2rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: var(--card-bg);
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1rem;
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        input[type="url"],
        textarea {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
            display: block;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            display: block;
        }

        .back-link {
            display: block;
            margin-top: 2rem;
            text-align: center;
            color: var(--accent);
            text-decoration: none;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .progress {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 8px;
            display: none;
        }

        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">← LinkHub</a>
    </header>

    <main>
        <h1>🚀 Dodaj Linki</h1>
        <p class="subtitle">AI automatycznie sklasyfikuje linki</p>

        <div class="tabs">
            <button class="tab active" data-tab="single">Pojedynczy link</button>
            <button class="tab" data-tab="bulk">Wiele linków</button>
        </div>

        <!-- Single Link -->
        <div class="tab-content active" id="single-tab">
            <form id="single-form">
                <div class="form-group">
                    <label for="single-url">Adres URL</label>
                    <input type="url" id="single-url" placeholder="https://example.com" required>
                </div>
                <button type="submit" class="submit-btn">Wyślij do AI</button>
            </form>
            <div id="single-status" class="status-msg"></div>
        </div>

        <!-- Bulk Links -->
        <div class="tab-content" id="bulk-tab">
            <form id="bulk-form">
                <div class="form-group">
                    <label for="bulk-urls">Adresy URL (jeden na linię)</label>
                    <textarea id="bulk-urls" placeholder="https://example1.com
https://example2.com
https://example3.com"></textarea>
                    <p class="hint">Wklej wiele linków, każdy w nowej linii. AI przetworzy je po kolei.</p>
                </div>
                <button type="submit" class="submit-btn">Wyślij wszystkie do AI</button>
            </form>
            <div class="progress" id="bulk-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">0 / 0</div>
            </div>
            <div id="bulk-status" class="status-msg"></div>
        </div>

        <a href="index.html" class="back-link">← Wróć do przeglądania</a>
    </main>

    <script>
        // Theme sync
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            };
        });

        // Config
        const owner = 'snakex21';
        const repo = 'snakex21';

        function getToken() {
            let token = localStorage.getItem('gh_pat');
            if (!token) {
                token = prompt('Wprowadź GitHub Personal Access Token (PAT):');
                if (token) localStorage.setItem('gh_pat', token);
            }
            return token;
        }

        async function sendLink(url) {
            const token = getToken();
            if (!token) throw new Error('Brak tokena PAT');

            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: 'add_link',
                    client_payload: { link_url: url }
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || 'Błąd API');
            }
            return true;
        }

        // Single form
        document.getElementById('single-form').onsubmit = async (e) => {
            e.preventDefault();
            const url = document.getElementById('single-url').value.trim();
            const status = document.getElementById('single-status');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.textContent = 'Wysyłanie...';
            status.style.display = 'none';

            try {
                await sendLink(url);
                status.textContent = '✅ Sukces! Link zostanie dodany za ~1 minutę.';
                status.className = 'status-msg status-success';
                e.target.reset();
            } catch (err) {
                status.textContent = '❌ ' + err.message;
                status.className = 'status-msg status-error';
                if (err.message.includes('Bad credentials')) localStorage.removeItem('gh_pat');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Wyślij do AI';
            }
        };

        // Bulk form
        document.getElementById('bulk-form').onsubmit = async (e) => {
            e.preventDefault();
            const urls = document.getElementById('bulk-urls').value
                .split('\n')
                .map(u => u.trim())
                .filter(u => u && u.startsWith('http'));

            if (urls.length === 0) {
                alert('Brak poprawnych linków');
                return;
            }

            const status = document.getElementById('bulk-status');
            const progress = document.getElementById('bulk-progress');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            status.style.display = 'none';
            progress.style.display = 'block';

            let success = 0;
            let failed = 0;

            for (let i = 0; i < urls.length; i++) {
                progressText.textContent = `${i + 1} / ${urls.length}`;
                progressFill.style.width = ((i + 1) / urls.length * 100) + '%';

                try {
                    await sendLink(urls[i]);
                    success++;
                    // Wait 2 seconds between requests to not overwhelm GitHub
                    if (i < urls.length - 1) await new Promise(r => setTimeout(r, 2000));
                } catch (err) {
                    failed++;
                    console.error(`Failed: ${urls[i]}`, err);
                }
            }

            status.textContent = `✅ Gotowe! Dodano: ${success}, Błędy: ${failed}`;
            status.className = 'status-msg status-success';
            btn.disabled = false;
            e.target.reset();
        };
    </script>
</body>

</html>
