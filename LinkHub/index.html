<head>
    <meta charset="UTF-8">

    <!-- Page styles come after kit.css so they can refine its components. -->
    <style>
        /* LinkHub: calm catalogue layout built on shell.css tokens and kit.css components. */
        .lh-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin: 0 0 24px; }
        .lh-intro { flex: 1 1 320px; min-width: 0; }
        .lh-intro .eyebrow { margin: 0 0 10px; font-size: 11px; font-weight: 750; letter-spacing: 1.8px; text-transform: uppercase; color: var(--shell-accent); }
        .lh-intro h1 { margin: 0; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05; font-weight: 750; letter-spacing: -1.2px; }
        .lh-intro p:not(.eyebrow) { margin: 8px 0 0; font-size: 15px; color: var(--shell-muted); }

        .lh-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .search-container { position: relative; flex: 1 1 320px; min-width: 0; }
        .search-container .search-input { padding-left: 42px; min-height: 48px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-52%); font-size: 24px; line-height: 1; color: var(--shell-muted); pointer-events: none; }
        .view-tabs { flex: 0 0 auto; }
        .search-stats { margin: 10px 0 0; font-size: 13px; color: var(--shell-muted); }

        .category-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
        .category-btn {
            display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px;
            border: 1px solid var(--shell-border); border-radius: 999px; background: var(--shell-card);
            color: var(--shell-muted); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; white-space: nowrap;
        }
        .category-btn:hover { color: var(--shell-text); border-color: var(--shell-muted); }
        .category-btn.active { background: var(--shell-text); border-color: var(--shell-text); color: var(--shell-bg); }
        .category-btn .count { font-weight: 500; opacity: .7; font-variant-numeric: tabular-nums; }

        .section-header {
            display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
            margin: 28px 0 12px; font-size: 12px; font-weight: 750; letter-spacing: 1.4px;
            text-transform: uppercase; color: var(--shell-muted);
        }
        .section-header button { padding: 0; border: 0; background: none; color: var(--shell-accent); font: inherit; font-size: 12px; letter-spacing: 0; text-transform: none; cursor: pointer; }
        .section-header button:hover { text-decoration: underline; }

        .link-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .link-card, .timeline-card {
            display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 14px 16px;
            border: 1px solid var(--shell-border); border-radius: 12px; background: var(--shell-card);
            color: var(--shell-text); text-decoration: none; transition: background .15s, border-color .15s;
        }
        .link-card:hover, .timeline-card:hover { background: var(--shell-hover); border-color: var(--shell-muted); }
        .link-tag { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--shell-muted); }
        .link-title { font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
        .link-desc {
            font-size: 13px; line-height: 1.5; color: var(--shell-muted); overflow-wrap: anywhere;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .link-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: auto; padding-top: 6px; font-size: 12px; color: var(--shell-muted); }
        .link-host { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--shell-accent); font-weight: 600; }
        .link-date { font-variant-numeric: tabular-nums; }

        /* "Najnowsze": one calm column, newest first. */
        .timeline { display: flex; flex-direction: column; gap: 8px; max-width: 760px; margin-top: 20px; }
        .timeline-item { min-width: 0; }

        #links-container > .link-grid { margin-top: 16px; }
        .lh-empty { padding: 40px 0; color: var(--shell-muted); }
        .lh-more { display: flex; justify-content: center; margin: 24px 0 0; }

        @media (max-width: 1000px) { .link-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 640px) {
            .kit-page main { padding-top: 24px; }
            .lh-top { margin-bottom: 18px; }
            .lh-top .kit-btn { flex: 1 1 100%; }
            .view-tabs { flex: 1 1 100%; }
            .view-tabs .kit-tab { flex: 1 1 0; }
            .link-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
            /* Many categories: one swipeable row instead of a wall of chips. */
            .category-nav { flex-wrap: nowrap; overflow-x: auto; margin: 16px -16px 4px; padding: 0 16px 6px; scrollbar-width: none; }
            .category-nav::-webkit-scrollbar { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { .link-card, .timeline-card { transition: none; } }
    </style>
</head>

    <main id="main-content" class="kit-wide" tabindex="-1">
        <div class="lh-top">
            <div class="lh-intro">
                <p class="eyebrow">LinkHub · Przeglądaj</p>
                <h1>Zapisane linki</h1>
                <p>Wpisz, czego szukasz, albo wybierz kategorię. Kliknięcie karty otwiera stronę w nowej karcie.</p>
            </div>
            <a href="add.html" class="kit-btn primary">+ Dodaj linki</a>
        </div>

        <div class="lh-toolbar">
            <div class="search-container">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search" id="search-input" class="kit-input search-input" placeholder="Szukaj po nazwie, adresie lub opisie…" aria-label="Szukaj linków" autocomplete="off">
            </div>
            <div class="kit-tabs view-tabs" role="group" aria-label="Układ listy">
                <button type="button" class="kit-tab view-tab active" data-view="categories">Według kategorii</button>
                <button type="button" class="kit-tab view-tab" data-view="timeline">Od najnowszych</button>
            </div>
        </div>
        <div class="search-stats" id="search-stats" role="status" aria-live="polite"></div>

        <div class="category-nav" id="category-nav" role="group" aria-label="Kategorie">
            <button type="button" class="category-btn active" data-category="all">Wszystkie</button>
        </div>

        <div id="links-container">
            <p class="lh-empty">Ładowanie…</p>
        </div>
        <div class="lh-more"><button id="links-more" class="kit-btn" type="button" hidden>Pokaż kolejne 60</button></div>
    </main>

    <script src="data.js"></script>
    <script src="app.js?v=20261010-linkhub"></script>
