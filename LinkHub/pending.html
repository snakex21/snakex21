<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oczekujące Linki - LinkHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --card-bg: #f8f9fa;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaa;
            --border: #333;
            --card-bg: #2a2a2a;
            --header-bg: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        h1 {
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .info-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: var(--warning);
        }

        /* Bulk Actions */
        .bulk-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 8px;
            align-items: center;
        }

        .bulk-actions label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .bulk-actions input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .selected-count {
            margin-left: auto;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .pending-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .pending-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .pending-card.selected {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .pending-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .pending-content {
            flex: 1;
            min-width: 0;
        }

        .pending-url {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent);
            word-break: break-all;
            margin-bottom: 0.3rem;
        }

        .pending-reason {
            font-size: 0.8rem;
            color: var(--error);
            margin-bottom: 0.3rem;
        }

        .pending-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .pending-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .back-link {
            display: block;
            margin-top: 2rem;
            text-align: center;
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">← LinkHub</a>
    </header>

    <main>
        <h1>⏳ Oczekujące Linki</h1>
        <p class="subtitle">Linki, które nie przeszły walidacji. Sprawdź je ręcznie.</p>

        <div class="info-box" id="info-box">
            ⚠️ Te linki nie zostały dodane, ponieważ strona była niedostępna.
        </div>

        <!-- Bulk Actions -->
        <div class="bulk-actions" id="bulk-actions" style="display:none;">
            <label>
                <input type="checkbox" id="select-all"> Zaznacz wszystkie
            </label>
            <button class="btn btn-success" id="accept-selected" disabled>✅ Dodaj zaznaczone</button>
            <button class="btn btn-danger" id="delete-selected" disabled>🗑️ Usuń zaznaczone</button>
            <span class="selected-count" id="selected-count">Wybrano: 0</span>
        </div>

        <div id="pending-list" class="pending-list">
            <div class="empty-state">Ładowanie...</div>
        </div>

        <a href="index.html" class="back-link">← Wróć do LinkHub</a>
    </main>

    <script src="data.js"></script>
    <script>
        // Theme sync
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
        }

        const owner = 'snakex21';
        const repo = 'snakex21';
        let selectedItems = new Set();

        function getToken() {
            return localStorage.getItem('gh_pat');
        }

        async function dispatchEvent(eventType, payload) {
            const token = getToken();
            if (!token) {
                alert('Ustaw token GitHub PAT w ustawieniach');
                return false;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: eventType,
                        client_payload: payload
                    })
                });
                return response.ok;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        function updateSelectedCount() {
            document.getElementById('selected-count').textContent = `Wybrano: ${selectedItems.size}`;
            document.getElementById('accept-selected').disabled = selectedItems.size === 0;
            document.getElementById('delete-selected').disabled = selectedItems.size === 0;
        }

        function renderPending() {
            const container = document.getElementById('pending-list');
            const bulkActions = document.getElementById('bulk-actions');

            if (typeof LINKHUB_PENDING === 'undefined' || LINKHUB_PENDING.length === 0) {
                container.innerHTML = '<div class="empty-state">🎉 Brak oczekujących linków! Wszystko działa.</div>';
                bulkActions.style.display = 'none';
                document.getElementById('info-box').style.display = 'none';
                return;
            }

            bulkActions.style.display = 'flex';

            container.innerHTML = LINKHUB_PENDING.map((item, index) => `
                <div class="pending-card" data-index="${index}">
                    <input type="checkbox" class="pending-checkbox" data-index="${index}" data-url="${item.url}">
                    <div class="pending-content">
                        <div class="pending-url">${item.url}</div>
                        <div class="pending-reason">❌ ${item.reason || 'Strona niedostępna'}</div>
                        <div class="pending-date">📅 ${item.attempted || 'nieznana data'}</div>
                    </div>
                    <div class="pending-actions">
                        <button class="btn btn-sm btn-secondary" onclick="window.open('${item.url}', '_blank')">🔗</button>
                        <button class="btn btn-sm btn-success single-accept" data-url="${item.url}" data-index="${index}">✅</button>
                        <button class="btn btn-sm btn-danger single-delete" data-index="${index}">🗑️</button>
                    </div>
                </div>
            `).join('');

            // Checkbox events
            document.querySelectorAll('.pending-checkbox').forEach(cb => {
                cb.onchange = () => {
                    const card = cb.closest('.pending-card');
                    if (cb.checked) {
                        selectedItems.add(cb.dataset.url);
                        card.classList.add('selected');
                    } else {
                        selectedItems.delete(cb.dataset.url);
                        card.classList.remove('selected');
                    }
                    updateSelectedCount();
                    document.getElementById('select-all').checked =
                        selectedItems.size === LINKHUB_PENDING.length;
                };
            });

            // Single accept
            document.querySelectorAll('.single-accept').forEach(btn => {
                btn.onclick = async () => {
                    btn.disabled = true;
                    btn.textContent = '⏳';
                    if (await dispatchEvent('force_add_link', { link_url: btn.dataset.url })) {
                        await dispatchEvent('remove_pending', { index: parseInt(btn.dataset.index) });
                        alert('✅ Link zostanie dodany!');
                        location.reload();
                    } else {
                        btn.disabled = false;
                        btn.textContent = '✅';
                    }
                };
            });

            // Single delete
            document.querySelectorAll('.single-delete').forEach(btn => {
                btn.onclick = async () => {
                    if (!confirm('Usunąć?')) return;
                    btn.disabled = true;
                    if (await dispatchEvent('remove_pending', { index: parseInt(btn.dataset.index) })) {
                        alert('🗑️ Link usunięty z kolejki');
                        location.reload();
                    }
                };
            });
        }

        // Select all
        document.getElementById('select-all').onchange = (e) => {
            const checkboxes = document.querySelectorAll('.pending-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = e.target.checked;
                const card = cb.closest('.pending-card');
                if (e.target.checked) {
                    selectedItems.add(cb.dataset.url);
                    card.classList.add('selected');
                } else {
                    selectedItems.delete(cb.dataset.url);
                    card.classList.remove('selected');
                }
            });
            updateSelectedCount();
        };

        // Accept selected
        document.getElementById('accept-selected').onclick = async () => {
            if (selectedItems.size === 0) return;
            if (!confirm(`Dodać ${selectedItems.size} linków?`)) return;

            const btn = document.getElementById('accept-selected');
            btn.disabled = true;
            btn.textContent = '⏳ Dodawanie...';

            let success = 0;
            for (const url of selectedItems) {
                if (await dispatchEvent('force_add_link', { link_url: url })) {
                    success++;
                    await new Promise(r => setTimeout(r, 1000));
                }
            }

            alert(`✅ Wysłano ${success} linków do dodania!`);
            location.reload();
        };

        // Delete selected
        document.getElementById('delete-selected').onclick = async () => {
            if (selectedItems.size === 0) return;
            if (!confirm(`Usunąć ${selectedItems.size} linków z kolejki?`)) return;

            const btn = document.getElementById('delete-selected');
            btn.disabled = true;
            btn.textContent = '⏳ Usuwanie...';

            // Get indices of selected items
            const indices = [];
            document.querySelectorAll('.pending-checkbox:checked').forEach(cb => {
                indices.push(parseInt(cb.dataset.index));
            });

            // Send batch delete
            if (await dispatchEvent('remove_pending_batch', { indices: indices })) {
                alert('🗑️ Linki usunięte z kolejki!');
                location.reload();
            }
        };

        renderPending();
    </script>
</body>

</html>
