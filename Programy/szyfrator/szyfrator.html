<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Szyfrator Plików - Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f0f4f8;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #ddd;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #6366f1;
            --success: #10b981;
            --error: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #ffffff;
            --text-secondary: #94a3b8;
            --border: #334155;
            --card-bg: #1e293b;
            --header-bg: #1e293b;
            --shadow: rgba(0, 0, 0, 0.4);
            --accent: #818cf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background 0.2s;
        }

        #theme-toggle:hover {
            background: var(--border);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid var(--border);
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg);
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .drop-zone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .file-info {
            margin-top: 1rem;
            font-weight: 600;
            display: none;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
            font-size: 1rem;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-encrypt {
            background: var(--accent);
            color: white;
        }

        .btn-decrypt {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-decrypt:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.2s;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../../index.html" class="logo">Hub</a>
            <div class="nav-links">
                <a href="../../gry/gry.html">Gry</a>
                <a href="../../muzyka/muzyka.html">Muzyka</a>
                <a href="../../filmy/filmy glowna.html">Filmy</a>
                <a href="../programy.html">Narzędzia</a>
            </div>
            <button id="theme-toggle">🌙</button>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1>🛡️ Szyfrator Plików</h1>
            <p>Szyfruj i odszyfrowuj pliki lokalnie (AES-GCM)</p>

            <div class="drop-zone" id="drop-zone">
                <span class="drop-zone-icon">📁</span>
                <span>Przeciągnij plik tutaj lub kliknij</span>
                <input type="file" id="file-input" style="display: none;">
                <div class="file-info" id="file-info"></div>
            </div>

            <div class="input-group">
                <label>Hasło szyfrowania</label>
                <input type="password" id="password" placeholder="Wpisz silne hasło...">
            </div>

            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="actions">
                <button class="btn-encrypt" id="btn-encrypt">🔒 Szyfruj</button>
                <button class="btn-decrypt" id="btn-decrypt">🔓 Odszyfruj</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </main>

    <script>
        // Theme Logic
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // File Logic
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const passwordInput = document.getElementById('password');
        const statusEl = document.getElementById('status');
        const progressFill = document.getElementById('progress-fill');
        const progressBar = document.getElementById('progress-bar');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            fileInfo.textContent = `Wybrano: ${file.name} (${formatSize(file.size)})`;
            fileInfo.style.display = 'block';
            statusEl.style.display = 'none';
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function getKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
            );
        }

        document.getElementById('btn-encrypt').addEventListener('click', async () => {
            if (!selectedFile || !passwordInput.value) return showStatus('Wybierz plik i wpisz hasło!', 'error');

            try {
                showProgress(true);
                const salt = window.crypto.getRandomValues(new Uint8Array(16));
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const key = await getKey(passwordInput.value, salt);
                const fileData = await selectedFile.arrayBuffer();

                const encryptedContent = await window.crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv }, key, fileData
                );

                // Format: Salt (16) + IV (12) + EncryptedData
                const blob = new Blob([salt, iv, encryptedContent], { type: 'application/octet-stream' });
                downloadFile(blob, selectedFile.name + '.enc');
                showStatus('Plik zaszyfrowany pomyślnie!', 'success');
            } catch (e) {
                showStatus('Błąd szyfrowania: ' + e.message, 'error');
            } finally {
                showProgress(false);
            }
        });

        document.getElementById('btn-decrypt').addEventListener('click', async () => {
            if (!selectedFile || !passwordInput.value) return showStatus('Wybierz plik i wpisz hasło!', 'error');

            try {
                showProgress(true);
                const data = await selectedFile.arrayBuffer();
                const salt = data.slice(0, 16);
                const iv = data.slice(16, 28);
                const encryptedContent = data.slice(28);
                const key = await getKey(passwordInput.value, salt);

                const decryptedContent = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, key, encryptedContent
                );

                const originalName = selectedFile.name.replace('.enc', '');
                const blob = new Blob([decryptedContent]);
                downloadFile(blob, originalName);
                showStatus('Plik odszyfrowany pomyślnie!', 'success');
            } catch (e) {
                showStatus('Błąd odszyfrowania! Sprawdź hasło.', 'error');
            } finally {
                showProgress(false);
            }
        });

        function downloadFile(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        function showProgress(show) {
            progressBar.style.display = show ? 'block' : 'none';
            if (show) {
                progressFill.style.width = '100%'; // Fake progress for UX
            } else {
                progressFill.style.width = '0%';
            }
        }
    </script>
</body>

</html>
