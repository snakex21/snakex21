    <title>Generator Czcionek - Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --card-bg: #f8f9fa;
            --card-hover: #e9ecef;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #3b82f6;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaa;
            --border: #333;
            --card-bg: #2a2a2a;
            --card-hover: #3a3a3a;
            --header-bg: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.3);
            --accent: #60a5fa;
            --input-bg: #222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px var(--shadow);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Input Styles */
        .input-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px var(--shadow);
            margin-bottom: 2rem;
            position: sticky;
            top: 80px;
            z-index: 90;
        }

        textarea.fancytext {
            width: 100%;
            min-height: 100px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1.2rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea.fancytext:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Results List */
        #result {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .font-card {
            display: flex;
            gap: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            align-items: center;
            transition: transform 0.2s;
        }
        
        .font-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .font-output {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.25rem; /* Większa czcionka dla czytelności */
            padding: 0.2rem;
            font-family: inherit;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .font-output:focus {
            outline: none;
        }

        .copy-btn {
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        .loadmore {
            display: block;
            margin: 2rem auto;
            padding: 1rem 3rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            font-weight: 600;
        }

        .loadmore:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        @media (max-width: 768px) {
            nav { padding: 1rem; }
            .nav-links { display: none; }
            h1 { font-size: 2rem; }
            .copy-btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
            .font-output { font-size: 1rem; }
        }
    </style>

¯`v´¯)-»"];

        // Helper Functions
        function applyMap(map, text) {
            return text.split('').map(c => map[c] || map[c.toLowerCase()] || c).join('');
        }

        function flipText(text) {
            const map = maps.flip;
            return text.split('').map(c => map[c] || c).reverse().join('');
        }

        function zalgo(text) {
            // Simplified crazy text
            const chars = text.split('');
            const crazy = chars.map(c => c + String.fromCharCode(768 + Math.floor(Math.random() * 50))).join('');
            return crazy;
        }

        function vaporwave(text) {
            return text.split("").map(char => {
                const code = char.charCodeAt(0);
                return code >= 33 && code <= 126 ? String.fromCharCode(code + 65248) : char;
            }).join("").replace(/ /g, "　");
        }

        function kirbyHug(text) {
            return "(っ◔◡◔)っ ♥ " + text + " ♥";
        }

        function weirdBox(text) {
            return text.replace(/([^\s])/g, "[̲̅$1]");
        }
        
        function sparkle(text) {
            return "✨ " + text + " ✨";
        }

        function arrows(text) {
            return "« " + text + " »";
        }

        function wavy(text) {
            return "≋" + text.split("").join("≋") + "≋";
        }

        function randomDecorations(text) {
            const template = flourishArray[Math.floor(Math.random() * flourishArray.length)];
            return template.replace("[text]", text);
        }

        // --- MAIN GENERATOR LOGIC ---

        function generateVariants(text) {
            if (!text || text.trim() === "") return [];

            // 1. Zestaw "Stały" (Fixed) - zawsze na początku
            const fixed = [
                { name: "Old English", val: applyMap(maps.oldEnglish, text) },
                { name: "Medieval", val: applyMap(maps.medieval, text) },
                { name: "Cursive", val: applyMap(maps.cursive, text) },
                { name: "Bold", val: applyMap(maps.bold, text) },
                { name: "Italic", val: applyMap(maps.italic, text) },
                { name: "Double Struck", val: applyMap(maps.doubleStruck, text) },
                { name: "Monospace", val: applyMap(maps.mono, text) },
                { name: "Bubbles", val: applyMap(maps.bubbles, text) },
                { name: "Squares", val: applyMap(maps.squares, text) },
                { name: "Inverted Squares", val: applyMap(maps.invertedSquares, text) },
                { name: "Small Caps", val: applyMap(maps.smallCaps, text) },
                { name: "Wide Text", val: applyMap(maps.wide, text) },
                { name: "Flip (Upside Down)", val: flipText(text) },
                { name: "Weird Box", val: weirdBox(text) },
                { name: "Kirby Hug", val: kirbyHug(text) },
                { name: "Vaporwave", val: vaporwave(text) },
                { name: "Wavy", val: wavy(text) },
                { name: "Strikethrough", val: text.split('').join('̶') + '̶' },
                { name: "Underline", val: text.split('').join('̲') + '̲' },
                { name: "Slash", val: text.split('').join('̷') + '̷' },
                { name: "Sparkles", val: sparkle(text) },
                { name: "Arrows", val: arrows(text) }
            ];

            return fixed;
        }

        // --- UI INTERACTION ---

        $(function() {
            const input = $(".fancytext");
            const resultContainer = $("#result");
            const loadMoreBtn = $(".loadmore");

            function renderRow(text, isRandom = false) {
                 const html = `
                    <div class="font-card">
                        <input type="text" class="font-output" value="${text.replace(/"/g, '&quot;')}" readonly>
                        <button class="copy-btn" onclick="copyToClipboard(this)">Kopiuj</button>
                    </div>
                `;
                return html;
            }

            function updateList() {
                let txt = input.val();
                if (!txt || txt.trim() === "") txt = "Przykładowy Tekst";
                
                const variants = generateVariants(txt);
                let html = "";
                
                // Render fixed variants
                variants.forEach(v => {
                    html += renderRow(v.val);
                });

                resultContainer.html(html);
            }

            // Init
            updateList();

            // Input listener
            input.on('input', function() {
                updateList();
            });

            // "Pokaż więcej" - Generuje losowe dekoracje (zamiast głupich numerków)
            loadMoreBtn.click(function() {
                let txt = input.val();
                if (!txt || txt.trim() === "") txt = "Przykładowy Tekst";
                
                const btn = $(this);
                const originalText = btn.text();
                btn.text("Generowanie...");
                
                // Dodajemy 10 losowych stylów z flourishArray
                setTimeout(() => {
                    let html = "";
                    for(let i=0; i<10; i++) {
                        // Mieszamy czcionki z dekoracjami
                        let baseText = txt;
                        // 30% szansy na zmianę czcionki wewnątrz dekoracji
                        if(Math.random() > 0.7) {
                            baseText = applyMap(maps.oldEnglish, txt);
                        } else if (Math.random() > 0.7) {
                             baseText = applyMap(maps.smallCaps, txt);
                        }

                        const decorated = randomDecorations(baseText);
                        html += renderRow(decorated);
                    }
                    resultContainer.append(html);
                    btn.text(originalText);
                }, 200);
            });
        });

        // Global copy function
        window.copyToClipboard = function(btn) {
            const input = btn.previousElementSibling;
            input.select();
            input.setSelectionRange(0, 99999); 
            
            navigator.clipboard.writeText(input.value).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Skopiowano!";
                btn.style.background = "#10b981"; // Green
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = "";
                }, 1500);
            });
        };
    </script>
