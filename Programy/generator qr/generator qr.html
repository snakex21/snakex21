<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generator QR - Hub</title>
    <!-- Biblioteka QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .qr-preview {
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }
        #qr-code {
            display: grid; place-content: center;
            width: 100%; max-width: 288px; aspect-ratio: 1;
            padding: 16px; border-radius: 12px; background: #fff;
        }
        #qr-code img, #qr-code canvas { display: block; width: 100%; height: auto; }
    </style>
<link rel="icon" href="../../assets/workshop/favicon.svg" type="image/svg+xml">

<script src="../../assets/workshop/kit.js?v=20261010-kit" defer></script>
</head>
<body class="site-shell content-shell kit-page">
<a class="skip-link" href="#main-content">Przejdź do treści</a>

<nav class="site-nav" aria-label="Główna nawigacja">

</nav>
<div class="site-context"><a href="../../Programy/programy.html">← Wszystkie narzędzia</a></div>
</header>

    <main id="main-content" tabindex="-1">
        <div class="kit-head">
            <span class="kit-head-icon" aria-hidden="true">📱</span>
            <div>
                <h1>Generator QR</h1>
                <p>Kod QR dla dowolnego linku lub tekstu</p>
            </div>
        </div>

        <div class="kit-grid">
            <div class="kit-card">
                <div class="kit-field">
                    <label for="qr-text">Treść / link</label>
                    <input type="text" class="kit-input" id="qr-text" placeholder="np. https://example.com lub hasło Wi-Fi" value="https://snakex21.github.io/snakex21/">
                </div>
                <div class="kit-grid kit-space">
                    <div class="kit-field">
                        <label for="color-dark">Kolor kodu</label>
                        <input type="color" id="color-dark" value="#000000">
                    </div>
                    <div class="kit-field">
                        <label for="color-light">Tło</label>
                        <input type="color" id="color-light" value="#ffffff">
                    </div>
                </div>
                <p class="kit-note">💡 Zeskanuj gotowy kod aparatem w telefonie. Jasne tło i ciemny kod czytają się najpewniej.</p>
            </div>

            <div class="kit-card qr-preview">
                <div id="qr-code" role="img" aria-label="Podgląd kodu QR"></div>
                <p class="kit-note" id="qr-status" role="status" hidden></p>
                <button class="kit-btn primary" id="download-btn" type="button">Pobierz PNG</button>
            </div>
        </div>
    </main>

    <script>
        const qrInput = document.getElementById('qr-text');
        const colorDarkInput = document.getElementById('color-dark');
        const colorLightInput = document.getElementById('color-light');
        const qrContainer = document.getElementById('qr-code');
        const qrStatus = document.getElementById('qr-status');
        const downloadBtn = document.getElementById('download-btn');

        function showStatus(message) {
            qrStatus.hidden = !message;
            qrStatus.textContent = message;
            downloadBtn.disabled = Boolean(message);
        }

        function updateQR() {
            const text = qrInput.value;
            qrContainer.innerHTML = '';
            qrContainer.style.background = colorLightInput.value;
            if (typeof QRCode === 'undefined') {
                showStatus('Nie udało się wczytać biblioteki QR. Sprawdź połączenie z internetem.');
                return;
            }
            if (!text) {
                showStatus('Wpisz treść, aby zobaczyć kod.');
                return;
            }
            showStatus('');
            // QRCode.js cannot recolor an existing code, so it is rebuilt.
            new QRCode(qrContainer, {
                text,
                width: 256,
                height: 256,
                colorDark: colorDarkInput.value,
                colorLight: colorLightInput.value,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        qrInput.addEventListener('input', updateQR);
        colorDarkInput.addEventListener('input', updateQR);
        colorLightInput.addEventListener('input', updateQR);

        downloadBtn.addEventListener('click', () => {
            // QRCode.js renders a canvas first and copies it into an <img> later.
            const canvas = qrContainer.querySelector('canvas');
            const img = qrContainer.querySelector('img');
            const src = canvas ? canvas.toDataURL('image/png') : img && img.src;
            if (!src) return;
            const link = document.createElement('a');
            link.download = 'kod-qr.png';
            link.href = src;
            document.body.appendChild(link);
            link.click();
            link.remove();
        });

        updateQR();
    </script>
</body>
</html>
