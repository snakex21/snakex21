<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kompresor Obrazów - Hub</title>
    <link rel="icon" type="image/x-icon"
        href="https://www.solojuve.com/spolecznosc/zdj%C4%99cia/306-bezimienny-jpg/pobierz">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --card-bg: #f8f9fa;
            --card-hover: #e9ecef;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #8b5cf6;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaa;
            --border: #333;
            --card-bg: #2a2a2a;
            --card-hover: #3a3a3a;
            --header-bg: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.3);
            --accent: #a78bfa;
            --input-bg: #222;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px var(--shadow);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .upload-area {
            grid-column: 1 / -1;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            background: var(--card-bg);
            transition: all 0.2s;
            position: relative;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            border-color: var(--accent);
            background: var(--card-hover);
        }

        .upload-area input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        select {
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            width: 100%;
        }

        .preview-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .image-preview-container {
            width: 100%;
            height: 250px;
            background: var(--input-bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 0.5rem;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .stat-value {
            font-weight: bold;
        }

        .stat-value.good {
            color: #10b981;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem;
            }

            .nav-links {
                display: none;
            }

            h1 {
                font-size: 2rem;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../../index.html" class="logo">Hub</a>
            <div class="nav-links">
                <a href="../../gry/gry.html">Gry</a>
                <a href="../../muzyka/muzyka.html">Muzyka</a>
                <a href="../../filmy/filmy glowna.html">Filmy</a>
                <a href="../programy.html" class="active">Narzędzia</a>
            </div>
            <button id="theme-toggle" aria-label="Przełącz tryb ciemny">🌙</button>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1>🗜️ Kompresor Obrazów</h1>
            <p>Zmniejsz wagę zdjęć i zmieniaj format w przeglądarce</p>
        </div>

        <div class="grid-container">
            <div class="upload-area" id="drop-area">
                <div id="upload-content">
                    <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">📸</span>
                    <h3>Przeciągnij zdjęcie tutaj</h3>
                    <p>lub kliknij by wybrać plik</p>
                </div>
                <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
            </div>

            <div class="settings-card" id="settings-area" style="display: none;">
                <div class="setting-group">
                    <label>Jakość <span id="quality-val">80%</span></label>
                    <input type="range" id="quality-slider" min="1" max="100" value="80">
                </div>

                <div class="setting-group">
                    <label>Format wyjściowy</label>
                    <select id="format-select">
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WEBP</option>
                    </select>
                </div>

                <button class="btn" id="download-btn">📥 Pobierz skompresowany obraz</button>
            </div>

            <div class="preview-card" id="preview-area" style="display: none;">
                <div class="image-preview-container">
                    <img id="preview-img" src="" alt="Podgląd">
                </div>

                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-label">Oryginał</span>
                        <span class="stat-value" id="orig-size">0 KB</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Skompresowany</span>
                        <span class="stat-value good" id="comp-size">0 KB</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Zaoszczędzone</span>
                        <span class="stat-value good" id="save-percent">0%</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Compressor Logic
        const fileInput = document.getElementById('file-input');
        const qualitySlider = document.getElementById('quality-slider');
        const qualityVal = document.getElementById('quality-val');
        const formatSelect = document.getElementById('format-select');
        const previewImg = document.getElementById('preview-img');
        const origSizeEl = document.getElementById('orig-size');
        const compSizeEl = document.getElementById('comp-size');
        const savePercentEl = document.getElementById('save-percent');
        const downloadBtn = document.getElementById('download-btn');
        const settingsArea = document.getElementById('settings-area');
        const previewArea = document.getElementById('preview-area');
        const uploadContent = document.getElementById('upload-content');

        let originalImg = null;
        let originalSize = 0;
        let originalName = '';

        fileInput.addEventListener('change', handleFileUpload);

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalSize = file.size;
            originalName = file.name.substring(0, file.name.lastIndexOf('.'));
            origSizeEl.textContent = formatBytes(file.size);

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImg = img;
                    settingsArea.style.display = 'flex';
                    previewArea.style.display = 'flex';
                    uploadContent.style.display = 'none';
                    compressImage();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        qualitySlider.addEventListener('input', () => {
            qualityVal.textContent = qualitySlider.value + '%';
            compressImage();
        });

        formatSelect.addEventListener('change', compressImage);

        function compressImage() {
            if (!originalImg) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = originalImg.width;
            canvas.height = originalImg.height;
            ctx.drawImage(originalImg, 0, 0);

            const quality = qualitySlider.value / 100;
            const format = formatSelect.value;

            const compressedDataUrl = canvas.toDataURL(format, quality);
            previewImg.src = compressedDataUrl;

            // Estimate size from data URL
            const head = 'data:' + format + ';base64,';
            const compressedSize = Math.round((compressedDataUrl.length - head.length) * 3 / 4);

            compSizeEl.textContent = formatBytes(compressedSize);

            const saved = originalSize - compressedSize;
            const percent = Math.max(0, Math.round((saved / originalSize) * 100));
            savePercentEl.textContent = percent + '%';
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            const format = formatSelect.value.split('/')[1];
            link.download = `${originalName}-kompresja.${format}`;
            link.href = previewImg.src;
            link.click();
        });

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Drag and drop events
        const dropArea = document.getElementById('drop-area');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('drag-over'), false);
        });

        dropArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            handleFileUpload({ target: { files: files } });
        });
    </script>
</body>

</html>
