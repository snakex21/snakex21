    <main id="main-content" class="kit-narrow" tabindex="-1">
        <div class="kit-head">
            <span class="kit-head-icon" aria-hidden="true">🔐</span>
            <div>
                <h1>Generator haseł</h1>
                <p>Silne hasło jednym kliknięciem, losowane w Twojej przeglądarce</p>
            </div>
        </div>

        <div class="kit-card">
            <div class="kit-output">
                <label class="sr-only" for="password-output">Wygenerowane hasło</label>
                <input type="text" id="password-output" class="kit-input" readonly value="">
                <button class="kit-btn primary" id="copy-btn" type="button">Kopiuj</button>
            </div>

            <div class="kit-field kit-space">
                <div class="kit-label-row">
                    <label class="kit-label" for="length-range">Długość hasła</label>
                    <strong id="length-value">16</strong>
                </div>
                <input type="range" id="length-range" min="4" max="64" value="16">
            </div>

            <div class="kit-options kit-space">
                <label class="kit-option"><input type="checkbox" id="uppercase" checked><span>Wielkie litery (A-Z)</span></label>
                <label class="kit-option"><input type="checkbox" id="lowercase" checked><span>Małe litery (a-z)</span></label>
                <label class="kit-option"><input type="checkbox" id="numbers" checked><span>Cyfry (0-9)</span></label>
                <label class="kit-option"><input type="checkbox" id="symbols" checked><span>Symbole (!@#)</span></label>
            </div>

            <p class="kit-note" id="strength" aria-live="polite"></p>

            <div class="kit-actions">
                <button class="kit-btn block" id="generate-btn" type="button">Generuj nowe hasło</button>
            </div>
        </div>
    </main>

    <script>
        const output = document.getElementById('password-output');
        const lengthRange = document.getElementById('length-range');
        const lengthValue = document.getElementById('length-value');
        const strength = document.getElementById('strength');
        const copyBtn = document.getElementById('copy-btn');

        const sets = [
            ['uppercase', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
            ['lowercase', 'abcdefghijklmnopqrstuvwxyz'],
            ['numbers', '0123456789'],
            ['symbols', '!@#$%^&*()_+~`|}{[]:;?><,./-=']
        ];

        // Prefer the CSPRNG from kit.js; fall back to the same algorithm inline
        // when the page runs before (or without) the deferred helper.
        function randomInt(max) {
            if (window.Kit) return Kit.randomInt(max);
            const buf = new Uint32Array(1);
            const limit = Math.floor(0x100000000 / max) * max;
            do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
            return buf[0] % max;
        }

        function generatePassword() {
            const length = Number(lengthRange.value);
            const active = sets.filter(([id]) => document.getElementById(id).checked).map(([, chars]) => chars);
            lengthValue.textContent = length;

            if (!active.length) {
                output.value = '';
                output.placeholder = 'Wybierz co najmniej jedną opcję';
                strength.textContent = '';
                copyBtn.disabled = true;
                return;
            }

            // One character from every selected set, then fill and shuffle,
            // so a selected option is always represented.
            const pool = active.join('');
            const chars = active.map(set => set[randomInt(set.length)]);
            while (chars.length < length) chars.push(pool[randomInt(pool.length)]);
            for (let i = chars.length - 1; i > 0; i--) {
                const j = randomInt(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            output.value = chars.slice(0, length).join('');
            copyBtn.disabled = false;

            const bits = Math.round(length * Math.log2(pool.length));
            const label = bits >= 100 ? 'bardzo silne' : bits >= 70 ? 'silne' : bits >= 50 ? 'średnie' : 'słabe';
            strength.textContent = `Siła: ${label} (ok. ${bits} bitów entropii)`;
        }

        lengthRange.addEventListener('input', generatePassword);
        document.querySelectorAll('.kit-option input').forEach(cb => cb.addEventListener('change', generatePassword));
        document.getElementById('generate-btn').addEventListener('click', generatePassword);
        copyBtn.addEventListener('click', () => {
            if (output.value && window.Kit) Kit.copy(output.value, copyBtn);
        });

        generatePassword();
    </script>
</body>
