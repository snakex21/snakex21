    <main id="main-content" tabindex="-1">
        <div class="kit-head">
            <span class="kit-head-icon" aria-hidden="true">📊</span>
            <div>
                <h1>Licznik słów</h1>
                <p>Analizuj tekst w czasie rzeczywistym</p>
            </div>
        </div>

        <div class="kit-stats" aria-live="polite">
            <div class="kit-stat"><span class="kit-stat-value" id="word-count">0</span><span class="kit-stat-label">Słowa</span></div>
            <div class="kit-stat"><span class="kit-stat-value" id="char-count">0</span><span class="kit-stat-label">Znaki</span></div>
            <div class="kit-stat"><span class="kit-stat-value" id="char-no-space-count">0</span><span class="kit-stat-label">Bez spacji</span></div>
            <div class="kit-stat"><span class="kit-stat-value" id="para-count">0</span><span class="kit-stat-label">Akapity</span></div>
            <div class="kit-stat"><span class="kit-stat-value" id="read-time">0 min</span><span class="kit-stat-label">Czas czytania</span></div>
        </div>

        <label class="sr-only" for="text-input">Tekst do analizy</label>
        <textarea class="kit-input" id="text-input" rows="14" placeholder="Zacznij pisać lub wklej tekst tutaj..." spellcheck="false"></textarea>

        <div class="kit-actions">
            <button class="kit-btn danger" id="clear-btn" type="button">Wyczyść</button>
            <button class="kit-btn primary" id="copy-btn" type="button">Kopiuj tekst</button>
        </div>
    </main>

    <script>
        const textInput = document.getElementById('text-input');
        const wordCount = document.getElementById('word-count');
        const charCount = document.getElementById('char-count');
        const charNoSpaceCount = document.getElementById('char-no-space-count');
        const paraCount = document.getElementById('para-count');
        const readTime = document.getElementById('read-time');
        // kit.js is deferred; this getter is only called after it has loaded.
        const draft = () => window.Kit && Kit.store('wordCounterDraft');

        function analyzeText() {
            const text = textInput.value;
            const words = text.trim().split(/\s+/).filter(Boolean);
            charCount.textContent = text.length;
            charNoSpaceCount.textContent = text.replace(/\s/g, '').length;
            wordCount.textContent = words.length;
            paraCount.textContent = text.split(/\n+/).filter(para => para.trim()).length;
            // About 200 words per minute.
            readTime.textContent = words.length === 0 ? '0 min' : `~${Math.ceil(words.length / 200)} min`;
        }

        textInput.addEventListener('input', () => {
            analyzeText();
            const store = draft();
            if (store) store.set(textInput.value);
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            if (!textInput.value || confirm('Czy na pewno chcesz usunąć cały tekst?')) {
                textInput.value = '';
                analyzeText();
                const store = draft();
                if (store) store.remove();
                textInput.focus();
            }
        });

        document.getElementById('copy-btn').addEventListener('click', event => {
            if (window.Kit) Kit.copy(textInput.value, event.currentTarget);
        });

        // The draft survives a reload, so pasted text is not lost by accident.
        window.addEventListener('DOMContentLoaded', () => {
            const store = draft();
            const saved = store ? store.get('') : '';
            if (typeof saved === 'string' && saved && !textInput.value) textInput.value = saved;
            analyzeText();
        });
        analyzeText();
    </script>
</body>
