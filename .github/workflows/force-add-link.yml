name: LinkHub Force Add Link

on:
  repository_dispatch:
    types: [force_add_link]

permissions:
  contents: write

jobs:
  force-add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Force Add Link
        env:
          LINK_URL: ${{ github.event.client_payload.link_url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_ADD: "true"
        run: |
          python .github/scripts/classify_link.py

      - name: Commit and push
        run: |
          git config --global user.name "LinkHub AI"
          git config --global user.email "linkhub-ai@github.com"
          git add LinkHub/data.js
          git commit -m "LinkHub: Force added link [${{ github.event.client_payload.link_url }}]" || echo "No changes"
          git push
