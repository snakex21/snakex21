name: LinkHub Remove Pending

on:
  repository_dispatch:
    types: [remove_pending, remove_pending_batch]

permissions:
  contents: write

jobs:
  remove-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Remove from pending
        env:
          INDEX: ${{ github.event.client_payload.index }}
          INDICES: ${{ toJson(github.event.client_payload.indices) }}
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          python << 'EOF'
          import os
          import re
          import json

          data_file = "LinkHub/data.js"

          # Read current data
          with open(data_file, "r", encoding="utf-8") as f:
              content = f.read()

          # Extract pending
          pending = []
          pending_match = re.search(r'const LINKHUB_PENDING = (\[[\s\S]*?\]);', content)
          if pending_match:
              try:
                  pending = json.loads(pending_match.group(1))
              except:
                  pass

          # Get indices to remove
          indices_to_remove = set()
          
          # Single index
          single_index = os.getenv("INDEX")
          if single_index and single_index != "null":
              try:
                  indices_to_remove.add(int(single_index))
              except:
                  pass

          # Batch indices
          batch_indices = os.getenv("INDICES")
          if batch_indices and batch_indices != "null":
              try:
                  for i in json.loads(batch_indices):
                      indices_to_remove.add(int(i))
              except:
                  pass

          if not indices_to_remove:
              print("No valid indices to remove")
              exit(0)

          print(f"Removing indices: {indices_to_remove}")

          # Remove items (in reverse order to preserve indices)
          for idx in sorted(indices_to_remove, reverse=True):
              if 0 <= idx < len(pending):
                  removed = pending.pop(idx)
                  print(f"Removed: {removed.get('url', 'unknown')}")

          # Update file
          new_pending = json.dumps(pending, ensure_ascii=False, indent=2)
          content = re.sub(
              r'const LINKHUB_PENDING = \[[\s\S]*?\];',
              f'const LINKHUB_PENDING = {new_pending};',
              content
          )

          with open(data_file, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Updated pending list, {len(pending)} items remaining")
          EOF

      - name: Commit and push
        run: |
          git config --global user.name "LinkHub AI"
          git config --global user.email "linkhub-ai@github.com"
          git add LinkHub/data.js
          git commit -m "LinkHub: Removed items from pending" || echo "No changes"
          git push
