<head>
    <meta charset="UTF-8">

    <title>Simon Says - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-container { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 32px; --game-width: 420px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .game-stage { padding: 8px 0; }

        .simon {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: min(340px, calc(100vw - 48px));
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            border: 10px solid #202b27;
            background: #202b27;
            position: relative;
            box-shadow: 0 10px 30px rgba(28, 49, 36, .18);
        }

        .pad {
            border: 0;
            padding: 0;
            opacity: 0.68;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: opacity .1s, filter .1s, box-shadow .1s;
        }

        .pad:active,
        .pad.lit {
            opacity: 1;
            filter: brightness(1.15) saturate(1.1);
            box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.55);
        }

        .green { background: #22c55e; border-top-left-radius: 100% ; }
        .red { background: #ef4444; border-top-right-radius: 100%; }
        .yellow { background: #facc15; border-bottom-left-radius: 100%; }
        .blue { background: #3b82f6; border-bottom-right-radius: 100%; }

        .center {
            box-sizing: border-box;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 34%;
            aspect-ratio: 1;
            background: #17231e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 8px solid #202b27;
            z-index: 10;
            color: #eef2e7;
            pointer-events: none;
        }
        .center b { font-size: clamp(15px, 4.5vw, 20px); font-weight: 800; letter-spacing: .5px; }
        .center span { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #afbeb1; }

        .pad:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
        .msg { min-height: 1.5em; font-weight: 650; color: var(--shell-text); }
        [data-theme="dark"] .simon { box-shadow: 0 10px 30px rgba(0, 0, 0, .35); border-color: #0f1814; background: #0f1814; }
        [data-theme="dark"] .center { border-color: #0f1814; }
    </style>

    <div class="game-container" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Simon</h1><p>Powtarzaj sekwencję · klawisze 1–4</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Runda</span><b id="score">0</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary start-btn" type="button" onclick="startGame()">Start</button>
            </div>
        </div>
        <div class="game-stage">
            <div class="simon">
                <button type="button" class="pad green" id="0" onclick="userClick(0)" aria-label="Pole 1"></button>
                <button type="button" class="pad red" id="1" onclick="userClick(1)" aria-label="Pole 2"></button>
                <button type="button" class="pad yellow" id="2" onclick="userClick(2)" aria-label="Pole 3"></button>
                <button type="button" class="pad blue" id="3" onclick="userClick(3)" aria-label="Pole 4"></button>
                <div class="center" aria-hidden="true"><span>Simon</span><b>1–4</b></div>
            </div>
        </div>
        <p class="game-status msg" id="msg" aria-live="polite">Wciśnij Start</p>
    </div>

    <script>
        let sequence = [];
        let userStep = 0;
        let turn = 'idle';
        let audioContext = null;
        const timers = new Set();
        const pads = [0, 1, 2, 3].map(i => document.getElementById(String(i)));
        const msg = document.getElementById('msg');
        const scoreEl = document.getElementById('score');
        const freqs = [329.63, 261.63, 220, 164.81];

        function later(callback, delay) {
            const id = setTimeout(() => { timers.delete(id); callback(); }, delay);
            timers.add(id);
            return id;
        }
        function clearPlayback() {
            timers.forEach(clearTimeout);
            timers.clear();
            pads.forEach(pad => pad.classList.remove('lit'));
        }
        function beep(i) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.frequency.value = freqs[i] || 100;
                osc.connect(gain); gain.connect(audioContext.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.3);
                osc.stop(audioContext.currentTime + 0.3);
            } catch (_) { /* The visual sequence remains playable without audio. */ }
        }
        function lightUp(i) {
            pads[i].classList.add('lit'); beep(i);
            later(() => pads[i].classList.remove('lit'), 300);
        }
        function startGame() {
            clearPlayback();
            try {
                const Audio = window.AudioContext || window.webkitAudioContext;
                if (!audioContext && Audio) audioContext = new Audio();
                if (audioContext && audioContext.state === 'suspended') audioContext.resume().catch(() => {});
            } catch (_) { audioContext = null; }
            sequence = []; userStep = 0;
            scoreEl.textContent = '0'; nextRound();
        }
        function nextRound() {
            userStep = 0; turn = 'comp'; msg.textContent = 'Słuchaj...';
            sequence.push(Math.floor(Math.random() * 4));
            scoreEl.textContent = sequence.length;
            let i = 0;
            function playStep() {
                lightUp(sequence[i++]);
                if (i < sequence.length) later(playStep, 800);
                else { turn = 'user'; msg.textContent = 'Twoja kolej'; }
            }
            later(playStep, 800);
        }
        function userClick(i) {
            if (turn !== 'user') return;
            lightUp(i);
            if (i !== sequence[userStep]) {
                turn = 'over'; msg.textContent = 'Błąd! Koniec gry. Wciśnij Start, aby spróbować ponownie.';
                beep(-1); return;
            }
            if (++userStep === sequence.length) {
                turn = 'comp'; msg.textContent = 'Dobrze!'; later(nextRound, 1000);
            }
        }
        document.addEventListener('keydown', event => {
            if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target?.matches?.('input, textarea, select, [contenteditable]')) return;
            if (/^[1-4]$/.test(event.key)) { event.preventDefault(); userClick(Number(event.key) - 1); }
        });

        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.
    </script>
