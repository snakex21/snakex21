<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says - Hub</title>
    <style>
        :root {
            --bg: #222;
            --text: #fff;
            --header-bg: #1a1a1a;
            --nav-text: #aaa;
            --nav-hover: #fff;
            --border: #333;
        }

        [data-theme="light"] {
            --bg: #f0f0f0;
            --text: #333;
            --header-bg: #fff;
            --nav-text: #666;
            --nav-hover: #000;
            --border: #ddd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--nav-text);
            text-decoration: none;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--nav-hover);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .simon {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden;
            border: 10px solid #333;
            position: relative;
        }

        .pad {
            opacity: 0.6;
            cursor: pointer;
            transition: 0.1s;
        }

        .pad:active,
        .pad.lit {
            opacity: 1;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .green {
            background: #00ff00;
            border-top-left-radius: 150px;
        }

        .red {
            background: #ff0000;
            border-top-right-radius: 150px;
        }

        .yellow {
            background: #ffff00;
            border-bottom-left-radius: 150px;
        }

        .blue {
            background: #0000ff;
            border-bottom-right-radius: 150px;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 10px solid #333;
            z-index: 10;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
        }

        .msg {
            margin-top: 20px;
            font-size: 1.5rem;
            height: 30px;
        }

        .start-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1.2rem;
            cursor: pointer;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
        }

        .start-btn:hover {
            background: #444;
        }
        .simon { width: min(300px, calc(100vw - 40px)); height: auto; aspect-ratio: 1; }
        .pad:focus-visible { outline: 4px solid white; outline-offset: -6px; }
        .msg { height: auto; min-height: 30px; text-align: center; max-width: 32rem; }
    </style>
<link rel="icon" href="../../assets/workshop/favicon.svg" type="image/svg+xml">

    <div class="game-container" id="main-content" tabindex="-1" role="main">
        <div class="simon">
            <button type="button" class="pad green" id="0" onclick="userClick(0)" aria-label="Pole 1" style="border:0"></button>
            <button type="button" class="pad red" id="1" onclick="userClick(1)" aria-label="Pole 2" style="border:0"></button>
            <button type="button" class="pad yellow" id="2" onclick="userClick(2)" aria-label="Pole 3" style="border:0"></button>
            <button type="button" class="pad blue" id="3" onclick="userClick(3)" aria-label="Pole 4" style="border:0"></button>
            <div class="center">
                <div class="score" id="score">0</div>
            </div>
        </div>
        <div class="msg" id="msg" aria-live="polite">Wciśnij Start</div>
        <button class="start-btn" onclick="startGame()">Start</button>
    </div>

    <script>
        let sequence = [];
        let userStep = 0;
        let turn = 'idle';
        let audioContext = null;
        const timers = new Set();
        const pads = [0, 1, 2, 3].map(i => document.getElementById(String(i)));
        const msg = document.getElementById('msg');
        const scoreEl = document.getElementById('score');
        const freqs = [329.63, 261.63, 220, 164.81];

        function later(callback, delay) {
            const id = setTimeout(() => { timers.delete(id); callback(); }, delay);
            timers.add(id);
            return id;
        }
        function clearPlayback() {
            timers.forEach(clearTimeout);
            timers.clear();
            pads.forEach(pad => pad.classList.remove('lit'));
        }
        function beep(i) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.frequency.value = freqs[i] || 100;
                osc.connect(gain); gain.connect(audioContext.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.3);
                osc.stop(audioContext.currentTime + 0.3);
            } catch (_) { /* The visual sequence remains playable without audio. */ }
        }
        function lightUp(i) {
            pads[i].classList.add('lit'); beep(i);
            later(() => pads[i].classList.remove('lit'), 300);
        }
        function startGame() {
            clearPlayback();
            try {
                const Audio = window.AudioContext || window.webkitAudioContext;
                if (!audioContext && Audio) audioContext = new Audio();
                if (audioContext && audioContext.state === 'suspended') audioContext.resume().catch(() => {});
            } catch (_) { audioContext = null; }
            sequence = []; userStep = 0;
            scoreEl.textContent = '0'; nextRound();
        }
        function nextRound() {
            userStep = 0; turn = 'comp'; msg.textContent = 'Słuchaj...';
            sequence.push(Math.floor(Math.random() * 4));
            scoreEl.textContent = sequence.length;
            let i = 0;
            function playStep() {
                lightUp(sequence[i++]);
                if (i < sequence.length) later(playStep, 800);
                else { turn = 'user'; msg.textContent = 'Twoja kolej'; }
            }
            later(playStep, 800);
        }
        function userClick(i) {
            if (turn !== 'user') return;
            lightUp(i);
            if (i !== sequence[userStep]) {
                turn = 'over'; msg.textContent = 'Błąd! Koniec gry. Wciśnij Start, aby spróbować ponownie.';
                beep(-1); return;
            }
            if (++userStep === sequence.length) {
                turn = 'comp'; msg.textContent = 'Dobrze!'; later(nextRound, 1000);
            }
        }
        document.addEventListener('keydown', event => {
            if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target?.matches?.('input, textarea, select, [contenteditable]')) return;
            if (/^[1-4]$/.test(event.key)) { event.preventDefault(); userClick(Number(event.key) - 1); }
        });

        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.
    </script>
</body>

</html>
