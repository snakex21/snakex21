<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Simon Says - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-container { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 24px; --game-width: 480px; }
        .game-stage { padding: 8px 0; }

        .simon {
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: min(360px, calc(100vw - 48px));
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            border: 10px solid #202b27;
            background: #202b27;
            position: relative;
            box-shadow: 0 10px 30px rgba(28, 49, 36, .18);
            transition: box-shadow .12s;
        }
        /* Poświata wokół całego koła w kolorze zapalonej ćwiartki */
        .simon[data-lit="0"] { box-shadow: 0 0 46px 8px rgba(34, 197, 94, .55); }
        .simon[data-lit="1"] { box-shadow: 0 0 46px 8px rgba(239, 68, 68, .55); }
        .simon[data-lit="2"] { box-shadow: 0 0 46px 8px rgba(250, 204, 21, .6); }
        .simon[data-lit="3"] { box-shadow: 0 0 46px 8px rgba(59, 130, 246, .55); }
        .simon.wrong { box-shadow: 0 0 46px 10px rgba(208, 92, 92, .75); }

        .pad {
            border: 0;
            padding: 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            filter: brightness(.62) saturate(.85);
            transition: filter .12s, box-shadow .12s;
        }
        .pad:hover { filter: brightness(.74) saturate(.9); }
        .pad:active,
        .pad.lit {
            filter: brightness(1.35) saturate(1.25);
            box-shadow: inset 0 0 36px rgba(255, 255, 255, .75), inset 0 0 8px rgba(255, 255, 255, .9);
        }

        .green { background: radial-gradient(circle at 100% 100%, #4ade80, #16a34a 75%); border-top-left-radius: 100%; }
        .red { background: radial-gradient(circle at 0% 100%, #f87171, #dc2626 75%); border-top-right-radius: 100%; }
        .yellow { background: radial-gradient(circle at 100% 0%, #fde047, #eab308 75%); border-bottom-left-radius: 100%; }
        .blue { background: radial-gradient(circle at 0% 0%, #60a5fa, #2563eb 75%); border-bottom-right-radius: 100%; }

        .center {
            box-sizing: border-box;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 34%;
            aspect-ratio: 1;
            background: radial-gradient(circle at 40% 35%, #26342d, #141d19);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 8px solid #202b27;
            z-index: 10;
            color: #eef2e7;
            pointer-events: none;
        }
        .center b { font-size: 26px; font-weight: 800; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
        .center span { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #afbeb1; }

        .pad:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
        .msg { min-height: 1.5em; font-weight: 650; color: var(--shell-text); }
        [data-theme="dark"] .simon { border-color: #0f1814; background: #0f1814; }
        [data-theme="dark"] .simon:not([data-lit]):not(.wrong) { box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
        [data-theme="dark"] .center { border-color: #0f1814; }
        @media (max-height: 640px) { .game-container { padding-top: 12px; padding-bottom: 12px; } .game-bar { margin-bottom: 8px; } }
    </style>

    <div class="game-container" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Simon</h1><p>Powtarzaj sekwencję · klawisze 1–4</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Runda</span><b id="score">0</b></div>
                <div class="game-stat"><span>Rekord</span><b id="best">0</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary" type="button" id="new-game">Nowa gra</button>
            </div>
        </div>
        <div class="game-stage">
            <div class="simon" id="simon">
                <button type="button" class="pad green" id="0" aria-label="Pole 1 (zielone)"></button>
                <button type="button" class="pad red" id="1" aria-label="Pole 2 (czerwone)"></button>
                <button type="button" class="pad yellow" id="2" aria-label="Pole 3 (żółte)"></button>
                <button type="button" class="pad blue" id="3" aria-label="Pole 4 (niebieskie)"></button>
                <div class="center" aria-hidden="true"><span>Runda</span><b id="center-round">–</b></div>
            </div>
        </div>
        <p class="game-status msg" id="msg" aria-live="polite">Kliknij „Graj”</p>
    </div>

    <script>
    (() => {
        let sequence = [];
        let userStep = 0;
        let turn = 'idle';
        const timers = new Set();
        const simon = document.getElementById('simon');
        const pads = [0, 1, 2, 3].map(i => document.getElementById(String(i)));
        const msg = document.getElementById('msg');
        const roundEl = document.getElementById('score');
        const centerRound = document.getElementById('center-round');
        // Własne tony ćwiartek (jak w klasycznym Simonie), grane przez wspólny dźwięk GryKit (działa wyciszenie 🔊).
        const freqs = [329.63, 261.63, 220, 164.81];
        const COLORS = [['#4ade80', '#bbf7d0'], ['#f87171', '#fecaca'], ['#fde047', '#fef9c3'], ['#60a5fa', '#bfdbfe']];

        function later(callback, delay) {
            const id = setTimeout(() => { timers.delete(id); callback(); }, delay);
            timers.add(id);
            return id;
        }
        function clearPlayback() {
            timers.forEach(clearTimeout);
            timers.clear();
            pads.forEach(pad => pad.classList.remove('lit'));
            delete simon.dataset.lit;
            simon.classList.remove('wrong');
        }
        function setRound(n) {
            roundEl.textContent = n;
            centerRound.textContent = n || '–';
        }
        function lightUp(i, ms = 300) {
            pads[i].classList.add('lit');
            simon.dataset.lit = i;
            GryKit.sfx.tone({ freq: freqs[i], dur: ms / 1000, type: 'triangle', vol: 0.9 });
            later(() => {
                pads[i].classList.remove('lit');
                if (simon.dataset.lit === String(i)) delete simon.dataset.lit;
            }, ms);
        }
        function startGame() {
            clearPlayback();
            sequence = []; userStep = 0;
            GryKit.score(0);
            setRound(0);
            nextRound();
        }
        function nextRound() {
            userStep = 0; turn = 'comp'; msg.textContent = 'Słuchaj…';
            sequence.push(Math.floor(Math.random() * 4));
            setRound(sequence.length);
            GryKit.fx.pop(centerRound, 1.3);
            const gap = Math.max(380, 800 - sequence.length * 30);
            let i = 0;
            function playStep() {
                lightUp(sequence[i++], Math.min(300, gap - 80));
                if (i < sequence.length) later(playStep, gap);
                else later(() => { turn = 'user'; msg.textContent = 'Twoja kolej'; }, 200);
            }
            later(playStep, 800);
        }
        function userClick(i) {
            if (turn !== 'user' || !GryKit.playing) return;
            lightUp(i, 220);
            if (i !== sequence[userStep]) {
                turn = 'over';
                const done = sequence.length - 1;
                msg.textContent = 'Błąd! Koniec gry.';
                simon.classList.add('wrong');
                GryKit.sfx.play('error');
                GryKit.fx.shake(simon, 7, 320);
                GryKit.over({ score: done, sound: false, delay: 700,
                    text: `Pomyłka w rundzie ${sequence.length}. Powtórzona sekwencja: ${done} ${done === 1 ? 'krok' : (done % 10 >= 2 && done % 10 <= 4 && (done % 100 < 10 || done % 100 >= 20) ? 'kroki' : 'kroków')}.` });
                later(() => GryKit.sfx.play('lose'), 300);
                return;
            }
            if (++userStep === sequence.length) {
                turn = 'comp'; msg.textContent = 'Dobrze!';
                GryKit.score(sequence.length);
                GryKit.fx.burstAt(centerRound, { color: COLORS[i], count: 14, spread: 70 });
                later(() => GryKit.sfx.play('score'), 240);
                later(nextRound, 1000);
            }
        }
        pads.forEach((pad, i) => pad.addEventListener('click', () => userClick(i)));
        document.addEventListener('keydown', event => {
            if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target?.matches?.('input, textarea, select, [contenteditable]')) return;
            if (/^[1-4]$/.test(event.key) && GryKit.playing) { event.preventDefault(); userClick(Number(event.key) - 1); }
        });
        document.getElementById('new-game').addEventListener('click', () => GryKit.start());

        GryKit.init({
            layout: 'auto', // w szerokim oknie pasek gry obok planszy (więcej wysokości dla planszy)
            id: 'simon',
            title: 'Simon',
            icon: '🎵',
            howTo: ['Patrz i słuchaj, które pola się zapalają.', 'Powtórz całą sekwencję – co rundę dochodzi jeden krok.', 'Jedna pomyłka kończy grę.'],
            controls: 'Klik / dotyk albo <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd>',
            board: simon,
            overlayHost: '.game-stage',
            hud: { best: '#best' },
            scoreLabel: 'Seria',
            pausable: false,
            fit: { el: simon, zoom: true, max: 2, min: 0.5 },
            onStart() { startGame(); },
            onMenu() { clearPlayback(); turn = 'idle'; setRound(0); msg.textContent = 'Kliknij „Graj”'; }
        });
    })();
    </script>
