<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Szachy - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper {
            flex: 1; display: flex; flex-direction: column; padding: 24px 16px 16px; --game-width: 560px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .game-info { display: flex; gap: 8px; }
        .player-turn {
            display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px;
            border: 1px solid var(--shell-border); border-radius: 10px; background: var(--shell-card);
            color: var(--shell-muted); font-size: 14px; font-weight: 650;
            transition: border-color .15s, box-shadow .15s, color .15s;
        }
        .player-turn::before {
            content: ""; width: 14px; height: 14px; border-radius: 50%;
            background: #f4f1ea; border: 1.5px solid #3a3a3a; box-sizing: border-box;
        }
        #black-turn::before { background: #2b2b2b; border-color: #8a8a8a; }
        .player-turn.active { color: var(--shell-text); border-color: var(--shell-accent); box-shadow: 0 0 0 2px var(--shell-soft); }

        /* Opcje gry z komputerem – pokazywane na ekranie startu (GryKit extra) */
        .chess-options { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .chess-options .kit-tabs { display: inline-flex; align-items: center; }
        .game-wrapper .game-bar { max-width: 760px; }
        .game-wrapper .game-status { margin-top: 8px; }
        .gk-compact .gk-modes .kit-btn { min-height: 34px; }
        .gk-compact .gk-modes .kit-btn small, .gk-compact .gk-icon { display: none; }
        .gk-compact .chess-options .kit-tab { min-height: 28px; padding: 2px 9px; font-size: 12.5px; }
        .gk-compact .chess-options .option-label, .gk-compact .gk-text, .gk-compact .gk-modes + .gk-controls { display: none; }
        .gk-tiny .gk-card:has(.gk-extra) > h2 { display: none; }
        .chess-options .kit-tabs { flex-wrap: nowrap; }
        .option-label { padding: 0 6px 0 8px; color: var(--shell-muted); font-size: 12.5px; font-weight: 600; align-self: center; }

        #chess-board {
            --square-size: min(66px, calc((100vw - 40px) / 8));
            display: grid;
            grid-template-columns: repeat(8, var(--square-size));
            grid-template-rows: repeat(8, var(--square-size));
            border: 4px solid #7a5a3e; border-radius: 10px; overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .14);
        }
        .square {
            width: var(--square-size);
            height: var(--square-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--square-size) * .66);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            position: relative;
        }

        .square::before {
            content: attr(data-piece);
            position: absolute;
            z-index: 1;
            /* Czarne figury - ciemne z jasnym konturem */
            color: #1a1a1a;
            text-shadow:
                -1px -1px 0 rgba(255,255,255,0.3),
                1px -1px 0 rgba(255,255,255,0.3),
                -1px 1px 0 rgba(255,255,255,0.3),
                1px 1px 0 rgba(255,255,255,0.3),
                0 0 2px rgba(255,255,255,0.2);
        }

        .square.white-piece::before {
            /* Białe figury - jasne z ciemnym konturem */
            color: #ffffff;
            text-shadow:
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                -1px 0 0 #000,
                1px 0 0 #000,
                0 -1px 0 #000,
                0 1px 0 #000,
                0 0 4px rgba(0,0,0,0.5);
        }

        .square.white {
            background: #f0d9b5;
        }

        .square.black {
            background: #b58863;
        }

        .square.selected {
            background: #9acd32 !important;
        }

        .square.valid-move {
            background: #90ee90 !important;
        }

        /* Ostatni ruch: żółtawa poświata pod figurą (pole startowe i docelowe) */
        .square.last-move::after {
            content: ""; position: absolute; inset: 0;
            background: rgba(246, 214, 70, .5); box-shadow: inset 0 0 0 2px rgba(196, 160, 20, .55);
        }
        .square.selected::after, .square.valid-move::after { display: none; }

        .square.in-check {
            background: #ff4444 !important;
            animation: check-pulse 1s ease-in-out infinite;
        }

        @keyframes check-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .square:hover { filter: brightness(1.06); }
        #chess-board .square:focus-visible { outline: 3px solid #2563eb; outline-offset: -3px; }

        .controls { line-height: 1.6; }
        .controls strong { color: var(--shell-text); }

        .promotion-overlay {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(0, 0, 0, .55); align-items: center; justify-content: center; padding: 16px;
        }
        .promotion-overlay.show { display: flex; }
        .promotion-modal {
            background: var(--shell-card); color: var(--shell-text);
            border: 1px solid var(--shell-border); border-radius: 16px; padding: 24px; text-align: center;
        }
        .promotion-modal h3 { margin: 0 0 16px; font-size: 18px; }
        .promotion-choices { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .promotion-btn {
            display: flex; align-items: center; justify-content: center;
            width: 72px; height: 72px; font-size: 44px; line-height: 1;
            background: #f0d9b5; color: #1a1a1a; border: 1px solid var(--shell-border); border-radius: 12px;
            cursor: pointer; transition: border-color .15s, transform .15s;
        }
        .promotion-btn:hover { border-color: var(--shell-accent); transform: translateY(-2px); }
        @media (max-width: 560px) {
            .player-turn { min-height: 40px; padding: 0 10px; }
            .promotion-btn { width: 60px; height: 60px; font-size: 36px; }
        }
        @media (prefers-reduced-motion: reduce) { .square.in-check { animation: none; } }
    </style>

    <script>
        // Tryb ciemny
        // Theme is handled by assets/workshop/shell.js.

        // Logika szachów
        const board = [];
        let selectedPiece = null;
        let currentPlayer = 'white';
        let gameMode = 'pvp'; // 'pvp', 'ai', 'auto'
        let autoPlayInterval = null;
        let aiTimeout = null;
        function queueAIMove() {
            clearTimeout(aiTimeout);
            aiTimeout = setTimeout(() => {
                aiTimeout = null;
                if (!gameOver && !pendingPromotion && gameMode === 'ai' && currentPlayer !== playerColor) makeAIMove();
            }, 500);
        }
        let playerColor = 'white'; // Kolor gracza w trybie AI
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        let gameOver = false;
        let pendingPromotion = null; // { row, col, color }
        let lastMove = null; // { fromRow, fromCol, toRow, toCol } – podświetlenie ostatniego ruchu

        // Figury szachowe (Unicode)
        const pieces = {
            white: {
                king: '♔',
                queen: '♕',
                rook: '♖',
                bishop: '♗',
                knight: '♘',
                pawn: '♙'
            },
            black: {
                king: '♚',
                queen: '♛',
                rook: '♜',
                bishop: '♝',
                knight: '♞',
                pawn: '♟'
            }
        };

        // Inicjalizacja planszy
        function initBoard() {
            // Pusta plansza
            for (let i = 0; i < 8; i++) {
                board[i] = [];
                for (let j = 0; j < 8; j++) {
                    board[i][j] = null;
                }
            }

            // Białe figury
            board[7][0] = { type: 'rook', color: 'white', symbol: pieces.white.rook, hasMoved: false };
            board[7][1] = { type: 'knight', color: 'white', symbol: pieces.white.knight, hasMoved: false };
            board[7][2] = { type: 'bishop', color: 'white', symbol: pieces.white.bishop, hasMoved: false };
            board[7][3] = { type: 'queen', color: 'white', symbol: pieces.white.queen, hasMoved: false };
            board[7][4] = { type: 'king', color: 'white', symbol: pieces.white.king, hasMoved: false };
            board[7][5] = { type: 'bishop', color: 'white', symbol: pieces.white.bishop, hasMoved: false };
            board[7][6] = { type: 'knight', color: 'white', symbol: pieces.white.knight, hasMoved: false };
            board[7][7] = { type: 'rook', color: 'white', symbol: pieces.white.rook, hasMoved: false };
            for (let i = 0; i < 8; i++) {
                board[6][i] = { type: 'pawn', color: 'white', symbol: pieces.white.pawn, hasMoved: false };
            }

            // Czarne figury
            board[0][0] = { type: 'rook', color: 'black', symbol: pieces.black.rook, hasMoved: false };
            board[0][1] = { type: 'knight', color: 'black', symbol: pieces.black.knight, hasMoved: false };
            board[0][2] = { type: 'bishop', color: 'black', symbol: pieces.black.bishop, hasMoved: false };
            board[0][3] = { type: 'queen', color: 'black', symbol: pieces.black.queen, hasMoved: false };
            board[0][4] = { type: 'king', color: 'black', symbol: pieces.black.king, hasMoved: false };
            board[0][5] = { type: 'bishop', color: 'black', symbol: pieces.black.bishop, hasMoved: false };
            board[0][6] = { type: 'knight', color: 'black', symbol: pieces.black.knight, hasMoved: false };
            board[0][7] = { type: 'rook', color: 'black', symbol: pieces.black.rook, hasMoved: false };
            for (let i = 0; i < 8; i++) {
                board[1][i] = { type: 'pawn', color: 'black', symbol: pieces.black.pawn, hasMoved: false };
            }
        }

        // Rysowanie planszy
        function drawBoard() {
            const boardElement = document.getElementById('chess-board');
            boardElement.innerHTML = '';

            // Znajdź króla w szachu
            let checkedKingPos = null;
            if (isKingInCheck('white')) {
                checkedKingPos = findKing('white');
            } else if (isKingInCheck('black')) {
                checkedKingPos = findKing('black');
            }

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';
                    square.className += (row + col) % 2 === 0 ? ' white' : ' black';
                    square.dataset.row = row;
                    square.dataset.col = col;

                    if (lastMove && ((row === lastMove.fromRow && col === lastMove.fromCol) || (row === lastMove.toRow && col === lastMove.toCol))) {
                        square.classList.add('last-move');
                    }

                    // Podświetl króla w szachu
                    if (checkedKingPos && row === checkedKingPos.row && col === checkedKingPos.col) {
                        square.classList.add('in-check');
                    }

                    if (board[row][col]) {
                        square.dataset.piece = board[row][col].symbol;
                        if (board[row][col].color === 'white') {
                            square.classList.add('white-piece');
                        }
                    }

                    square.tabIndex = 0;
                    square.setAttribute('role', 'button');
                    square.setAttribute('aria-label', `${String.fromCharCode(97 + col)}${8 - row}: ${board[row][col]?.symbol || 'puste'}`);
                    square.addEventListener('click', () => handleSquareClick(row, col));
                    square.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault(); handleSquareClick(row, col);
                            document.querySelector(`[data-row="${row}"][data-col="${col}"]`)?.focus();
                        } else {
                            const directions = {ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1]};
                            const step = directions[e.key];
                            if (step) { e.preventDefault(); document.querySelector(`[data-row="${Math.max(0, Math.min(7, row + step[0]))}"][data-col="${Math.max(0, Math.min(7, col + step[1]))}"]`)?.focus(); }
                        }
                    });
                    boardElement.appendChild(square);
                }
            }
        }

        // Sprawdzanie czy ruch jest możliwy
        function isValidMove(fromRow, fromCol, toRow, toCol, skipCheckValidation = false) {
            const piece = board[fromRow][fromCol];
            if (!piece || (fromRow === toRow && fromCol === toCol)) return false;
            if (!skipCheckValidation && board[toRow][toCol]?.type === 'king') return false;

            const rowDiff = Math.abs(toRow - fromRow);
            const colDiff = Math.abs(toCol - fromCol);

            // Sprawdź czy na docelowym polu nie ma figury tego samego koloru
            if (board[toRow][toCol] && board[toRow][toCol].color === piece.color) {
                return false;
            }

            let isBasicMoveValid = false;

            switch (piece.type) {
                case 'pawn':
                    if (piece.color === 'white') {
                        // Ruch do przodu
                        if (fromCol === toCol && toRow === fromRow - 1 && !board[toRow][toCol]) isBasicMoveValid = true;
                        // Pierwszy ruch - 2 pola
                        else if (fromRow === 6 && fromCol === toCol && toRow === 4 && !board[toRow][toCol] && !board[5][toCol]) isBasicMoveValid = true;
                        // Bicie
                        else if (rowDiff === 1 && colDiff === 1 && toRow === fromRow - 1 && board[toRow][toCol]) isBasicMoveValid = true;
                    } else {
                        // Ruch do przodu
                        if (fromCol === toCol && toRow === fromRow + 1 && !board[toRow][toCol]) isBasicMoveValid = true;
                        // Pierwszy ruch - 2 pola
                        else if (fromRow === 1 && fromCol === toCol && toRow === 3 && !board[toRow][toCol] && !board[2][toCol]) isBasicMoveValid = true;
                        // Bicie
                        else if (rowDiff === 1 && colDiff === 1 && toRow === fromRow + 1 && board[toRow][toCol]) isBasicMoveValid = true;
                    }
                    break;

                case 'rook':
                    if (fromRow === toRow || fromCol === toCol) {
                        isBasicMoveValid = isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    break;

                case 'knight':
                    isBasicMoveValid = (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
                    break;

                case 'bishop':
                    if (rowDiff === colDiff) {
                        isBasicMoveValid = isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    break;

                case 'queen':
                    if (fromRow === toRow || fromCol === toCol || rowDiff === colDiff) {
                        isBasicMoveValid = isPathClear(fromRow, fromCol, toRow, toCol);
                    }
                    break;

                case 'king':
                    // Normalny ruch króla
                    if (rowDiff <= 1 && colDiff <= 1) {
                        isBasicMoveValid = true;
                    }
                    // Roszada
                    else if (!piece.hasMoved && rowDiff === 0 && colDiff === 2) {
                        // Roszada krótka (w prawo)
                        if (toCol === fromCol + 2) {
                            const rook = board[fromRow][7];
                            if (rook && rook.type === 'rook' && rook.color === piece.color && !rook.hasMoved &&
                                !board[fromRow][fromCol + 1] && !board[fromRow][fromCol + 2]) {
                                // Sprawdź czy król nie jest w szachu i nie przechodzi przez szach
                                if (!skipCheckValidation) {
                                    if (isKingInCheck(piece.color)) {
                                        isBasicMoveValid = false;
                                    } else if (wouldMoveCauseCheck(fromRow, fromCol, fromRow, fromCol + 1)) {
                                        isBasicMoveValid = false;
                                    } else {
                                        isBasicMoveValid = true;
                                    }
                                } else {
                                    isBasicMoveValid = true;
                                }
                            }
                        }
                        // Roszada długa (w lewo)
                        else if (toCol === fromCol - 2) {
                            const rook = board[fromRow][0];
                            if (rook && rook.type === 'rook' && rook.color === piece.color && !rook.hasMoved &&
                                !board[fromRow][fromCol - 1] && !board[fromRow][fromCol - 2] && !board[fromRow][fromCol - 3]) {
                                // Sprawdź czy król nie jest w szachu i nie przechodzi przez szach
                                if (!skipCheckValidation) {
                                    if (isKingInCheck(piece.color)) {
                                        isBasicMoveValid = false;
                                    } else if (wouldMoveCauseCheck(fromRow, fromCol, fromRow, fromCol - 1)) {
                                        isBasicMoveValid = false;
                                    } else {
                                        isBasicMoveValid = true;
                                    }
                                } else {
                                    isBasicMoveValid = true;
                                }
                            }
                        }
                    }
                    break;
            }

            if (!isBasicMoveValid) return false;

            // Sprawdź czy ruch nie wystawia własnego króla na szach
            if (!skipCheckValidation && wouldMoveCauseCheck(fromRow, fromCol, toRow, toCol)) {
                return false;
            }

            return true;
        }

        // Sprawdzanie czy droga jest wolna
        function isPathClear(fromRow, fromCol, toRow, toCol) {
            const rowStep = toRow > fromRow ? 1 : toRow < fromRow ? -1 : 0;
            const colStep = toCol > fromCol ? 1 : toCol < fromCol ? -1 : 0;

            let currentRow = fromRow + rowStep;
            let currentCol = fromCol + colStep;

            while (currentRow !== toRow || currentCol !== toCol) {
                if (board[currentRow][currentCol]) return false;
                currentRow += rowStep;
                currentCol += colStep;
            }
            return true;
        }

        // Sprawdzanie czy pole jest atakowane przez przeciwnika
        function isSquareUnderAttack(row, col, byColor) {
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece && piece.color === byColor) {
                        const attacks = piece.type === 'pawn'
                            ? Math.abs(col - fromCol) === 1 && row - fromRow === (piece.color === 'white' ? -1 : 1)
                            : piece.type === 'king'
                                ? Math.max(Math.abs(row - fromRow), Math.abs(col - fromCol)) === 1
                                : isValidMove(fromRow, fromCol, row, col, true);
                        if (attacks) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Znajdź króla danego koloru
        function findKing(color) {
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const piece = board[row][col];
                    if (piece && piece.type === 'king' && piece.color === color) {
                        return { row, col };
                    }
                }
            }
            return null;
        }

        // Sprawdzanie czy król jest w szachu
        function isKingInCheck(color) {
            const king = findKing(color);
            if (!king) return false;

            const opponentColor = color === 'white' ? 'black' : 'white';
            return isSquareUnderAttack(king.row, king.col, opponentColor);
        }

        // Sprawdzanie czy ruch spowoduje szach własnego króla
        function wouldMoveCauseCheck(fromRow, fromCol, toRow, toCol) {
            // Zapisz stan
            const movingPiece = board[fromRow][fromCol];
            const capturedPiece = board[toRow][toCol];

            // Wykonaj ruch tymczasowo
            board[toRow][toCol] = movingPiece;
            board[fromRow][fromCol] = null;

            // Sprawdź czy własny król jest w szachu
            const inCheck = isKingInCheck(movingPiece.color);

            // Cofnij ruch
            board[fromRow][fromCol] = movingPiece;
            board[toRow][toCol] = capturedPiece;

            return inCheck;
        }

        // Sprawdzanie czy jest mat
        function isCheckmate(color) {
            // Musi być w szachu
            if (!isKingInCheck(color)) return false;

            // Sprawdź czy jest jakikolwiek legalny ruch
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece && piece.color === color) {
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    return false; // Jest legalny ruch, nie ma mata
                                }
                            }
                        }
                    }
                }
            }
            return true; // Brak legalnych ruchów + szach = mat
        }

        // Sprawdzanie czy jest pat
        function isStalemate(color) {
            // Nie może być w szachu
            if (isKingInCheck(color)) return false;

            // Sprawdź czy jest jakikolwiek legalny ruch
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece && piece.color === color) {
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    return false; // Jest legalny ruch
                                }
                            }
                        }
                    }
                }
            }
            return true; // Brak legalnych ruchów bez szacha = pat
        }

        // Sprawdzanie końca gry
        function checkGameOver() {
            if (gameOver) return;

            if (isCheckmate(currentPlayer)) {
                gameOver = true;
                const winnerColor = currentPlayer === 'white' ? 'black' : 'white';
                const winner = winnerColor === 'white' ? 'Białe' : 'Czarne';
                const text = `${winner} pokonały ${currentPlayer === 'white' ? 'białe' : 'czarne'}.`;
                if (gameMode === 'ai') {
                    const won = winnerColor === playerColor;
                    showGameOver({ title: won ? 'Szach-mat! Wygrywasz' : 'Szach-mat! Wygrywa komputer', text, win: won, icon: won ? '🏆' : '♚' });
                } else {
                    showGameOver({ title: `Szach-mat! ${winner} wygrywają`, text, win: true, icon: winnerColor === 'white' ? '♔' : '♚' });
                }
            } else if (isStalemate(currentPlayer)) {
                gameOver = true;
                GryKit.sfx.play('score');
                showGameOver({ title: 'Pat – remis', text: 'Brak legalnych ruchów, a król nie jest szachowany.', win: false, icon: '🤝', sound: false });
            }
        }

        // Pokazanie komunikatu końca gry (nakładka GryKit)
        function showGameOver(o) {
            // Zatrzymaj auto-play jeśli aktywny
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
            if (o.win) GryKit.fx.burstAt(document.getElementById('chess-board'), { count: 36, spread: 170, square: true, color: ['#f2c14e', '#f0d9b5', '#b58863', '#9acd32'] });
            GryKit.over({ title: o.title, text: o.text, win: o.win, icon: o.icon, sound: o.sound, showScore: false, record: false, delay: 500 });
        }

        // Dźwięk i efekty po wykonanym ruchu (gracz lub komputer). Wywoływane po zmianie tury.
        function moveFx(captured) {
            const target = lastMove && document.querySelector(`[data-row="${lastMove.toRow}"][data-col="${lastMove.toCol}"]`);
            if (captured) {
                GryKit.sfx.play('hit');
                if (target) GryKit.fx.burstAt(target, { count: 10, spread: 34, color: captured.color === 'white' ? ['#ffffff', '#d8d2c4'] : ['#2b2b2b', '#6a6a6a'] });
            } else {
                GryKit.sfx.play('tap');
            }
            if (!gameOver && isKingInCheck(currentPlayer)) setTimeout(() => GryKit.sfx.play('score', { pitch: 1.3 }), 90);
        }

        // Pokazanie UI promocji pionka
        function showPromotionUI(row, col, color) {
            pendingPromotion = { row, col, color };

            const choicesDiv = document.getElementById('promotion-choices');
            choicesDiv.innerHTML = '';

            const promotionPieces = ['queen', 'rook', 'bishop', 'knight'];
            promotionPieces.forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'promotion-btn';
                btn.textContent = pieces[color][type];
                btn.onclick = () => completePromotion(type);
                choicesDiv.appendChild(btn);
            });

            document.getElementById('promotion-overlay').classList.add('show');
        }

        // Ukończ promocję pionka
        function completePromotion(newType) {
            if (!pendingPromotion || !['queen', 'rook', 'bishop', 'knight'].includes(newType)) return;

            const { row, col, color } = pendingPromotion;

            // Zamień pionka na wybraną figurę
            board[row][col] = {
                type: newType,
                color: color,
                symbol: pieces[color][newType],
                hasMoved: true
            };

            // Ukryj UI
            document.getElementById('promotion-overlay').classList.remove('show');
            pendingPromotion = null;

            // Kontynuuj grę
            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            updateTurnDisplay();
            drawBoard();
            checkGameOver();

            // W trybie AI, po promocji gracza, AI wykonuje swój ruch
            if (!gameOver && gameMode === 'ai') {
                const aiColor = playerColor === 'white' ? 'black' : 'white';
                if (currentPlayer === aiColor) {
                    queueAIMove();
                }
            }
        }

        // Obsługa kliknięcia na pole
        function handleSquareClick(row, col) {
            // Nie pozwalaj na ruchy gdy gra się skończyła albo trwa ekran startu
            if (gameOver || pendingPromotion || !GryKit.playing) return;

            // W trybie auto, nie pozwalaj na kliknięcia
            if (gameMode === 'auto') return;

            // W trybie AI, tylko kolor gracza może klikać
            if (gameMode === 'ai' && currentPlayer !== playerColor) return;

            if (selectedPiece) {
                // Próba ruchu
                if (isValidMove(selectedPiece.row, selectedPiece.col, row, col)) {
                    const movingPiece = board[selectedPiece.row][selectedPiece.col];
                    const captured = board[row][col];
                    lastMove = { fromRow: selectedPiece.row, fromCol: selectedPiece.col, toRow: row, toCol: col };

                    // Wykonaj ruch
                    board[row][col] = movingPiece;
                    board[selectedPiece.row][selectedPiece.col] = null;
                    movingPiece.hasMoved = true;

                    // Roszada - przesuń wieżę
                    if (movingPiece.type === 'king' && Math.abs(col - selectedPiece.col) === 2) {
                        if (col > selectedPiece.col) {
                            // Roszada krótka
                            const rook = board[row][7];
                            board[row][5] = rook;
                            board[row][7] = null;
                            rook.hasMoved = true;
                        } else {
                            // Roszada długa
                            const rook = board[row][0];
                            board[row][3] = rook;
                            board[row][0] = null;
                            rook.hasMoved = true;
                        }
                    }

                    selectedPiece = null;

                    // Sprawdź promocję pionka
                    if (movingPiece.type === 'pawn' && (row === 0 || row === 7)) {
                        drawBoard();
                        GryKit.sfx.play(captured ? 'hit' : 'tap');
                        showPromotionUI(row, col, movingPiece.color);
                        return; // Czekaj na wybór promocji
                    }

                    currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
                    updateTurnDisplay();
                    drawBoard();

                    // Sprawdź koniec gry
                    checkGameOver();
                    moveFx(captured);

                    // W trybie AI, po ruchu gracza, AI wykonuje swój ruch
                    if (!gameOver) {
                        const aiColor = playerColor === 'white' ? 'black' : 'white';
                        if (gameMode === 'ai' && currentPlayer === aiColor) {
                            queueAIMove(); // 0.5 sekundy opóźnienia dla lepszego UX
                        }
                    }
                    return;
                } else {
                    // Wybierz nową figurę jeśli kliknięto na swoją figurę
                    if (board[row][col] && board[row][col].color === currentPlayer) {
                        selectedPiece = { row, col };
                    } else {
                        selectedPiece = null;
                    }
                }
            } else {
                // Wybór figury
                if (board[row][col] && board[row][col].color === currentPlayer) {
                    selectedPiece = { row, col };
                }
            }
            drawBoard();
            highlightSquares();
        }

        // Podświetlanie pól
        function highlightSquares() {
            if (!selectedPiece) return;

            const squares = document.querySelectorAll('.square');
            squares.forEach(square => {
                const row = parseInt(square.dataset.row);
                const col = parseInt(square.dataset.col);

                if (row === selectedPiece.row && col === selectedPiece.col) {
                    square.classList.add('selected');
                } else if (isValidMove(selectedPiece.row, selectedPiece.col, row, col)) {
                    square.classList.add('valid-move');
                }
            });
        }

        // Aktualizacja wyświetlania tury
        function updateTurnDisplay() {
            const whiteTurn = document.getElementById('white-turn');
            const blackTurn = document.getElementById('black-turn');

            if (currentPlayer === 'white') {
                whiteTurn.classList.add('active');
                blackTurn.classList.remove('active');
            } else {
                blackTurn.classList.add('active');
                whiteTurn.classList.remove('active');
            }
        }

        // Znajdź wszystkie możliwe ruchy dla danego koloru
        function getAllValidMoves(color) {
            const moves = [];
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    const piece = board[fromRow][fromCol];
                    if (piece && piece.color === color) {
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    moves.push({
                                        fromRow, fromCol, toRow, toCol,
                                        piece: piece.type,
                                        captures: board[toRow][toCol] ? board[toRow][toCol].type : null
                                    });
                                }
                            }
                        }
                    }
                }
            }
            return moves;
        }

        // Ocena ruchu dla AI (wyższe = lepsze)
        function evaluateMove(move) {
            let score = 0;

            // Wartości figur
            const pieceValues = { pawn: 1, knight: 3, bishop: 3, rook: 5, queen: 9, king: 0 };

            // Bicia są dobre
            if (move.captures) {
                score += pieceValues[move.captures] * 10;
            }

            // Kontrola centrum (trudny poziom)
            if (aiDifficulty === 'hard') {
                const centerRows = [3, 4];
                const centerCols = [3, 4];
                if (centerRows.includes(move.toRow) && centerCols.includes(move.toCol)) {
                    score += 2;
                }
            }

            return score;
        }

        // AI wykonuje ruch
        function makeAIMove() {
            if (gameOver || pendingPromotion || !GryKit.playing || (gameMode === 'ai' && currentPlayer === playerColor)) return;

            const validMoves = getAllValidMoves(currentPlayer);
            if (validMoves.length === 0) {
                checkGameOver();
                return;
            }

            let move;

            if (aiDifficulty === 'easy') {
                // Łatwy: losowy ruch
                move = validMoves[Math.floor(Math.random() * validMoves.length)];
            } else if (aiDifficulty === 'medium') {
                // Średni: preferuj bicia, inaczej losowy
                const captureMoves = validMoves.filter(m => m.captures);
                if (captureMoves.length > 0) {
                    move = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                } else {
                    move = validMoves[Math.floor(Math.random() * validMoves.length)];
                }
            } else { // hard
                // Trudny: oceniaj ruchy i wybierz najlepszy
                let bestMoves = [];
                let bestScore = -Infinity;

                for (const m of validMoves) {
                    const score = evaluateMove(m);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [m];
                    } else if (score === bestScore) {
                        bestMoves.push(m);
                    }
                }

                move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            }

            // Wykonaj ruch
            const movingPiece = board[move.fromRow][move.fromCol];
            const captured = board[move.toRow][move.toCol];
            lastMove = { fromRow: move.fromRow, fromCol: move.fromCol, toRow: move.toRow, toCol: move.toCol };
            board[move.toRow][move.toCol] = movingPiece;
            board[move.fromRow][move.fromCol] = null;
            movingPiece.hasMoved = true;

            // Roszada - przesuń wieżę
            if (movingPiece.type === 'king' && Math.abs(move.toCol - move.fromCol) === 2) {
                if (move.toCol > move.fromCol) {
                    // Roszada krótka
                    const rook = board[move.toRow][7];
                    board[move.toRow][5] = rook;
                    board[move.toRow][7] = null;
                    rook.hasMoved = true;
                } else {
                    // Roszada długa
                    const rook = board[move.toRow][0];
                    board[move.toRow][3] = rook;
                    board[move.toRow][0] = null;
                    rook.hasMoved = true;
                }
            }

            // Promocja pionka - AI zawsze wybiera hetmana
            if (movingPiece.type === 'pawn' && (move.toRow === 0 || move.toRow === 7)) {
                board[move.toRow][move.toCol] = {
                    type: 'queen',
                    color: movingPiece.color,
                    symbol: pieces[movingPiece.color].queen,
                    hasMoved: true
                };
            }

            currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
            selectedPiece = null;
            drawBoard();
            updateTurnDisplay();

            // Sprawdź koniec gry
            checkGameOver();
            moveFx(captured);
        }

        // Zmiana koloru gracza
        function setPlayerColor(color) {
            playerColor = color;

            // Aktualizuj przyciski - poprawka: znajdź przycisk po zawartości tekstowej
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((color === 'white' && btn.textContent.includes('Białe')) ||
                    (color === 'black' && btn.textContent.includes('Czarne'))) {
                    btn.classList.add('active');
                }
            });

        }

        // Zmiana poziomu trudności AI
        function setDifficulty(difficulty) {
            aiDifficulty = difficulty;

            // Aktualizuj przyciski - poprawka: znajdź przycisk po poziomie trudności
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                const btnText = btn.textContent.toLowerCase();
                if ((difficulty === 'easy' && btnText.includes('łatwy')) ||
                    (difficulty === 'medium' && btnText.includes('średni')) ||
                    (difficulty === 'hard' && btnText.includes('trudny'))) {
                    btn.classList.add('active');
                }
            });
        }

        // Zmiana trybu gry (z ekranu startu GryKit)
        function setMode(mode) {
            gameMode = mode;
            const controlsText = document.getElementById('controls-text');
            if (mode === 'pvp') {
                controlsText.textContent = 'Dwóch graczy na zmianę: kliknij figurę, potem zielone pole.';
            } else if (mode === 'ai') {
                const aiColor = playerColor === 'white' ? 'czarne' : 'białe';
                const playerColorName = playerColor === 'white' ? 'białe' : 'czarne';
                controlsText.textContent = `Grasz jako ${playerColorName}, komputer jako ${aiColor}. Kliknij figurę, potem zielone pole.`;
            } else {
                controlsText.textContent = 'Komputer gra sam ze sobą – jeden ruch na sekundę.';
            }
            resetGame();
        }

        function stopGame() {
            clearTimeout(aiTimeout); aiTimeout = null;
            if (autoPlayInterval) { clearInterval(autoPlayInterval); autoPlayInterval = null; }
            pendingPromotion = null;
            document.getElementById('promotion-overlay').classList.remove('show');
        }

        // Reset gry
        function resetGame() {
            clearTimeout(aiTimeout); aiTimeout = null;
            // Zatrzymaj auto-play jeśli był aktywny
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }

            // Zresetuj stan gry
            gameOver = false;
            pendingPromotion = null;
            lastMove = null;
            document.getElementById('promotion-overlay').classList.remove('show');

            initBoard();
            selectedPiece = null;
            currentPlayer = 'white';
            drawBoard();
            updateTurnDisplay();

            // Jeśli tryb auto, rozpocznij auto-play
            if (gameMode === 'auto') {
                autoPlayInterval = setInterval(() => {
                    makeAIMove();
                }, 1000);
            }
            // Jeśli tryb AI i gracz gra jako czarne, AI zaczyna (białe)
            else if (gameMode === 'ai' && playerColor === 'black') {
                queueAIMove();
            }
        }

        // Start gry: ekran startu GryKit z wyborem trybu
        const optionsEl = document.getElementById('chess-options');
        optionsEl.hidden = false;
        optionsEl.remove();
        GryKit.init({
            id: 'chess',
            title: 'Szachy',
            icon: '♞',
            subtitle: 'Kliknij figurę, a potem zielone pole.',
            board: '#chess-board',
            overlayHost: '.game-stage',
            focus: null,
            pausable: false,
            hud: false,
            extra: optionsEl,
            modes: [
                { id: 'ai', label: 'Z komputerem', desc: 'Kolor i poziom – opcje wyżej' },
                { id: 'pvp', label: 'Dwóch graczy', desc: 'Na zmianę przy jednym ekranie' },
                { id: 'auto', label: 'Komputer kontra komputer', desc: 'Pokaz – oglądasz partię' }
            ],
            fit: { el: '#chess-board', zoom: true, max: 1.8, min: 0.3 },
            onStart(mode) { setMode(mode); },
            onMenu() { stopGame(); gameOver = false; lastMove = null; selectedPiece = null; initBoard(); currentPlayer = 'white'; drawBoard(); updateTurnDisplay(); }
        });
        initBoard();
        drawBoard();
        updateTurnDisplay();
    </script>
</body>
</html>
