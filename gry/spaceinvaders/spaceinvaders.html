    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px; --game-width: min(644px, max(324px, calc(100vh - 286px))); }
        #game-canvas {
            display: block; width: 100%; max-width: min(640px, max(320px, calc(100vh - 290px))) !important; height: auto; background: #000;
            border: 2px solid var(--shell-border); border-radius: 12px; image-rendering: pixelated; touch-action: none;
        }
        .game-status { min-height: 21px; }
        .si-pad { display: none; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; width: 100%; max-width: 360px; margin: 12px auto 0; }
        .si-pad .kit-btn { min-height: 56px; font-size: 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
        @media (hover: none), (max-width: 700px) { .si-pad { display: grid; } }
    </style>
