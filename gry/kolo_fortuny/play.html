<head>

    <title>Koło Fortuny - Hub</title>
    <style>
        body {
            display: flex; flex-direction: column; min-height: 100vh; margin: 0;
            background: var(--shell-bg); color: var(--shell-text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5;
        }
        #main { flex: 1; width: 100%; box-sizing: border-box; padding: 24px 16px 48px; --game-width: 880px; }
        .wheel-layout {
            display: grid; width: 100%; gap: 16px 24px; align-items: start;
            grid-template-columns: minmax(0, 480px) minmax(0, 1fr);
            grid-template-areas: "wheel form" "wheel list";
            grid-template-rows: auto 1fr;
        }
        .wheel-layout > * { box-sizing: border-box; min-width: 0; }
        #left-column { grid-area: wheel; }
        #right-column { grid-area: list; display: flex; flex-direction: column; gap: 12px; }
        .iform {
            grid-area: form; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin: 0;
            padding: 18px; background: var(--shell-card); border: 1px solid var(--shell-border); border-radius: 14px;
        }
        .iform .spin-trigger { grid-column: 1 / -1; }
        .canvas {
            display: block; width: 100%; max-width: 480px; height: auto; margin: 0 auto;
            background: var(--shell-card); border: 1px solid var(--shell-border); border-radius: 14px;
        }
        .winner {
            display: none; margin: 0; padding: 14px 16px; overflow-wrap: anywhere;
            background: var(--shell-soft); border-left: 4px solid var(--shell-accent); border-radius: 10px;
            font-size: 20px; font-weight: 750; line-height: 1.3;
        }
        .list-title { margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--shell-muted); }
        .participants { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
        .participants:empty::before { content: 'Lista jest pusta – dodaj pierwszą osobę lub zadanie.'; color: var(--shell-muted); font-size: 14px; }
        .participants li {
            display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 12px; overflow-wrap: anywhere;
            background: var(--shell-card); border: 1px solid var(--shell-border); border-radius: 999px; font-size: 14px; font-weight: 600;
        }
        .participants li::before { content: ''; flex: 0 0 10px; width: 10px; height: 10px; border-radius: 50%; background: #2563eb; }
        .participants li:nth-child(6n+2)::before { background: #7c3aed; }
        .participants li:nth-child(6n+3)::before { background: #db2777; }
        .participants li:nth-child(6n+4)::before { background: #d97706; }
        .participants li:nth-child(6n+5)::before { background: #059669; }
        .participants li:nth-child(6n)::before { background: #0891b2; }
        @media (max-width: 760px) {
            .wheel-layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "form" "wheel" "list"; grid-template-rows: auto; }
            .iform { padding: 14px; }
        }
    </style>

    <div id="main" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Koło Fortuny</h1><p>Dodaj imiona lub zadania i kliknij Losuj</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Uczestnicy</span><b id="wheel-count">0</b></div>
            </div>
            <div class="game-buttons">
                <button type="button" class="kit-btn small danger reset">Wyczyść</button>
            </div>
        </div>

        <div class="game-stage">
            <div class="wheel-layout">
                <form class="iform" action="#" method="get">
                    <input id="joiner" name="joiner" class="joiner kit-input" aria-label="Imię lub zadanie do losowania" placeholder="Wpisz imię lub zadanie" autocomplete="off" />
                    <button type="button" class="kit-btn add">Dodaj</button>
                    <button type="button" class="kit-btn primary spin-trigger">Losuj</button>
                </form>
                <div id="left-column">
                    <canvas class="canvas" width="500" height="500"></canvas>
                </div>
                <div id="right-column">
                    <p class="winner">Zwycięzca: <span>&nbsp;</span></p>
                    <h2 class="list-title">Na kole</h2>
                    <ul class="participants"></ul>
                </div>
            </div>
        </div>
    </div>
