<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Run - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 32px 16px 24px; --game-width: 804px; }
        #game {
            display: block; width: 100%; max-width: 804px; height: auto; background: #fff;
            border: 2px solid var(--shell-border); border-radius: 12px; touch-action: manipulation; cursor: pointer;
        }
        .game-status { min-height: 21px; }
        .dino-jump { display: none; width: 100%; max-width: 360px; min-height: 64px; margin: 16px auto 0; font-size: 18px; touch-action: manipulation; }
        @media (hover: none), (max-width: 700px) { .dino-jump { display: flex; } }
        .game-stat > b { min-width: 5ch; text-align: center; }
    </style>

</head>

<body class="site-shell game-shell">

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Dino Run</h1><p>Spacja, ↑ lub dotknięcie: skok · P: pauza</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Wynik</span><b id="score">00000</b></div>
                <div class="game-stat"><span>Rekord</span><b id="highscore">00000</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary" type="button" onclick="jump()">Start / skok</button>
                <button class="kit-btn small" id="pause-game" type="button" onclick="setPaused(!paused)">Pauza</button>
                <button class="kit-btn small" type="button" onclick="running=false;start()">Nowa gra</button>
            </div>
        </div>
        <div class="game-stage">
            <canvas id="game" width="800" height="250" tabindex="0" aria-label="Dino. Spacja lub dotknięcie: skok. P: pauza."></canvas>
        </div>
        <p class="game-status msg" id="msg" role="status">Spacja lub kliknij planszę, aby zacząć</p>
        <button class="kit-btn primary dino-jump" type="button" onclick="jump()">Skok</button>
    </div>
    <script>
        const cvs = document.getElementById('game');
        const ctx = cvs.getContext('2d');

        let dino = { x: 60, y: 180, w: 44, h: 47, dy: 0, jumpPower: -14, grounded: true, frame: 0 };
        let obstacles = [], clouds = [], frame = 0, score = 0, speed = 7, running = false, gravity = 0.7;
        let highScore = 0;
        try { highScore = Math.max(0, parseInt(localStorage.getItem('dinoHighScore'), 10) || 0); } catch (_) {}
        let paused = false, lastTime = null, accumulator = 0;
        const stepMs = 1000 / 60;
        document.getElementById('highscore').innerText = highScore.toString().padStart(5, '0');

        // Dino sprite drawing
        function drawDino(x, y, frame) {
            ctx.fillStyle = '#535353';
            // Body
            ctx.fillRect(x + 15, y + 5, 25, 30);
            // Head
            ctx.fillRect(x + 25, y, 19, 20);
            // Eye
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 36, y + 5, 4, 4);
            ctx.fillStyle = '#535353';
            // Tail
            ctx.fillRect(x, y + 10, 18, 12);
            ctx.fillRect(x - 5, y + 15, 8, 7);
            // Mouth
            ctx.fillRect(x + 35, y + 12, 9, 3);
            // Arms
            ctx.fillRect(x + 28, y + 25, 6, 10);
            // Legs animation
            if (dino.grounded && running) {
                if (Math.floor(frame / 5) % 2 === 0) {
                    ctx.fillRect(x + 18, y + 35, 6, 12);
                    ctx.fillRect(x + 30, y + 35, 6, 10);
                } else {
                    ctx.fillRect(x + 18, y + 35, 6, 10);
                    ctx.fillRect(x + 30, y + 35, 6, 12);
                }
            } else {
                ctx.fillRect(x + 18, y + 35, 6, 12);
                ctx.fillRect(x + 30, y + 35, 6, 12);
            }
        }

        // Cactus drawing
        function drawCactus(x, h) {
            ctx.fillStyle = '#2d5a27';
            const baseW = 18;
            ctx.fillRect(x, 227 - h, baseW, h);
            // Arms
            if (h > 35) {
                ctx.fillRect(x - 10, 227 - h + 15, 12, 8);
                ctx.fillRect(x - 10, 227 - h + 8, 5, 15);
                ctx.fillRect(x + baseW - 2, 227 - h + 20, 12, 8);
                ctx.fillRect(x + baseW + 5, 227 - h + 13, 5, 15);
            }
            // Spikes
            ctx.fillStyle = '#1a3d17';
            for (let i = 0; i < h; i += 8) {
                ctx.fillRect(x - 2, 227 - h + i, 2, 3);
                ctx.fillRect(x + baseW, 227 - h + i, 2, 3);
            }
        }

        // Cloud drawing
        function drawCloud(x, y, size) {
            ctx.fillStyle = 'rgba(200, 200, 200, 0.5)';
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size, y - size * 0.3, size * 0.8, 0, Math.PI * 2);
            ctx.arc(x + size * 1.8, y, size * 0.9, 0, Math.PI * 2);
            ctx.fill();
        }

        function start() {
            if (running) return;
            running = true; paused = false; lastTime = null; accumulator = 0;
            document.getElementById("pause-game").textContent = "Pauza";
            document.getElementById('msg').innerText = '';
            dino.y = 180; dino.grounded = true; dino.dy = 0;
            obstacles = []; clouds = []; score = 0; speed = 5; frame = 0;
            // Initial clouds
            for (let i = 0; i < 3; i++) clouds.push({ x: 200 + i * 300, y: 30 + Math.random() * 40, size: 15 + Math.random() * 10 });
            document.getElementById("score").innerText = "00000";
            cvs.focus();
        }

        function step() {
            if (!running || paused) return;
            frame++;
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, 800, 250);

            // Draw clouds
            clouds.forEach(c => { drawCloud(c.x, c.y, c.size); c.x -= speed * 0.3; });
            clouds = clouds.filter(c => c.x > -50);
            if (frame % 150 === 0) clouds.push({ x: 820, y: 30 + Math.random() * 40, size: 15 + Math.random() * 10 });

            // Ground
            ctx.fillStyle = '#535353';
            ctx.fillRect(0, 227, 800, 2);
            // Ground texture
            for (let i = 0; i < 800; i += 20) {
                if ((i + frame * speed) % 40 < 20) {
                    ctx.fillRect(i - (frame * speed) % 800, 232, 8, 2);
                }
            }

            // Dino Physics
            if (!dino.grounded) {
                dino.dy += gravity;
                dino.y += dino.dy;
                if (dino.y >= 180) { dino.y = 180; dino.dy = 0; dino.grounded = true; }
            }
            drawDino(dino.x, dino.y, frame);

            // Spawn obstacles
            if (frame % Math.floor(100 / (speed / 5)) === 0 && Math.random() > 0.4) {
                obstacles.push({ x: 820, h: 35 + Math.random() * 25 });
            }

            // Move and draw obstacles
            obstacles.forEach((obs) => {
                obs.x -= speed;
                drawCactus(obs.x, obs.h);
                // Collision (with smaller hitbox)
                if (dino.x + 20 < obs.x + 14 && dino.x + 40 > obs.x + 4 && dino.y + 47 > 227 - obs.h) {
                    running = false;
                    if (score > highScore) { highScore = score; try { localStorage.setItem('dinoHighScore', highScore); } catch (_) {} document.getElementById('highscore').innerText = highScore.toString().padStart(5, '0'); }
                    document.getElementById('msg').innerText = "Game Over! Spacja by zagrać";
                }
            });
            obstacles = obstacles.filter(o => o.x > -30);

            if (!running) return;
            // Score
            if (frame % 5 === 0) { score++; if (score % 100 === 0) speed = Math.min(12, speed + 0.15); }
            document.getElementById('score').innerText = score.toString().padStart(5, '0');
        }

        // Theme is handled by assets/workshop/shell.js.

        function setPaused(value) {
            if (!running) return;
            paused = !!value; lastTime = null; accumulator = 0;
            document.getElementById('pause-game').textContent = paused ? 'Wznów' : 'Pauza';
            document.getElementById('msg').innerText = paused ? 'Pauza • P lub dotknij planszy, aby wznowić' : '';
            if (!paused) cvs.focus();
        }
        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (lastTime === null) lastTime = timestamp;
            const elapsed = Math.max(0, Math.min(100, timestamp - lastTime));
            lastTime = timestamp;
            if (!running || paused || document.hidden) { accumulator = 0; return; }
            accumulator += elapsed;
            while (accumulator + 0.00001 >= stepMs && running) { step(); accumulator -= stepMs; }
        }
        function jump() {
            if (paused) { setPaused(false); return; }
            if (!running) start();
            if (dino.grounded) { dino.dy = dino.jumpPower; dino.grounded = false; }
        }
        document.addEventListener('keydown', e => {
            if (e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('header,a,input,textarea,select')) return;
            if (!e.target?.closest?.('button') && (e.code === 'Space' || e.code === 'ArrowUp')) { e.preventDefault(); jump(); }
            if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); setPaused(!paused); }
        });
        cvs.addEventListener('click', jump);
        document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); lastTime = null; });
        drawDino(dino.x, dino.y, 0);
        ctx.fillRect(0, 227, 800, 2);
        requestAnimationFrame(loop);
    </script>
</body>

</html>
