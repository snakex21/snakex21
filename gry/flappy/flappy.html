    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .flappy-page { flex: 1; display: flex; flex-direction: column; padding: 24px 16px; --game-width: 720px; }

        .game-container {
            position: relative;
            width: 480px;
            height: 640px;
            background: #70c5ce;
            overflow: hidden;
            border: 4px solid var(--shell-border);
            border-radius: 14px;
            font-family: inherit;
        }

        .bird {
            position: absolute;
            left: 80px;
            top: 280px;
            width: 50px;
            height: 50px;
            background: #f4d03f;
            border-radius: 50%;
            border: 3px solid #000;
        }

        .pipe {
            position: absolute;
            width: 70px;
            background: #2ecc71;
            border: 3px solid #000;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: #ded895;
            border-top: 4px solid #73bf2e;
            z-index: 10;
        }

        .score {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-family: inherit;
            font-size: 4rem;
            line-height: 1;
            font-weight: 800;
            color: white;
            text-shadow: 3px 3px 0 #000;
            z-index: 15;
            pointer-events: none;
        }

        .bird { will-change: transform, top; }
        #game { box-sizing: content-box; flex-shrink: 0; touch-action: manipulation; }
        #game:focus-visible { outline: 3px solid var(--shell-accent); outline-offset: 4px; }
        /* Wąska (pionowa) plansza w niskim oknie: kafelki wyniku w nakładce GryKit mają min-width 92px. */
        .gk-overlay.gk-compact .gk-score div { min-width: 0; flex: 1; padding: 5px 8px; }
    </style>

    <div class="flappy-page" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Flappy Bird</h1><p>Przelatuj między rurami · Spacja / dotknięcie: skok</p></div>
            <div class="game-buttons">
                <button class="kit-btn small primary" type="button" id="new-game">Nowa gra</button>
            </div>
        </div>
        <div class="game-stage">
            <div class="game-container" id="game" tabindex="0" aria-label="Flappy Bird. Dotknij planszy, kliknij lub naciśnij Spację, aby skoczyć. P lub Esc: pauza.">
                <div class="score" id="board-score" aria-hidden="true">0</div>
                <div class="bird" id="bird"></div>
                <div class="ground"></div>
            </div>
        </div>
    </div>

    <script>
    (() => {
        // Plansza 480 × 640 (DOM). Fizyka w stałych krokach 20 ms (jak w pierwotnej wersji na setInterval),
        // pętla na requestAnimationFrame stoi, gdy GryKit nie jest w stanie „playing” (menu / pauza / koniec).
        const STEP = 20, FLOOR = 590, BIRD_X = 80, PIPE_W = 70, GAP = 180, SPAWN_MS = 1500;
        const game = document.getElementById('game');
        const bird = document.getElementById('bird');
        const boardScore = document.getElementById('board-score');

        let birdY, velocity, score, pipes, spawnAcc, acc, last = null;
        const gravity = 0.5;

        // Plansza jest skalowana przez CSS zoom (GryKit.fit); efekty GryKit liczą piksele bez zoomu.
        function zoom() { return parseFloat(game.style.zoom) || 1; }

        function reset() {
            if (pipes) pipes.forEach(p => { p.top.remove(); p.bottom.remove(); });
            pipes = [];
            birdY = 280; velocity = 0; score = 0; spawnAcc = 0; acc = 0;
            boardScore.textContent = '0';
            GryKit.score(0);
            render();
        }

        function jump() {
            if (!GryKit.playing) return;
            velocity = -7;
            GryKit.sfx.play('jump');
        }

        function createPipe() {
            const loc = Math.random() * 280 + 80; // obie rury mieszczą się na polu 590 px (640 − ziemia 50)
            const top = document.createElement('div'); top.className = 'pipe';
            top.style.top = '0'; top.style.height = loc + 'px'; top.style.left = '480px';
            const bottom = document.createElement('div'); bottom.className = 'pipe';
            bottom.style.bottom = '50px'; bottom.style.height = (FLOOR - loc - GAP) + 'px'; bottom.style.left = '480px';
            game.appendChild(top); game.appendChild(bottom);
            pipes.push({ x: 480, loc, top, bottom, scored: false });
        }

        function step() {
            velocity += gravity; birdY += velocity;
            if (birdY + 40 >= FLOOR || birdY + 10 <= 0) { crash(birdY + 40 >= FLOOR ? 'Ptak spadł na ziemię.' : 'Ptak wyleciał za wysoko.'); return; }
            spawnAcc += STEP;
            if (spawnAcc >= SPAWN_MS) { spawnAcc -= SPAWN_MS; createPipe(); }
            for (const p of pipes) {
                p.x -= 3;
                if (p.x + PIPE_W <= BIRD_X && !p.scored) {
                    p.scored = true; score++;
                    boardScore.textContent = score;
                    GryKit.score(score);
                    GryKit.sfx.play('score', { pitch: 1 + Math.min(0.4, score / 100) });
                    const z = zoom();
                    GryKit.fx.float((BIRD_X + 25) * z, (birdY - 10) * z, '+1', { on: game, color: '#fff' });
                }
                // Kolizja (hitbox nieco mniejszy niż grafika): ptak left 80, szer. 50; rura szer. 70.
                if (p.x > 10 && p.x < 130 && (birdY + 10 < p.loc || birdY + 40 > p.loc + GAP)) { crash('Ptak uderzył w rurę.'); return; }
            }
            pipes = pipes.filter(p => { if (p.x < -80) { p.top.remove(); p.bottom.remove(); return false; } return true; });
        }

        function crash(text) {
            render();
            GryKit.fx.flash('#fff', { on: game, strength: 0.6 });
            GryKit.fx.shake(game, 8, 320);
            GryKit.sfx.play('hit');
            // Opóźnienie: wciskana Spacja nie restartuje gry od razu po zderzeniu.
            GryKit.over({ score, text, delay: 550 });
        }

        function render() {
            bird.style.top = birdY + 'px';
            const tilt = Math.max(-25, Math.min(70, velocity * 4));
            bird.style.transform = 'rotate(' + tilt.toFixed(1) + 'deg)';
            for (const p of pipes) { p.top.style.left = p.x + 'px'; p.bottom.style.left = p.x + 'px'; }
        }

        function frame(t) {
            requestAnimationFrame(frame);
            if (last == null) last = t;
            const dt = Math.min(100, t - last); last = t;
            if (!GryKit.playing) { acc = 0; return; }
            acc += dt;
            while (acc >= STEP && GryKit.playing) { acc -= STEP; step(); }
            if (GryKit.playing) render();
        }

        /* ---------- sterowanie (P / Esc = pauza – obsługuje GryKit; Spacja zawsze = skok) ---------- */
        document.addEventListener('keydown', e => {
            if (e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('header,a,input,textarea,select,button')) return;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                if (!GryKit.playing) return;
                e.preventDefault(); jump();
            }
        });
        game.addEventListener('pointerdown', e => {
            if (!e.isPrimary || e.button !== 0 || e.target.closest('button, a, .gk-overlay')) return;
            if (!GryKit.playing) return;
            e.preventDefault(); jump();
        });
        document.getElementById('new-game').addEventListener('click', () => GryKit.start());

        GryKit.init({
            id: 'flappy',
            title: 'Flappy Bird',
            icon: '🐤',
            howTo: ['Skacz i trzymaj ptaka w powietrzu.', 'Każda minięta para rur: +1.'],
            controls: '<kbd>Spacja</kbd> / klik – skok · <kbd>P</kbd> pauza',
            board: game,
            overlayHost: '.game-stage',
            focus: game,
            hud: { score: true, best: true },
            startKeys: ['ArrowUp'],
            fit: { el: game, zoom: true, min: 0.3 },
            onStart() { reset(); acc = 0; last = null; },
            onMenu() { reset(); }
        });
        reset();
        requestAnimationFrame(frame);
    })();
    </script>
</body>

</html>
