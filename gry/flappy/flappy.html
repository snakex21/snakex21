<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Hub</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --header-bg: #ffffff;
            --nav-text: #666;
            --nav-hover: #000;
            --border: #e0e0e0;
            --body-bg: #f0f0f0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #ffffff;
            --header-bg: #1a1a1a;
            --nav-text: #aaa;
            --nav-hover: #fff;
            --border: #333;
            --body-bg: #333;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--body-bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* HEADER */
        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            width: 100%;
            z-index: 100;
            transition: background 0.3s;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--nav-text);
            text-decoration: none;
            transition: 0.2s;
            font-size: 1rem;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--nav-hover);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        @media (max-width: 768px) {
            .nav-links { display: flex; flex: 1; justify-content: flex-end; gap: 0; }
            .nav-links a:not(.active) { display: none; }
        }

        .game-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            position: relative;
            width: 480px;
            height: 640px;
            background: #70c5ce;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .bird {
            position: absolute;
            left: 80px;
            top: 280px;
            width: 50px;
            height: 50px;
            background: #f4d03f;
            border-radius: 50%;
            border: 3px solid #000;
        }

        .pipe {
            position: absolute;
            width: 70px;
            background: #2ecc71;
            border: 3px solid #000;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: #ded895;
            border-top: 4px solid #73bf2e;
            z-index: 10;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            z-index: 20;
        }

        .overlay h2 {
            font-size: 3.5rem;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 1.4rem;
            text-shadow: 2px 2px 0 #000;
        }

        .overlay.hidden {
            display: none;
        }

        .score {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            color: white;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000;
            z-index: 15;
        }

        .btn {
            background: #ff5555;
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.6rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 4px 0 #cc3333;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            background: #ff6666;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc3333;
        }
        #game { flex-shrink: 0; touch-action: manipulation; }
        #game:focus-visible { outline: 3px solid #e6a600; outline-offset: 4px; }
        .game-wrapper { padding: 16px; }
        @media (max-width: 520px) {
            .nav-links { display: flex; flex: 1; justify-content: flex-end; gap: 0; } .nav-links a:not(.active) { display: none; }
            nav { padding: 12px 16px; }
            .game-wrapper { min-height: 650px; align-items: flex-start; overflow: hidden; }
            #game { transform: scale(var(--game-scale, 1)); transform-origin: top center; }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../../index.html" class="logo">Hub</a>
            <div class="nav-links">
                <a href="../gry.html" class="active">Gry</a>
                <a href="../../muzyka/muzyka.html">Muzyka</a>
                <a href="../../filmy/filmy glowna.html">Filmy</a>
                <a href="../../Programy/programy.html">Narzędzia</a>
            </div>
            <button id="theme-toggle">🌙</button>
        </nav>
    </header>

    <div class="game-wrapper">
        <div class="game-container" id="game" tabindex="0" aria-label="Flappy Bird. Dotknij planszy lub naciśnij Spację, aby skoczyć.">
            <div class="score" id="score">0</div>
            <div class="bird" id="bird"></div>
            <div class="ground"></div>

            <div class="overlay" id="start-screen">
                <h2>Flappy Bird</h2>
                <p>Kliknij lub Spacja aby skakać</p>
                <button class="btn" onclick="startGame()">Start</button>
            </div>

            <div class="overlay hidden" id="game-over-screen">
                <h2>Koniec Gry</h2>
                <p>Wynik: <span id="final-score">0</span></p>
                <button class="btn" onclick="resetGame()">Zagraj ponownie</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Logic
        const html = document.documentElement;
        const themeBtn = document.getElementById('theme-toggle');
        let savedTheme = 'dark';
        try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch (_) {}
        html.setAttribute('data-theme', savedTheme);
        themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (_) {}
            themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        // Game Logic
        const game = document.getElementById('game');
        const bird = document.getElementById('bird');
        const scoreEl = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        function resizeGame() { game.style.setProperty('--game-scale', Math.min(1, (window.innerWidth - 32) / 488)); }
        resizeGame(); window.addEventListener('resize', resizeGame);

        let birdY = 280, velocity = 0, gravity = 0.5, isGameRunning = false, score = 0, gameLoop, pipeInterval;
        const pipeTimers = new Set();
        let round = 0;

        function jump() { if (!isGameRunning) return; velocity = -7; }
        document.addEventListener('keydown', (e) => {
            if (e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('button, a, input, textarea, select')) return;
            if (e.code === 'Space') { e.preventDefault(); handleInput(); }
        });
        game.addEventListener('pointerdown', (e) => {
            if (!e.isPrimary || e.button !== 0 || e.target.closest('button, a')) return;
            e.preventDefault(); handleInput();
        });

        function handleInput() {
            if (!isGameRunning && !gameOverScreen.classList.contains('hidden')) resetGame();
            else if (!isGameRunning && startScreen.style.display !== 'none') startGame();
            else jump();
        }

        function createPipe() {
            if (!isGameRunning) return;
            const pipeGap = 180;
            const pipeLoc = Math.random() * 280 + 80; // Both pipes remain on the 590px playing field.
            const pipeTop = document.createElement('div'); pipeTop.className = 'pipe'; pipeTop.style.left = '480px'; pipeTop.style.top = '0'; pipeTop.style.height = pipeLoc + 'px';
            // Poprawka: canvas ma 640px wysokości, ground 50px, więc dostępne 590px
            const pipeBottom = document.createElement('div'); pipeBottom.className = 'pipe'; pipeBottom.style.left = '480px'; pipeBottom.style.bottom = '50px'; pipeBottom.style.height = (590 - pipeLoc - pipeGap) + 'px';
            game.appendChild(pipeTop); game.appendChild(pipeBottom);

            let pipePos = 480;
            let scored = false;
            const createdRound = round;
            const timer = setInterval(() => {
                if (!isGameRunning || createdRound !== round) { clearInterval(timer); pipeTimers.delete(timer); return; }
                pipePos -= 3; pipeTop.style.left = pipePos + 'px'; pipeBottom.style.left = pipePos + 'px';

                // Punktacja
                if (pipePos + 70 <= 80 && !scored) { score++; scoreEl.textContent = score; scored = true; }

                // Usuwanie rur
                if (pipePos < -80) { clearInterval(timer); pipeTimers.delete(timer); pipeTop.remove(); pipeBottom.remove(); return; }

                // Kolizja (hitbox nieco mniejszy niż grafika dla lepszego "feelingu")
                // Ptak: left 80px, width 50px. Rura: width 70px.
                // X: Rura jest w strefie ptaka gdy pipePos < 130 (80+50) i pipePos > 10 (80-70)
                // Y: Ptak uderza góra gdy birdY + buffer < pipeLoc
                // Y: Ptak uderza dół gdy birdY + height - buffer > pipeLoc + pipeGap
                if ((pipePos > 10 && pipePos < 130) &&
                    (birdY + 10 < pipeLoc || birdY + 40 > pipeLoc + pipeGap)) {
                    gameOver();
                }
            }, 20);
            pipeTimers.add(timer);
        }

        function update() {
            if (!isGameRunning) return;
            velocity += gravity; birdY += velocity; bird.style.top = birdY + 'px';
            if (birdY + 40 >= 590 || birdY + 10 <= 0) gameOver();
        }

        function startGame() {
            if (isGameRunning) return;
            startScreen.style.display = 'none'; gameOverScreen.classList.add('hidden');
            isGameRunning = true;
            const startedRound = round;
            gameLoop = setInterval(() => { if (startedRound === round) update(); }, 20);
            pipeInterval = setInterval(() => { if (startedRound === round) createPipe(); }, 1500);
            game.focus();
        }
        function clearTimers() {
            clearInterval(gameLoop); clearInterval(pipeInterval);
            pipeTimers.forEach(timer => clearInterval(timer)); pipeTimers.clear();
            round++;
        }
        function gameOver() {
            if (!isGameRunning) return;
            isGameRunning = false; clearTimers();
            gameOverScreen.classList.remove('hidden'); finalScoreEl.textContent = score;
            gameOverScreen.querySelector('button').focus();
        }
        function resetGame() {
            isGameRunning = false; clearTimers();
            document.querySelectorAll('.pipe').forEach(p => p.remove());
            birdY = 280; velocity = 0; score = 0; scoreEl.textContent = '0'; bird.style.top = '280px';
            gameOverScreen.classList.add('hidden'); startGame();
        }
    </script>
</body>

</html>
