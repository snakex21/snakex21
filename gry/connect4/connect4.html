<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czwórki - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-area { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 40px; --game-width: 520px; }
        .status {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
            margin-top: 16px; font-size: 16px; font-weight: 650; color: var(--shell-text);
        }
        .turn-indicator {
            display: inline-block; width: 22px; height: 22px; border-radius: 50%;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18);
        }
        .board {
            box-sizing: border-box; width: min(100%, 500px); padding: 10px;
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
            background: #1d4f91; border-radius: 14px;
            box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .18);
        }
        .col {
            display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 3px;
            border-radius: 8px; cursor: pointer; transition: background .2s;
        }
        .col:hover { background: rgba(255, 255, 255, .12); }
        .col:focus-visible { outline: 3px solid #fff; outline-offset: -1px; }
        .slot {
            width: 100%; aspect-ratio: 1; border-radius: 50%;
            background: var(--shell-bg); border: 2px solid #163d70;
            box-sizing: border-box; transition: background .3s;
        }
        .red { background: #e5483f !important; }
        .yellow { background: #f5b82e !important; }
    </style>

    <div class="game-area" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Czwórki</h1><p>Wrzucajcie pionki na zmianę — cztery w linii wygrywają</p></div>
            <div class="game-buttons">
                <button class="kit-btn small primary reset-btn" type="button" onclick="resetGame()">Nowa gra</button>
            </div>
        </div>
        <div class="game-stage">
            <div class="board" id="board" aria-label="Plansza Czwórek"></div>
        </div>
        <p class="game-status status" role="status">Tura gracza: <span id="turn-color" class="turn-indicator red"></span></p>
    </div>

    <script>
        const rows = 6;
        const cols = 7;
        let board = [];
        let currentPlayer = 1;
        let gameOver = false;

        function init() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = Array(cols).fill().map(() => Array(rows).fill(0));

            for (let c = 0; c < cols; c++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'col';
                colDiv.onclick = () => dropToken(c);
                colDiv.tabIndex = 0; colDiv.setAttribute('role', 'button');
                colDiv.setAttribute('aria-label', `Wrzuć pionek do kolumny ${c + 1}`);
                colDiv.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dropToken(c); } });

                for (let r = 0; r < rows; r++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.id = `slot-${c}-${rows - 1 - r}`;
                    colDiv.appendChild(slot);
                }
                boardEl.appendChild(colDiv);
            }
            gameOver = false;
            currentPlayer = 1;
            updateStatus();
        }

        function dropToken(col) {
            if (gameOver) return;
            const row = board[col].indexOf(0);
            if (row === -1) return;

            board[col][row] = currentPlayer;
            const slotReal = document.getElementById(`slot-${col}-${row}`);
            slotReal.classList.add(currentPlayer === 1 ? 'red' : 'yellow');

            if (checkWin(col, row)) {
                document.querySelector('.status').innerText = (currentPlayer === 1 ? "Czerwony" : "Żółty") + " Wygrywa!";
                gameOver = true;
            } else if (board.every(column => column.every(Boolean))) {
                document.querySelector('.status').textContent = 'Remis! Plansza jest pełna.';
                gameOver = true;
            } else {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateStatus();
            }
        }

        function checkWin(c, r) {
            const player = board[c][r];
            return checkDir(c, r, 1, 0, player) ||
                checkDir(c, r, 0, 1, player) ||
                checkDir(c, r, 1, 1, player) ||
                checkDir(c, r, 1, -1, player);
        }

        function checkDir(c, r, dx, dy, p) {
            let count = 0;
            for (let i = -3; i <= 3; i++) {
                const nc = c + i * dx;
                const nr = r + i * dy;
                if (nc >= 0 && nc < cols && nr >= 0 && nr < rows && board[nc][nr] === p) {
                    count++;
                    if (count === 4) return true;
                } else {
                    count = 0;
                }
            }
            return false;
        }

        function updateStatus() {
            const ind = document.getElementById('turn-color');
            ind.className = 'turn-indicator ' + (currentPlayer === 1 ? 'red' : 'yellow');
        }

        function resetGame() {
            document.querySelector('.status').innerHTML = 'Tura gracza: <span id="turn-color" class="turn-indicator red"></span>';
            init();
        }

        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        init();
    </script>
