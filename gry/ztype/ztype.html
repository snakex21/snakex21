    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 32px; --game-width: 900px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #game-area {
            position: relative; overflow: hidden; box-sizing: border-box; width: 100%;
            height: min(62vh, 620px); min-height: 380px;
            background: radial-gradient(ellipse at 50% 120%, #14263a 0%, #0a111c 60%); border: 2px solid var(--shell-border); border-radius: 12px;
            font-family: var(--kit-mono); outline: none;
        }
        #game-area:focus-visible { border-color: var(--shell-accent); }
        .enemy { position: absolute; font-size: 1.4rem; font-weight: 700; color: #8ef59b; text-shadow: 0 0 8px rgba(110, 255, 140, .55); white-space: nowrap; }
        .enemy span { transition: color 0.1s; }
        .enemy .matched { color: #ffd84a; text-shadow: 0 0 10px #ffb800; }
        .ship {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
            border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid #8ef59b;
            filter: drop-shadow(0 0 8px rgba(110, 255, 140, .5));
        }
        .laser { position: absolute; width: 2px; height: 20px; background: #ffd84a; }
        .game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none;
            box-sizing: border-box; width: min(88%, 440px); padding: 20px 24px; border-radius: 12px;
            background: rgba(10, 17, 28, .82); border: 1px solid rgba(255, 255, 255, .14);
            color: #f2f5f0; font: 700 1.4rem/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center;
        }
        .game-over small { display: block; margin-top: 6px; font-size: .95rem; font-weight: 500; color: #b8c4bd; }
        .type-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: var(--game-width); margin: 12px auto 0; }
        .type-row label { flex: none; font-size: 13px; font-weight: 650; color: var(--shell-muted); }
        .type-row .kit-input { flex: 1; min-width: 0; width: auto; font-family: var(--kit-mono); text-transform: uppercase; letter-spacing: 1px; }
        @media (max-width: 560px) { #game-area { height: 52vh; min-height: 320px; } .enemy { font-size: 1.15rem; } }
    </style>

    <main class="game-wrapper">
        <div class="game-bar">
            <div class="game-title"><h1>Z-Type</h1><p>Wpisuj litery nadlatujących słów, zanim dolecą do statku · Enter: start · Esc: pauza</p></div>
            <div class="game-stats"><div class="game-stat"><span>Wynik</span><b id="score">0</b></div></div>
            <div class="game-buttons">
                <button class="kit-btn small primary" id="start-game" type="button" onclick="startGame()">Start / nowa gra</button>
                <button class="kit-btn small" id="pause-game" type="button" onclick="setPaused(!paused)">Pauza</button>
            </div>
        </div>
        <div class="game-stage">
            <div id="game-area" tabindex="-1" aria-label="Plansza Z-Type">
                <div class="ship" id="ship"></div>
                <div class="game-over" id="go" role="status">Z-Type<br><small>Naciśnij Start lub Enter, potem wpisuj litery nadlatujących słów</small></div>
            </div>
        </div>
        <div class="type-row"><label for="typing-input">Klawiatura</label><input id="typing-input" class="kit-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Pisz litery…" aria-label="Wpisuj litery słów"></div>
    </main>

    <script>
        const words = ["KOD", "JAVA", "HTML", "CSS", "NODE", "REACT", "DATA", "BIT", "BYTE", "PIXEL", "LINUX", "SERVER", "CLOUD", "WIFI", "MOUSE", "SCREEN", "LOGIC", "ARRAY", "LOOP", "INPUT", "OUTPUT", "FILE", "DISK", "ERROR", "DEBUG"];

        const area = document.getElementById('game-area');
        const scoreEl = document.getElementById('score');
        const ship = document.getElementById('ship');

        let enemies = [], score = 0, activeTarget = null, spawnRate = 2000;
        let gameOver = false, started = false, paused = false, lastTime = null, spawnElapsed = 0;
        const message = document.getElementById('go');
        const input = document.getElementById('typing-input');
        message.style.display='block';
        function startGame() {
            enemies.forEach(e=>e.el.remove());area.querySelectorAll('.laser').forEach(e=>e.remove());
            enemies=[];score=0;activeTarget=null;spawnRate=2000;spawnElapsed=1000;lastTime=null;gameOver=false;started=true;paused=false;
            scoreEl.textContent=0;message.style.display='none';document.getElementById('pause-game').textContent='Pauza';
            input.value='';input.focus();
        }
        function setPaused(value) {
            if(!started||gameOver)return;
            paused=!!value;lastTime=null;message.textContent='Pauza';message.style.display=paused?'block':'none';
            document.getElementById('pause-game').textContent=paused?'Wznów':'Pauza';if(!paused)input.focus();
        }
        function spawn() {
            if(!started||gameOver||paused)return;
            const word=words[Math.floor(Math.random()*words.length)],div=document.createElement('div');
            div.className='enemy';
            const width=area.getBoundingClientRect().width||window.innerWidth;
            div.style.left=(12+Math.random()*Math.max(0,width-word.length*16-24))+'px';div.style.top='-30px';
            div.innerHTML=word.split('').map(l=>`<span>${l}</span>`).join('');area.appendChild(div);
            enemies.push({el:div,word,progress:0,x:parseFloat(div.style.left),y:-30});spawnRate=Math.max(700,spawnRate-40);
        }
        function update(timestamp) {
            requestAnimationFrame(update);
            if(lastTime===null)lastTime=timestamp;
            const dt=Math.max(0,Math.min(100,timestamp-lastTime));lastTime=timestamp;
            if(!started||gameOver||paused||document.hidden)return;
            spawnElapsed+=dt;if(spawnElapsed>=spawnRate){spawnElapsed-=spawnRate;spawn();}
            const bottom=(area.getBoundingClientRect().height||400)-65;
            for(const e of enemies){e.y+=30*dt/1000;e.el.style.top=e.y+'px';if(e.y>=bottom){gameOver=true;message.textContent=`Koniec gry • wynik: ${score}. Naciśnij Start / nowa gra`;message.style.display='block';break;}}
        }
        function shoot(x,y) {
            const laser=document.createElement('div');laser.className='laser';area.appendChild(laser);
            if(!laser.animate){laser.remove();return;}
            const animation=laser.animate([{left:'50%',bottom:'60px',opacity:1},{left:(x+20)+'px',top:y+'px',opacity:0}],{duration:200,fill:'forwards'});
            animation.onfinish=()=>laser.remove();
        }
        function typeLetter(char) {
            if(!started||gameOver||paused||!/^[A-Z]$/.test(char))return;
            if(!activeTarget){activeTarget=enemies.filter(e=>e.word.startsWith(char)).sort((a,b)=>b.y-a.y)[0]||null;if(activeTarget)Array.from(activeTarget.el.children).forEach(el=>el.classList.add('target'));}
            if(!activeTarget||activeTarget.word[activeTarget.progress]!==char)return;
            activeTarget.el.children[activeTarget.progress++].classList.add('matched');shoot(activeTarget.x,activeTarget.y);
            if(activeTarget.progress===activeTarget.word.length){activeTarget.el.remove();enemies=enemies.filter(e=>e!==activeTarget);activeTarget=null;score+=10;scoreEl.textContent=score;}
        }
        document.addEventListener('keydown',e=>{
            if(e.altKey||e.ctrlKey||e.metaKey||e.isComposing)return;
            if(e.code==='Escape'&&!e.repeat){e.preventDefault();setPaused(!paused);return;}
            if(e.target===input||e.target?.closest?.('button,a,input,textarea,select'))return;
            if(e.code==='Enter'&&!e.repeat){e.preventDefault();if(!started||gameOver)startGame();else if(paused)setPaused(false);return;}
            if(!e.repeat&&/^[a-z]$/i.test(e.key)){e.preventDefault();typeLetter(e.key.toUpperCase());}
        });
        input.addEventListener('input',e=>{if(e.isComposing)return;for(const char of input.value.toUpperCase())typeLetter(char);input.value='';});
        document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);lastTime=null;});
        requestAnimationFrame(update);
    </script>
</body>
