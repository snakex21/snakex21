    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Tower Stack</h1><p>Spacja, Enter lub klik: postaw blok · P / Esc: pauza</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Piętro</span><b id="score">0</b></div>
                <div class="game-stat"><span>Rekord</span><b id="highscore">0</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary" type="button" id="new-game">Nowa gra</button>
            </div>
        </div>
        <div class="game-stage">
            <canvas id="game" width="400" height="500" tabindex="0" role="button" aria-label="Tower Stack. Spacja, Enter albo klik: postaw blok. P lub Esc: pauza."></canvas>
        </div>
        <p class="game-status" id="game-status" role="status">Spacja / Enter / klik na planszy: postaw blok · P / Esc: pauza</p>
    </div>
    <script>
    (() => {
        // Plansza logiczna 400 × 500; GryKit.fit skaluje canvas do okna (bufor ostry na HiDPI).
        const W = 400, H = 500;
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let blocks = [], currentBlock = null, speed = 2, direction = 1, score = 0, gameOver = true, width = 140;
        let particles = [], perfectStreak = 0;
        let lastFrameTime = null;

        const colors = [
            ['#ff6b6b', '#ee5a5a'], ['#feca57', '#f7b928'], ['#48dbfb', '#0abde3'],
            ['#ff9ff3', '#f368e0'], ['#54a0ff', '#2e86de'], ['#5f27cd', '#341f97'],
            ['#00d2d3', '#01a3a4'], ['#ff6b81', '#ff4757'], ['#7bed9f', '#2ed573']
        ];
        function getColor(index) { return colors[index % colors.length]; }

        function init() {
            blocks = [];
            particles = [];
            score = 0;
            width = 140;
            perfectStreak = 0;
            speed = 2;
            direction = 1;
            gameOver = false;
            const c = getColor(0);
            blocks.push({ x: 130, y: 450, w: 140, h: 30, color: c[0], shadow: c[1] });
            spawnNext();
            GryKit.score(0);
            lastFrameTime = null;
        }

        function spawnNext() {
            const prev = blocks[blocks.length - 1];
            const c = getColor(blocks.length);
            currentBlock = { x: 0, y: prev.y - 30, w: width, h: 30, color: c[0], shadow: c[1] };
            if (currentBlock.y < 150) {
                blocks.forEach(b => b.y += 30);
                currentBlock.y += 30;
            }
        }

        function createParticles(x, y, w, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({ x: x + Math.random() * w, y: y, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 5 - 2, size: 4 + Math.random() * 4, color: color, life: 1 });
            }
        }

        function place() {
            if (gameOver || !GryKit.playing) return;
            const prev = blocks[blocks.length - 1];
            const curr = currentBlock;
            const diff = curr.x - prev.x;

            if (Math.abs(diff) >= curr.w) {
                gameOver = true;
                createParticles(curr.x, curr.y, curr.w, curr.shadow);
                GryKit.fx.shake(canvas, 8, 340);
                GryKit.fx.flash('#d05c5c', { on: canvas, strength: 0.35 });
                GryKit.sfx.play('wall');
                GryKit.over({ score, title: 'Wieża skończona', icon: '🏗️', text: score ? 'Klocek minął wieżę. Zbudowane piętra: ' + score + '.' : 'Klocek minął wieżę.', delay: 450 });
                return;
            }

            if (Math.abs(diff) < 5) {
                curr.x = prev.x;
                curr.w = prev.w;
                width = prev.w;
                perfectStreak++;
                if (perfectStreak >= 2) { width = Math.min(width + 5, 140); curr.w = width; }
                const label = perfectStreak >= 2 ? 'Idealnie! ×' + perfectStreak : 'Idealnie!';
                GryKit.fx.float(curr.x + curr.w / 2, curr.y - 8, label, { on: canvas, color: '#ffd700', size: perfectStreak >= 2 ? 26 : 22 });
                GryKit.sfx.play('coin', { pitch: 1 + Math.min(0.4, (perfectStreak - 1) * 0.08) });
            } else {
                perfectStreak = 0;
                createParticles(diff > 0 ? prev.x + prev.w : curr.x, curr.y, Math.abs(diff), curr.shadow);
                if (diff > 0) { curr.w -= diff; } else { curr.w += diff; curr.x = prev.x; }
                width = curr.w;
                if (Math.abs(diff) >= 12) {
                    // Wyraźne przycięcie: wstrząs i głuchy dźwięk
                    GryKit.fx.shake(canvas, Math.min(7, 2 + Math.abs(diff) / 12), 220);
                    GryKit.sfx.play('hit');
                } else {
                    GryKit.sfx.play('tap');
                }
            }

            blocks.push(curr);
            score++;
            GryKit.score(score);
            speed = Math.min(speed + 0.06, 5);
            spawnNext();
        }

        function loop(timestamp) {
            const frame = lastFrameTime === null || document.hidden ? 0 : Math.max(0, Math.min(timestamp - lastFrameTime, 50)) / (1000 / 60);
            lastFrameTime = timestamp;
            requestAnimationFrame(loop);
            const live = GryKit.playing ? frame : 0;   // ruch klocka tylko w trakcie gry
            const fxStep = GryKit.paused ? 0 : frame;   // cząsteczki dogrywają się też po końcu gry, ale stoją w pauzie

            const k = GryKit.ratio(canvas);
            ctx.setTransform(k, 0, 0, k, 0, 0);
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(1, '#16213e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = 0; i < 30; i++) { ctx.fillRect((i * 47) % W, (i * 31) % 300, 2, 2); }

            if (currentBlock && !gameOver) {
                currentBlock.x += speed * direction * live;
                if (currentBlock.x + currentBlock.w > W) { currentBlock.x = W - currentBlock.w; direction = -1; }
                if (currentBlock.x < 0) { currentBlock.x = 0; direction = 1; }
            }

            [...blocks, currentBlock].filter(Boolean).forEach(b => {
                ctx.fillStyle = b.shadow;
                ctx.fillRect(b.x + 3, b.y + 3, b.w, b.h);
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(b.x, b.y, b.w, 5);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            });

            particles.forEach(p => {
                p.x += p.vx * fxStep; p.y += p.vy * fxStep; p.vy += 0.3 * fxStep; p.life -= 0.02 * fxStep;
                if (p.life > 0) { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1; }
            });
            particles = particles.filter(p => p.life > 0);
        }

        document.addEventListener('keydown', e => {
            if (e.repeat || e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('header,a,input,textarea,select,button')) return;
            if (e.code === 'Space' || (e.code === 'Enter' && e.target === canvas)) {
                if (!GryKit.playing) return;
                e.preventDefault();
                place();
            }
        });
        canvas.addEventListener('pointerdown', e => { if (e.isPrimary === false || e.button > 0) return; place(); });
        document.getElementById('new-game').addEventListener('click', () => GryKit.start());

        GryKit.init({
            id: 'tower-stack',
            legacyBestKey: 'towerHighScore',
            title: 'Tower Stack',
            icon: '🏗️',
            howTo: ['Postaw przesuwający się klocek na wieży – wystająca część odpada.', 'Idealne trafienie nie ucina klocka, a seria idealnych go poszerza.', 'Klocek, który całkiem minie wieżę, kończy grę.'],
            controls: '<kbd>Spacja</kbd> / <kbd>Enter</kbd> albo klik: postaw blok · <kbd>P</kbd>/<kbd>Esc</kbd> pauza',
            board: canvas,
            focus: canvas,
            scoreLabel: 'Piętro',
            hud: { score: '#score', best: '#highscore' },
            fit: { el: canvas, width: W, height: H, max: 1.3, sharp: true },
            onStart() { init(); },
            onPause() { lastFrameTime = null; },
            onMenu() { init(); gameOver = true; }
        });
        init();
        gameOver = true;
        requestAnimationFrame(loop);
    })();
    </script>
</body>
