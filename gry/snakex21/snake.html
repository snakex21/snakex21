        [data-theme="dark"] {

            --nav-hover: #fff;
            --border: #333;
            --canvas-border: #333;
            --canvas-shadow: rgba(0, 255, 0, 0.1);

        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; transition: background 0.3s, color 0.3s; }
        
        /* HEADER */
        header { background: var(--header-bg); border-bottom: 1px solid var(--border); width: 100%; z-index: 100; transition: background 0.3s, border 0.3s; }
        nav { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; flex: 1; }
        .nav-links a { color: var(--nav-text); text-decoration: none; transition: 0.2s; font-size: 1rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--nav-hover); }
        
        #theme-toggle { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.5rem; }

        @media (max-width: 768px) { .nav-links { display: none; } }

        .game-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .score-board { display: flex; gap: 20px; margin-bottom: 15px; font-size: 1.2rem; }

        .controls { margin-top: 20px; display: none; gap: 10px; }

            .btn { padding: 15px; background: #333; border: none; color: white; border-radius: 8px; font-size: 1.5rem; }

        }
        canvas { max-width: calc(100vw - 32px); height: auto; touch-action: none; }
        .game-wrapper { padding: 16px; }
        .round-controls button { padding: 10px 16px; border-radius: 8px; cursor: pointer; }
        #game-status { max-width: 400px; text-align: center; }

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="score-board">
            <span>Wynik: <span id="score">0</span></span>
            <span>Rekord: <span id="high-score">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400" tabindex="0" aria-label="Plansza Snake"></canvas>
        <p id="game-status" role="status">Strzałki rozpoczynają grę. P: pauza.</p>
        <div class="round-controls"><button type="button" onclick="newGame()">Nowa gra</button> <button id="pause-game" type="button" onclick="setPaused(!paused)">Pauza</button></div>

        <div class="controls">
            <div></div>
            <button class="btn" onclick="changeDirection({keyCode: 38})">⬆️</button>
            <div></div>
            <button class="btn" onclick="changeDirection({keyCode: 37})">⬅️</button>
            <button class="btn" onclick="changeDirection({keyCode: 40})">⬇️</button>
            <button class="btn" onclick="changeDirection({keyCode: 39})">➡️</button>
        </div>
    </div>

    <script>
        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        // Game Logic
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const statusElement = document.getElementById('game-status');
        const gridSize = 20, tileCount = canvas.width / gridSize;
        let speed = 7, score = 0, highScore = 0;
        try { highScore = Math.max(0, parseInt(localStorage.getItem('snake_highscore'), 10) || 0); } catch (_) {}
        highScoreElement.textContent = highScore;
        let velocityX = 1, velocityY = 0;
        let snake = [{x:10,y:10}], food = {x:15,y:15};
        let gameInterval, isGameRunning = false, paused = false, directionChanged = false, round = 0, ended = false;
        function scheduleTick() {
            clearInterval(gameInterval);
            const startedRound = ++round;
            gameInterval = setInterval(() => { if (startedRound === round) update(); }, 1000 / speed);
        }
        function startGame() {
            if (isGameRunning) return;
            if (ended) resetGame();
            isGameRunning = true; paused = false; directionChanged = false;
            statusElement.textContent = 'Strzałki: ruch · P: pauza';
            scheduleTick();
            canvas.focus();
        }
        function setPaused(value) {
            if (!isGameRunning) return;
            paused = !!value;
            document.getElementById('pause-game').textContent = paused ? 'Wznów' : 'Pauza';
            statusElement.textContent = paused ? 'Pauza · P lub Wznów, aby kontynuować' : 'Strzałki: ruch · P: pauza';
            if (!paused) canvas.focus();
        }
        function finish(won = false) {
            clearInterval(gameInterval); ++round; isGameRunning = false; paused = false; ended = true;
            statusElement.textContent = `${won ? 'Wygrana!' : 'Koniec gry!'} Wynik: ${score}. Strzałka lub Nowa gra: zagraj ponownie.`;
        }
        function update() {
            if (!isGameRunning || paused || document.hidden) return;
            directionChanged = false;
            const head = {x:(snake[0].x + velocityX + tileCount) % tileCount, y:(snake[0].y + velocityY + tileCount) % tileCount};
            const eating = food && head.x === food.x && head.y === food.y;
            // The tail vacates its cell during a non-growing move.
            const body = eating ? snake : snake.slice(0, -1);
            if (body.some(part => part.x === head.x && part.y === head.y)) { finish(); return; }
            snake.unshift(head);
            if (eating) {
                score += 10; scoreElement.textContent = score;
                if (score > highScore) { highScore = score; highScoreElement.textContent = highScore; try { localStorage.setItem('snake_highscore', highScore); } catch (_) {} }
                if (score % 50 === 0) { speed = Math.min(18, speed + 1); scheduleTick(); }
                placeFood();
            } else snake.pop();
            draw();
        }
        function draw() {
            ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0,0,canvas.width,canvas.height);
            snake.forEach((part,index) => { ctx.fillStyle = index ? '#1db954' : '#1ed760'; ctx.fillRect(part.x*gridSize,part.y*gridSize,gridSize-2,gridSize-2); });
            if (food) { ctx.fillStyle='#ff5555';ctx.beginPath();ctx.arc(food.x*gridSize+10,food.y*gridSize+10,8,0,Math.PI*2);ctx.fill(); }
        }
        function placeFood() {
            const occupied = new Set(snake.map(part => part.y * tileCount + part.x));
            const free = [];
            for (let i=0;i<tileCount*tileCount;i++) if (!occupied.has(i)) free.push(i);
            if (!free.length) { food = null; finish(true); return; }
            const cell = free[Math.floor(Math.random()*free.length)];
            food = {x:cell%tileCount,y:Math.floor(cell/tileCount)};
        }
        function resetGame() {
            clearInterval(gameInterval); ++round; isGameRunning=false; paused=false; ended=false; directionChanged=false;
            snake=[{x:10,y:10}];score=0;speed=7;velocityX=1;velocityY=0;
            scoreElement.textContent=0;document.getElementById('pause-game').textContent='Pauza';
            statusElement.textContent='Strzałki rozpoczynają grę. P: pauza.';
            placeFood();draw();
        }
        function newGame() { resetGame(); startGame(); canvas.focus(); }
        function changeDirection(event) {
            if (event.altKey || event.ctrlKey || event.metaKey || event.target?.closest?.('header,a,input,textarea,select')) return;
            const key = event.keyCode || ({ArrowLeft:37,ArrowUp:38,ArrowRight:39,ArrowDown:40})[event.key];
            if (event.code === 'KeyP' || event.code === 'Escape') { event.preventDefault?.(); if (!event.repeat) setPaused(!paused); return; }
            if (event.target?.closest?.('button') || ![37,38,39,40].includes(key)) return;
            event.preventDefault?.();
            if (paused) return;
            if (!isGameRunning) startGame();
            if (directionChanged) return;
            const [x,y] = ({37:[-1,0],38:[0,-1],39:[1,0],40:[0,1]})[key];
            if (snake.length > 1 && x === -velocityX && y === -velocityY) return;
            velocityX=x;velocityY=y;directionChanged=true;
        }
        document.addEventListener('keydown',changeDirection);
        document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});
        draw();
    </script>
