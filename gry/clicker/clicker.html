    <style>
        /* Terminal palette for the board only; the page frame uses the shell tokens. */
        /* Plansza = ekran terminala: zawsze ciemny, zielony monospace (celowy styl gry); reszta strony w tokenach shell. */
        body {
            --text-main: #5dff7a;
            --text-dim: #3fbf58;
            --terminal-bg: #06120a;
            --terminal-border: #1f6b33;
            --btn-bg: #081a0d;
            --btn-border: #3ddc62;
            --btn-text: #7dff97;
            --btn-hover-shadow: #2fe05a;
            --upgrade-off: #4d6654;
            display: flex; flex-direction: column; min-height: 100vh; margin: 0;
            background: var(--shell-bg); color: var(--shell-text);
        }

        .game-wrapper { flex: 1; width: 100%; box-sizing: border-box; padding: 24px 16px 24px; --game-width: 1040px; }
        .game-bar .game-stat > b { min-width: 3ch; text-align: center; }

        .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            width: min(1040px, calc(100vw - 32px));
            align-items: start;
        }

        .terminal {
            box-sizing: border-box;
            border: 1px solid var(--terminal-border);
            padding: 1rem;
            border-radius: 10px;
            background:
                repeating-linear-gradient(0deg, rgba(93, 255, 122, .035) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at 50% 0%, #0b2414, var(--terminal-bg) 70%);
            color: var(--text-main);
            font-family: var(--kit-mono);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, .55), 0 10px 26px rgba(10, 30, 16, .18);
            text-shadow: 0 0 6px rgba(93, 255, 122, .35);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .terminal-header {
            border-bottom: 1px solid var(--terminal-border);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .per-sec {
            margin: 0 0 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }

        .hack-btn {
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--btn-text);
            padding: 2.5rem 1rem;
            font-size: 1.6rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: box-shadow 0.1s, background 0.1s, color 0.1s, transform .06s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 8px var(--btn-hover-shadow);
            touch-action: manipulation;
        }

        .hack-btn:active {
            background: var(--btn-border);
            color: var(--btn-bg);
            transform: scale(.98);
        }

        .hack-btn:hover, .hack-btn:focus-visible {
            box-shadow: 0 0 15px var(--btn-hover-shadow);
            outline: none;
        }

        .upgrade-list { display: flex; flex-direction: column; gap: 10px; }

        .upgrade-item {
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        /* Pasek postępu do kolejnego zakupu */
        .upgrade-item::before {
            content: ""; position: absolute; left: 0; bottom: 0; height: 3px;
            width: calc(var(--p, 0) * 100%); background: var(--text-dim); opacity: .7; transition: width .2s linear;
        }
        .upgrade-item:not(.disabled)::before { background: var(--text-main); opacity: 1; }

        .upgrade-item:hover:not(.disabled), .upgrade-item:focus-visible {
            background: rgba(60, 220, 100, 0.14);
            outline: none;
        }

        .upgrade-item.disabled {
            cursor: not-allowed;
            border-color: var(--upgrade-off);
            color: var(--upgrade-off);
            pointer-events: none;
        }

        .upgrade-info { min-width: 0; }
        .upgrade-info h4 { margin: 0 0 4px; font-size: 1rem; }
        .upgrade-info p { margin: 0; font-size: 0.8rem; opacity: 0.8; }
        .upgrade-item.bought { animation: bought .4s ease-out; }
        @keyframes bought { 0% { background: rgba(93, 255, 122, .45); } 100% { background: transparent; } }
        .upgrade-cost { flex: 0 0 auto; font-weight: bold; white-space: nowrap; }

        .log-area {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--terminal-border);
            height: 120px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
        }

        @media (max-height: 640px) { .game-wrapper { padding-top: 12px; padding-bottom: 12px; } .game-bar { margin-bottom: 10px; } }
        @media (max-width: 760px) {
            .container { grid-template-columns: minmax(0, 1fr); }
            .hack-btn { padding: 1.8rem 1rem; font-size: 1.35rem; }
            .log-area { height: 96px; }
        }
    </style>

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Hacker Tycoon</h1><p>Klikaj HAKUJ, kupuj ulepszenia i generuj bity automatycznie</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Bity</span><b id="bits">0</b></div>
                <div class="game-stat"><span>Bity / s</span><b id="gps">0</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small danger" id="resetBtn" type="button">Reset postępu</button>
            </div>
        </div>

        <div class="game-stage">
            <div class="container">
                <div class="terminal">
                    <div class="terminal-header">/// PROCES_GŁÓWNY</div>
                    <p class="per-sec">+1 bit / klik · postęp zapisuje się automatycznie</p>
                    <button class="hack-btn" id="hackBtn" type="button">&gt; HAKUJ_</button>
                    <div class="log-area" id="log" aria-live="polite"></div>
                </div>

                <div class="terminal">
                    <div class="terminal-header">/// MODUŁ_ULEPSZEŃ</div>
                    <div class="upgrade-list" id="upgradeList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        // Game Logic
        const defaultUpgrades = [
            { id: 'script', name: 'Prosty skrypt', cost: 15, gps: 0.5, count: 0 },
            { id: 'bot', name: 'Bot IRC', cost: 100, gps: 3, count: 0 },
            { id: 'gpu', name: 'Koparka GPU', cost: 500, gps: 10, count: 0 },
            { id: 'server', name: 'Serwer dedykowany', cost: 2000, gps: 50, count: 0 },
            { id: 'ai', name: 'Asystent AI', cost: 10000, gps: 250, count: 0 },
            { id: 'quantum', name: 'Rdzeń kwantowy', cost: 50000, gps: 1000, count: 0 }
        ];

        const state = {
            bits: 0,
            gps: 0,
            clickValue: 1,
            upgrades: JSON.parse(JSON.stringify(defaultUpgrades))
        };

        const els = {
            bits: document.getElementById('bits'),
            gps: document.getElementById('gps'),
            hackBtn: document.getElementById('hackBtn'),
            resetBtn: document.getElementById('resetBtn'),
            list: document.getElementById('upgradeList'),
            log: document.getElementById('log')
        };

        const fmt = n => Number(n).toLocaleString('pl-PL');

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            els.log.prepend(div);
            if (els.log.children.length > 10) els.log.lastChild.remove();
        }

        function updateUI() {
            els.bits.textContent = fmt(Math.floor(state.bits));
            els.gps.textContent = fmt(Math.round(state.gps * 10) / 10);
            renderUpgrades();
        }

        function renderUpgrades() {
            // Inicjalizacja listy tylko raz (lub gdy pusta)
            if (els.list.children.length !== state.upgrades.length) {
                els.list.innerHTML = state.upgrades.map((u, i) => `
                    <div class="upgrade-item" role="button" tabindex="0" data-index="${i}">
                        <div class="upgrade-info">
                            <h4>${u.name} [x<span class="count">${u.count}</span>]</h4>
                            <p>+${fmt(u.gps)} bitów/s</p>
                        </div>
                        <div class="upgrade-cost"><span class="cost">${fmt(Math.floor(u.cost))}</span> b</div>
                    </div>
                `).join('');
            }

            // Aktualizacja istniejących elementów
            const items = els.list.children;
            for (let i = 0; i < items.length; i++) {
                const u = state.upgrades[i];
                const item = items[i];

                // Aktualizacja klasy disabled
                if (state.bits >= u.cost) {
                    item.classList.remove('disabled');
                } else {
                    item.classList.add('disabled');
                }

                item.setAttribute('aria-disabled', String(state.bits < u.cost));
                // Aktualizacja tekstów
                item.querySelector('.count').textContent = u.count;
                item.querySelector('.cost').textContent = fmt(Math.floor(u.cost));
                item.style.setProperty('--p', Math.min(1, state.bits / u.cost).toFixed(3));
            }
        }

        function buy(index) {
            const u = state.upgrades[index];
            if (!u) return;
            if (state.bits >= u.cost) {
                state.bits -= u.cost;
                state.gps += u.gps;
                u.count++;
                u.cost *= 1.15;
                log(`Zainstalowano: ${u.name}`);
                updateUI();
                const item = els.list.children[index];
                if (item) {
                    item.classList.remove('bought'); void item.offsetWidth; item.classList.add('bought');
                    GryKit.fx.burstAt(item, { color: ['#5dff7a', '#b8ffc6', '#2fe05a'], count: 14, square: true });
                }
                GryKit.sfx.play('coin');
            }
        }

        function resetProgress() {
            if (confirm('Czy na pewno chcesz zresetować cały postęp? Ta akcja jest nieodwracalna!')) {
                try { localStorage.removeItem('hacker_save'); } catch (_) {}
                state.bits = 0;
                state.gps = 0;
                state.clickValue = 1;
                state.upgrades = JSON.parse(JSON.stringify(defaultUpgrades));
                els.log.innerHTML = '';
                log('Reset systemu – postęp usunięty.');
                updateUI();
            }
        }

        // Event delegation dla upgrade'ów - naprawia glitch ze spamowaniem
        els.list.addEventListener('click', (e) => {
            const item = e.target.closest('.upgrade-item');
            if (!item || item.classList.contains('disabled')) return;
            const index = parseInt(item.dataset.index);
            if (!isNaN(index)) buy(index);
        });

        els.list.addEventListener('keydown', e => {
            if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
            const item=e.target.closest('.upgrade-item');if(!item)return;e.preventDefault();buy(Number(item.dataset.index));
        });

        els.hackBtn.addEventListener('click', e => {
            state.bits += state.clickValue;
            updateUI();
            // Unoszące się „+N” w miejscu kliknięcia (z klawiatury: na środku przycisku).
            const r = els.hackBtn.getBoundingClientRect();
            const x = e.clientX ? e.clientX - r.left : r.width / 2;
            const y = e.clientY ? e.clientY - r.top : r.height / 2;
            GryKit.fx.float(x + (Math.random() * 16 - 8), y - 6, '+' + fmt(state.clickValue), { on: els.hackBtn, color: '#7dff97' });
            GryKit.sfx.play('click', { pitch: 0.9 + Math.random() * 0.25 });
        });

        els.resetBtn.addEventListener('click', resetProgress);

        // Pasywne generowanie bitów
        setInterval(() => {
            if (state.gps > 0) {
                state.bits += state.gps / 10;
                updateUI();
            }
        }, 100);

        // Only numeric progress is restored; names, costs and rates come from the game.
        try {
            const raw = localStorage.getItem('hacker_save');
            const saved = raw ? JSON.parse(raw) : null;
            if (saved && Number.isFinite(saved.bits) && saved.bits >= 0 && Array.isArray(saved.upgrades) && saved.upgrades.length === defaultUpgrades.length) {
                state.bits = Math.min(saved.bits, Number.MAX_SAFE_INTEGER);
                state.upgrades = defaultUpgrades.map((base,i) => {
                    const value=saved.upgrades[i];
                    const count=value && value.id===base.id && Number.isInteger(value.count) && value.count>=0 ? Math.min(value.count,1000) : 0;
                    return {...base,count,cost:base.cost*Math.pow(1.15,count)};
                });
                state.gps=state.upgrades.reduce((sum,u)=>sum+u.gps*u.count,0);
                log('Przywrócono zapisany postęp.');
            }
        } catch (_) { log('Zapis niedostępny. Możesz grać bez zapisywania.'); }
        setInterval(() => { try { localStorage.setItem('hacker_save', JSON.stringify(state)); } catch (_) {} }, 5000);

        updateUI();
        log('System uruchomiony.');

        // Gra bez końca: bez ekranu startu i bez pauzy; GryKit daje przycisk dźwięku, efekty i dopasowanie do okna.
        GryKit.init({
            id: 'clicker',
            title: 'Hacker Tycoon',
            board: '.container',
            startScreen: false,
            pausable: false,
            hud: false,
            // Na telefonie (jedna kolumna) zwykłe przewijanie listy ulepszeń; na szerszych ekranach plansza mieści się w oknie.
            fit: matchMedia('(min-width: 761px)').matches ? { el: '.container', zoom: true, max: 1.25, min: 0.55 } : false
        });
    </script>
