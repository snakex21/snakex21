    <style>
        /* Terminal palette for the board only; the page frame uses the shell tokens. */
        body {
            --text-main: #006400;
            --terminal-bg: #f8faf6;
            --terminal-border: #006400;
            --btn-bg: #fff;
            --btn-border: #006400;
            --btn-text: #006400;
            --btn-hover-shadow: #006400;
            --upgrade-off: #7a857e;
            display: flex; flex-direction: column; min-height: 100vh; margin: 0;
            background: var(--shell-bg); color: var(--shell-text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        [data-theme="dark"] body {
            --text-main: #0f0;
            --terminal-bg: #020b03;
            --terminal-border: #0f0;
            --btn-bg: #000;
            --btn-border: #0f0;
            --btn-text: #0f0;
            --btn-hover-shadow: #0f0;
            --upgrade-off: #5b6b5d;
        }

        .game-wrapper { flex: 1; width: 100%; box-sizing: border-box; padding: 24px 16px 48px; --game-width: 1040px; }
        .game-bar .game-stat > b { min-width: 3ch; text-align: center; }

        .container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 20px;
            width: 100%;
            align-items: start;
        }

        .terminal {
            box-sizing: border-box;
            border: 1px solid var(--terminal-border);
            padding: 1rem;
            border-radius: 10px;
            background: var(--terminal-bg);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .terminal-header {
            border-bottom: 1px solid var(--terminal-border);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .per-sec {
            margin: 0 0 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }

        .hack-btn {
            background: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--btn-text);
            padding: 2.5rem 1rem;
            font-size: 1.6rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            border-radius: 6px;
            transition: box-shadow 0.1s, background 0.1s, color 0.1s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 8px var(--btn-hover-shadow);
            touch-action: manipulation;
        }

        .hack-btn:active {
            background: var(--btn-border);
            color: var(--btn-bg);
        }

        .hack-btn:hover, .hack-btn:focus-visible {
            box-shadow: 0 0 15px var(--btn-hover-shadow);
            outline: none;
        }

        .upgrade-list { display: flex; flex-direction: column; gap: 10px; }

        .upgrade-item {
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .upgrade-item:hover:not(.disabled), .upgrade-item:focus-visible {
            background: rgba(0, 160, 0, 0.14);
            outline: none;
        }

        .upgrade-item.disabled {
            cursor: not-allowed;
            border-color: var(--upgrade-off);
            color: var(--upgrade-off);
            pointer-events: none;
        }

        .upgrade-info { min-width: 0; }
        .upgrade-info h4 { margin: 0 0 4px; font-size: 1rem; }
        .upgrade-info p { margin: 0; font-size: 0.8rem; opacity: 0.8; }
        .upgrade-cost { flex: 0 0 auto; font-weight: bold; white-space: nowrap; }

        .log-area {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 1rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--terminal-border);
            height: 120px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
        }

        @media (max-width: 760px) {
            .container { grid-template-columns: minmax(0, 1fr); }
            .hack-btn { padding: 1.8rem 1rem; font-size: 1.35rem; }
            .log-area { height: 96px; }
        }
    </style>

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Hacker Tycoon</h1><p>Klikaj HACK SYSTEM, kupuj ulepszenia i generuj bity automatycznie</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Bity</span><b id="bits">0</b></div>
                <div class="game-stat"><span>Bity / s</span><b id="gps">0</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small danger" id="resetBtn" type="button">Reset postępu</button>
            </div>
        </div>

        <div class="game-stage">
            <div class="container">
                <div class="terminal">
                    <div class="terminal-header">/// MAIN_PROCESS</div>
                    <p class="per-sec">+1 BIT / klik · postęp zapisuje się automatycznie</p>
                    <button class="hack-btn" id="hackBtn" type="button">HACK SYSTEM</button>
                    <div class="log-area" id="log" aria-live="polite"></div>
                </div>

                <div class="terminal">
                    <div class="terminal-header">/// UPGRADES_MODULE</div>
                    <div class="upgrade-list" id="upgradeList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        // Game Logic
        const defaultUpgrades = [
            { id: 'script', name: 'Simple Script', cost: 15, gps: 0.5, count: 0 },
            { id: 'bot', name: 'IRC Bot', cost: 100, gps: 3, count: 0 },
            { id: 'gpu', name: 'GPU Mining', cost: 500, gps: 10, count: 0 },
            { id: 'server', name: 'Dedicated Server', cost: 2000, gps: 50, count: 0 },
            { id: 'ai', name: 'AI Assistant', cost: 10000, gps: 250, count: 0 },
            { id: 'quantum', name: 'Quantum Core', cost: 50000, gps: 1000, count: 0 }
        ];

        const state = {
            bits: 0,
            gps: 0,
            clickValue: 1,
            upgrades: JSON.parse(JSON.stringify(defaultUpgrades))
        };

        const els = {
            bits: document.getElementById('bits'),
            gps: document.getElementById('gps'),
            hackBtn: document.getElementById('hackBtn'),
            resetBtn: document.getElementById('resetBtn'),
            list: document.getElementById('upgradeList'),
            log: document.getElementById('log')
        };

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            els.log.prepend(div);
            if (els.log.children.length > 10) els.log.lastChild.remove();
        }

        function updateUI() {
            els.bits.textContent = Math.floor(state.bits);
            els.gps.textContent = state.gps.toFixed(1);
            renderUpgrades();
        }

        function renderUpgrades() {
            // Inicjalizacja listy tylko raz (lub gdy pusta)
            if (els.list.children.length !== state.upgrades.length) {
                els.list.innerHTML = state.upgrades.map((u, i) => `
                    <div class="upgrade-item" role="button" tabindex="0" data-index="${i}">
                        <div class="upgrade-info">
                            <h4>${u.name} [x<span class="count">${u.count}</span>]</h4>
                            <p>+${u.gps} GPS</p>
                        </div>
                        <div class="upgrade-cost"><span class="cost">${Math.floor(u.cost)}</span> BITS</div>
                    </div>
                `).join('');
            }

            // Aktualizacja istniejących elementów
            const items = els.list.children;
            for (let i = 0; i < items.length; i++) {
                const u = state.upgrades[i];
                const item = items[i];

                // Aktualizacja klasy disabled
                if (state.bits >= u.cost) {
                    item.classList.remove('disabled');
                } else {
                    item.classList.add('disabled');
                }

                item.setAttribute('aria-disabled', String(state.bits < u.cost));
                // Aktualizacja tekstów
                item.querySelector('.count').textContent = u.count;
                item.querySelector('.cost').textContent = Math.floor(u.cost);
            }
        }

        function buy(index) {
            const u = state.upgrades[index];
            if (!u) return;
            if (state.bits >= u.cost) {
                state.bits -= u.cost;
                state.gps += u.gps;
                u.count++;
                u.cost *= 1.15;
                log(`Installed ${u.name}`);
                updateUI();
            }
        }

        function resetProgress() {
            if (confirm('Czy na pewno chcesz zresetować cały postęp? Ta akcja jest nieodwracalna!')) {
                try { localStorage.removeItem('hacker_save'); } catch (_) {}
                state.bits = 0;
                state.gps = 0;
                state.clickValue = 1;
                state.upgrades = JSON.parse(JSON.stringify(defaultUpgrades));
                els.log.innerHTML = '';
                log('SYSTEM RESET - All progress wiped!');
                updateUI();
            }
        }

        // Event delegation dla upgrade'ów - naprawia glitch ze spamowaniem
        els.list.addEventListener('click', (e) => {
            const item = e.target.closest('.upgrade-item');
            if (!item || item.classList.contains('disabled')) return;
            const index = parseInt(item.dataset.index);
            if (!isNaN(index)) buy(index);
        });

        els.list.addEventListener('keydown', e => {
            if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
            const item=e.target.closest('.upgrade-item');if(!item)return;e.preventDefault();buy(Number(item.dataset.index));
        });

        els.hackBtn.addEventListener('click', () => {
            state.bits += state.clickValue;
            updateUI();
        });

        els.resetBtn.addEventListener('click', resetProgress);

        // Pasywne generowanie bitów
        setInterval(() => {
            if (state.gps > 0) {
                state.bits += state.gps / 10;
                updateUI();
            }
        }, 100);

        // Only numeric progress is restored; names, costs and rates come from the game.
        try {
            const raw = localStorage.getItem('hacker_save');
            const saved = raw ? JSON.parse(raw) : null;
            if (saved && Number.isFinite(saved.bits) && saved.bits >= 0 && Array.isArray(saved.upgrades) && saved.upgrades.length === defaultUpgrades.length) {
                state.bits = Math.min(saved.bits, Number.MAX_SAFE_INTEGER);
                state.upgrades = defaultUpgrades.map((base,i) => {
                    const value=saved.upgrades[i];
                    const count=value && value.id===base.id && Number.isInteger(value.count) && value.count>=0 ? Math.min(value.count,1000) : 0;
                    return {...base,count,cost:base.cost*Math.pow(1.15,count)};
                });
                state.gps=state.upgrades.reduce((sum,u)=>sum+u.gps*u.count,0);
                log('System Restored...');
            }
        } catch (_) { log('Zapis niedostępny. Możesz grać bez zapisywania.'); }
        setInterval(() => { try { localStorage.setItem('hacker_save', JSON.stringify(state)); } catch (_) {} }, 5000);

        updateUI();
        log('System Initialized.');
    </script>
