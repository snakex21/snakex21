<head>
    <meta charset="utf-8">

    <title>Tester Szybkości Pisania - Hub</title>
    <style>
        :root { --correct: #15803d; --error: #c2410c; }
        [data-theme="dark"] { --correct: #6fd08c; --error: #ff8f86; }
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        main { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 24px; --game-width: 820px; }
        .game-stage { flex-direction: column; align-items: center; gap: 16px; border-radius: 14px; }
        .time-options { padding: 3px; }
        .time-options .kit-tab { min-height: 28px; padding: 0 10px; font-size: 13px; }
        /* Słowa i pole wpisywania celowo monospace (równa szerokość liter ułatwia czytanie przy pisaniu). */
        .word-display {
            box-sizing: border-box; position: relative; width: 100%; height: 208px; overflow: hidden;
            display: flex; flex-wrap: wrap; align-content: flex-start;
            padding: 20px 24px; background: var(--shell-card); border: 1px solid var(--shell-border); border-radius: 14px;
            font: 500 1.4rem/2 var(--kit-mono); user-select: none; scroll-behavior: smooth;
        }
        .word { margin-right: 0.4em; padding: 0 0.3em; border-radius: 6px; transition: background-color .15s, color .15s; }
        .word.current { background: var(--shell-soft); box-shadow: inset 0 -2px 0 var(--shell-accent); }
        .word.current.typo { box-shadow: inset 0 -2px 0 var(--error); color: var(--error); }
        .word.correct { color: var(--correct); }
        .word.error { color: var(--error); text-decoration: line-through; }
        .input-area { width: 100%; max-width: 520px; }
        #input-field {
            box-sizing: border-box; width: 100%; min-height: 56px; padding: 0 16px;
            border: 2px solid var(--shell-border); border-radius: 12px; background: var(--shell-card); color: var(--shell-text);
            font: 500 1.2rem var(--kit-mono); text-align: center; outline: none; transition: border-color .15s, box-shadow .15s;
        }
        #input-field:focus { border-color: var(--shell-accent); box-shadow: 0 0 0 3px var(--shell-soft); }
        #input-field.typo { border-color: var(--error); }
        #input-field:disabled { opacity: .6; }
        .game-stat.low b { color: var(--error); }
        .game-stage .gk-modes { grid-template-columns: repeat(3, 1fr); }
        .game-stage .gk-modes .kit-btn { min-height: 44px; }
        @media (max-width: 560px) { .word-display { height: 180px; padding: 14px 16px; font-size: 1.15rem; } }
        @media (max-height: 640px) { main { padding-top: 12px; padding-bottom: 12px; } .game-bar { margin-bottom: 10px; } .word-display { height: 150px; padding: 12px 18px; } .game-stage { gap: 10px; } #input-field { min-height: 46px; } }
    </style>

    <main class="game-wrapper" id="main-content" tabindex="-1">
        <div class="game-bar">
            <div class="game-title"><h1>Test pisania</h1><p>Przepisuj słowa, spacja zatwierdza. Czas rusza z pierwszą literą.</p></div>
            <div class="game-stats">
                <div class="game-stat" id="timer-tile"><span>Czas</span><b id="timer">60</b></div>
                <div class="game-stat"><span>WPM</span><b id="wpm">0</b></div>
                <div class="game-stat"><span>Rekord</span><b id="best">0</b></div>
                <div class="game-stat"><span>Celność</span><b id="accuracy">100%</b></div>
            </div>
            <div class="game-buttons">
                <div class="time-options kit-tabs" role="group" aria-label="Czas testu">
                    <button class="time-btn kit-tab" type="button" data-time="15">15s</button>
                    <button class="time-btn kit-tab" type="button" data-time="30">30s</button>
                    <button class="time-btn kit-tab active" type="button" data-time="60">60s</button>
                </div>
                <button class="kit-btn small primary" type="button" id="btn-restart">↻ Restart</button>
            </div>
        </div>

        <div class="game-stage" id="stage">
            <div class="word-display" id="word-display" aria-label="Słowa do przepisania"></div>
            <div class="input-area">
                <input type="text" id="input-field" class="kit-input" placeholder="Zacznij pisać..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Wpisz bieżące słowo">
            </div>
        </div>
    </main>

    <script>
    (() => {
        const wordsList = [
            "czas", "rok", "człowiek", "dzień", "sprawa", "życie", "ręka", "praca", "słowo", "miejsce",
            "rzecz", "oczy", "dom", "pan", "świat", "samochód", "woda", "droga", "dziecko", "głowa",
            "kobieta", "noc", "przyjaciel", "szkoła", "ziemia", "pokój", "drzwi", "miasto", "głos", "twarz",
            "strona", "morze", "serce", "ojciec", "wiatr", "siła", "góra", "koniec", "książka", "Bóg",
            "stół", "okno", "ulica", "problem", "rodzina", "las", "chwila", "imię", "pieniądz", "historia",
            "słońce", "śmierć", "wojna", "ciało", "ludzie", "prawo", "muzyka", "obraz", "pole", "uwaga",
            "wieś", "kraj", "matka", "powietrze", "ręka", "noga", "niebo", "ogień", "światło", "związek",
            "przykład", "myśl", "rozmowa", "sens", "serce", "miłość", "nadzieja", "wiara", "wolność", "prawda",
            "dobro", "piękno", "natura", "kultura", "sztuka", "nauka", "wiedza", "rozum", "duch", "dusza"
        ];

        let timeLimit = 60;
        let elapsed = 0, lastTick = null, started = false, finished = false;
        let currentWordIndex = 0, correctWords = 0, errorWords = 0, totalChars = 0;
        let words = [];

        const wordDisplay = document.getElementById('word-display');
        const inputField = document.getElementById('input-field');
        const timerDisplay = document.getElementById('timer');
        const timerTile = document.getElementById('timer-tile');
        const accDisplay = document.getElementById('accuracy');
        const tabs = document.querySelectorAll('.time-btn');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            words = shuffle([...wordsList, ...wordsList, ...wordsList]); // potrójna lista – starczy słów
            wordDisplay.innerHTML = '';
            words.forEach(word => {
                const span = document.createElement('span');
                span.innerText = word;
                span.className = 'word';
                wordDisplay.appendChild(span);
            });
            wordDisplay.firstChild.classList.add('current');
            inputField.value = '';
            inputField.classList.remove('typo');
            elapsed = 0; lastTick = null; started = false; finished = false;
            currentWordIndex = 0; correctWords = 0; errorWords = 0; totalChars = 0;
            timerDisplay.innerText = timeLimit;
            timerTile.classList.remove('low');
            GryKit.score(0);
            accDisplay.innerText = '100%';
            wordDisplay.scrollTop = 0;
        }

        // Na żywo dzielimy przez co najmniej 5 s, żeby pierwsze słowa nie dawały absurdalnych 300 WPM.
        const wpmNow = () => Math.round(correctWords / (Math.max(elapsed, 5000) / 60000));
        const accuracy = () => { const t = correctWords + errorWords; return t === 0 ? 100 : Math.round(correctWords / t * 100); };

        // Zegar liczy tylko w czasie gry (pauza Esc / utrata fokusu go zatrzymuje).
        function tick() {
            const now = performance.now();
            if (!started || finished || !GryKit.playing) { lastTick = null; return; }
            if (lastTick !== null) elapsed += now - lastTick;
            lastTick = now;
            const left = Math.max(0, Math.ceil(timeLimit - elapsed / 1000));
            if (timerDisplay.innerText !== String(left)) {
                timerDisplay.innerText = left;
                if (left <= 5 && left > 0) { timerTile.classList.add('low'); GryKit.sfx.play('tick'); }
                GryKit.score(wpmNow());
            }
            if (elapsed >= timeLimit * 1000) endGame();
        }
        setInterval(tick, 100);

        function endGame() {
            if (finished) return;
            finished = true;
            inputField.disabled = true;
            const time = Math.max(1000, Math.min(elapsed, timeLimit * 1000));
            const wpm = Math.round(correctWords / (time / 60000));
            GryKit.score(wpm);
            GryKit.over({
                score: wpm, win: true, title: 'Koniec czasu!', icon: '⏱️', scoreLabel: 'WPM',
                text: `Dokładność ${accuracy()}% · poprawne słowa: ${correctWords} · błędne: ${errorWords} · znaki: ${totalChars}`
            });
        }

        inputField.addEventListener('input', (e) => {
            if (inputField.disabled || finished || e.isComposing || currentWordIndex >= words.length || !GryKit.playing) return;
            if (!started && inputField.value.trim()) { started = true; lastTick = performance.now(); }

            const typed = inputField.value;
            const currentWord = words[currentWordIndex];
            const wordElements = wordDisplay.children;
            const cur = wordElements[currentWordIndex];

            if (!typed.endsWith(' ')) {
                const typo = !currentWord.startsWith(typed);
                cur.classList.toggle('typo', typo);
                inputField.classList.toggle('typo', typo);
                return;
            }
            // Spacja zatwierdza słowo
            const trimmedTyped = typed.trim();
            if (!trimmedTyped) { inputField.value = ''; return; }
            cur.classList.remove('current', 'typo');
            inputField.classList.remove('typo');
            if (trimmedTyped === currentWord) {
                cur.classList.add('correct');
                correctWords++;
                totalChars += currentWord.length;
                GryKit.sfx.play('tap');
            } else {
                cur.classList.add('error');
                errorWords++;
                GryKit.sfx.play('error');
            }
            currentWordIndex++;

            if (currentWordIndex < words.length) {
                const nextWord = wordElements[currentWordIndex];
                nextWord.classList.add('current');
                const containerRect = wordDisplay.getBoundingClientRect();
                const wordRect = nextWord.getBoundingClientRect();
                if (wordRect.bottom > containerRect.bottom - 40) {
                    // Przewija tylko pole słów (scrollIntoView przesuwał całą stronę).
                    const top = nextWord.offsetTop - wordDisplay.clientHeight / 2;
                    if (wordDisplay.scrollTo) wordDisplay.scrollTo({ top, behavior: 'smooth' });
                    else wordDisplay.scrollTop = top;
                }
            }
            inputField.value = '';
            accDisplay.innerText = accuracy() + '%';
            GryKit.score(wpmNow());
            if (currentWordIndex >= words.length) endGame();
        });

        tabs.forEach(btn => btn.addEventListener('click', () => GryKit.start(btn.dataset.time)));
        document.getElementById('btn-restart').addEventListener('click', () => GryKit.start(GryKit.mode || String(timeLimit)));

        function setLimit(mode) {
            timeLimit = parseInt(mode, 10) || 60;
            tabs.forEach(b => b.classList.toggle('active', b.dataset.time === String(timeLimit)));
        }

        GryKit.init({
            id: 'typing',
            title: 'Test pisania',
            icon: '⌨️',
            howTo: ['Przepisuj podświetlone słowo i zatwierdzaj spacją.', 'Czas rusza z pierwszą literą. Wynik to słowa na minutę (WPM).'],
            controls: 'Pisz w polu pod słowami · <kbd>Spacja</kbd> zatwierdza · <kbd>Esc</kbd> pauza',
            board: '#stage',
            focus: inputField,
            hud: { score: '#wpm', best: '#best' },
            scoreLabel: 'WPM',
            bestPerMode: true,
            liveBest: false,
            pauseKeyP: false,
            modes: [{ id: '60', label: '60 s' }, { id: '30', label: '30 s' }, { id: '15', label: '15 s' }],
            onStart(mode) { setLimit(mode); inputField.disabled = false; initGame(); inputField.focus(); },
            onPause(p) { lastTick = null; inputField.disabled = p; if (!p) inputField.focus(); },
            onMenu() { inputField.disabled = true; initGame(); }
        });
        inputField.disabled = true;
        initGame();
    })();
    </script>
</body>
