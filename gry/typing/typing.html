<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tester Szybkości Pisania - Hub</title>
    <style>
        :root { --correct: #15803d; --error: #c2410c; }
        [data-theme="dark"] { --correct: #6fd08c; --error: #ff8f86; }
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        main { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 32px; --game-width: 820px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .game-stage { flex-direction: column; align-items: center; gap: 16px; }
        .time-options { padding: 3px; }
        .time-options .kit-tab { min-height: 28px; padding: 0 10px; font-size: 13px; }
        .stat-item { text-align: center; }
        .stat-label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--shell-muted); }
        .stat-value { display: block; font-size: 1.6rem; font-weight: 750; color: var(--shell-accent); font-variant-numeric: tabular-nums; }
        .word-display {
            box-sizing: border-box; position: relative; width: 100%; height: 168px; overflow: hidden;
            display: flex; flex-wrap: wrap; align-content: flex-start;
            padding: 20px 24px; background: var(--shell-card); border: 1px solid var(--shell-border); border-radius: 14px;
            font: 500 1.4rem/2 var(--kit-mono); user-select: none; scroll-behavior: smooth;
        }
        .word { margin-right: 0.4em; padding: 0 0.3em; border-radius: 6px; }
        .word.current { background: var(--shell-soft); box-shadow: inset 0 -2px 0 var(--shell-accent); }
        .word.correct { color: var(--correct); }
        .word.error { color: var(--error); text-decoration: line-through; }
        .input-area { width: 100%; max-width: 520px; }
        #input-field {
            box-sizing: border-box; width: 100%; min-height: 56px; padding: 0 16px;
            border: 2px solid var(--shell-border); border-radius: 12px; background: var(--shell-card); color: var(--shell-text);
            font: 500 1.2rem var(--kit-mono); text-align: center; outline: none; transition: border-color .15s, box-shadow .15s;
        }
        #input-field:focus { border-color: var(--shell-accent); box-shadow: 0 0 0 3px var(--shell-soft); }
        #input-field:disabled { opacity: .6; }
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-content {
            box-sizing: border-box; width: 100%; max-width: 440px; padding: 32px 28px; text-align: center;
            background: var(--shell-card); color: var(--shell-text); border: 1px solid var(--shell-border); border-radius: 18px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .modal-content h2 { margin: 0; font-size: 1.4rem; }
        .modal-content p { margin: 0 0 20px; color: var(--shell-muted); font-size: 14px; }
        .result-wpm { font-size: 4rem; line-height: 1.1; font-weight: 800; color: var(--shell-accent); margin: 16px 0 4px; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .result-grid .stat-item { padding: 10px; border: 1px solid var(--shell-border); border-radius: 10px; }
        .result-grid .stat-value { font-size: 1.3rem; }
        @media (max-width: 560px) { .word-display { height: 152px; padding: 14px 16px; font-size: 1.15rem; } }
    </style>
<link rel="icon" href="../../assets/workshop/favicon.svg" type="image/svg+xml">

    <main class="game-wrapper" id="main-content" tabindex="-1">
        <div class="game-bar">
            <div class="game-title"><h1>Test pisania</h1><p>Przepisuj słowa, spacja zatwierdza. Czas rusza z pierwszą literą.</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Czas</span><b id="timer">60</b></div>
                <div class="game-stat"><span>WPM</span><b id="wpm">0</b></div>
                <div class="game-stat"><span>Celność</span><b id="accuracy">100%</b></div>
            </div>
            <div class="game-buttons">
                <div class="time-options kit-tabs" role="group" aria-label="Czas testu">
                    <button class="time-btn kit-tab" type="button" data-time="15">15s</button>
                    <button class="time-btn kit-tab" type="button" data-time="30">30s</button>
                    <button class="time-btn kit-tab active" type="button" data-time="60">60s</button>
                </div>
                <button class="kit-btn small primary" type="button" id="btn-restart">↻ Restart</button>
            </div>
        </div>

        <div class="game-stage">
            <div class="word-display" id="word-display" aria-label="Słowa do przepisania"></div>
            <div class="input-area">
                <input type="text" id="input-field" class="kit-input" placeholder="Zacznij pisać..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Wpisz bieżące słowo">
            </div>
        </div>
    </main>

    <div class="modal" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="modal-content">
            <h2 id="result-title">Koniec czasu!</h2>
            <div class="result-wpm" id="final-wpm">0</div>
            <p>Słów na minutę (WPM)</p>

            <div class="result-grid">
                <div class="stat-item">
                    <span class="stat-label">Dokładność</span>
                    <span class="stat-value" id="final-acc">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Poprawne słowa</span>
                    <span class="stat-value" id="final-correct">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Błędy</span>
                    <span class="stat-value" id="final-errors">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Znaki</span>
                    <span class="stat-value" id="final-chars">0</span>
                </div>
            </div>

            <button class="kit-btn primary block" type="button" onclick="resetGame()">Spróbuj ponownie</button>
        </div>
    </div>

    <script>
        // Theme
        // Theme is handled by assets/workshop/shell.js.

        // Typing Test Logic
        const wordsList = [
            "czas", "rok", "człowiek", "dzień", "sprawa", "życie", "ręka", "praca", "słowo", "miejsce",
            "rzecz", "oczy", "dom", "pan", "świat", "samochód", "woda", "droga", "dziecko", "głowa",
            "kobieta", "noc", "przyjaciel", "szkoła", "ziemia", "pokój", "drzwi", "miasto", "głos", "twarz",
            "strona", "morze", "serce", "ojciec", "wiatr", "siła", "góra", "koniec", "książka", "Bóg",
            "stół", "okno", "ulica", "problem", "rodzina", "las", "chwila", "imię", "pieniądz", "historia",
            "słońce", "śmierć", "wojna", "ciało", "ludzie", "prawo", "muzyka", "obraz", "pole", "uwaga",
            "wieś", "kraj", "matka", "powietrze", "ręka", "noga", "niebo", "ogień", "światło", "związek",
            "przykład", "myśl", "rozmowa", "sens", "serce", "miłość", "nadzieja", "wiara", "wolność", "prawda",
            "dobro", "piękno", "natura", "kultura", "sztuka", "nauka", "wiedza", "rozum", "duch", "dusza"
        ];

        let timeLeft = 60;
        let timeLimit = 60;
        let timer = null, round = 0;
        let isPlaying = false;
        let currentWordIndex = 0;
        let correctWords = 0;
        let errorWords = 0;
        let totalChars = 0;
        let words = [];

        const wordDisplay = document.getElementById('word-display');
        const inputField = document.getElementById('input-field');
        const timerDisplay = document.getElementById('timer');
        const wpmDisplay = document.getElementById('wpm');
        const accDisplay = document.getElementById('accuracy');
        const resultModal = document.getElementById('result-modal');

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            ++round;
            words = shuffle([...wordsList, ...wordsList, ...wordsList]); // Triple list for enough words
            wordDisplay.innerHTML = '';
            words.forEach(word => {
                const span = document.createElement('span');
                span.innerText = word;
                span.className = 'word';
                wordDisplay.appendChild(span);
            });

            wordDisplay.firstChild.classList.add('current');
            inputField.value = '';
            inputField.focus();

            timeLeft = timeLimit;
            timerDisplay.innerText = timeLeft;
            wpmDisplay.innerText = '0';
            accDisplay.innerText = '100%';

            currentWordIndex = 0;
            correctWords = 0;
            errorWords = 0;
            totalChars = 0;
            isPlaying = false;
            clearInterval(timer);
            resultModal.style.display = 'none';

            // Reset scroll
            wordDisplay.scrollTop = 0;
        }

        function startGame() {
            if (isPlaying) return;
            isPlaying = true;
            const startedRound = round;
            timer = setInterval(() => {
                if (startedRound !== round || !isPlaying) return;
                timeLeft--;
                timerDisplay.innerText = timeLeft;

                // Calculate WPM on the fly
                const timeElapsed = timeLimit - timeLeft;
                const wpm = Math.round((correctWords / timeElapsed) * 60) || 0;
                wpmDisplay.innerText = wpm;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            if (!isPlaying) return;
            clearInterval(timer);
            isPlaying = false;
            inputField.disabled = true;

            const wpm = Math.round((correctWords / Math.max(1, timeLimit - timeLeft)) * 60);
            const total = correctWords + errorWords;
            const acc = total === 0 ? 0 : Math.round((correctWords / total) * 100);

            document.getElementById('final-wpm').innerText = wpm;
            document.getElementById('final-acc').innerText = acc + '%';
            document.getElementById('final-correct').innerText = correctWords;
            document.getElementById('final-errors').innerText = errorWords;
            document.getElementById('final-chars').innerText = totalChars;

            resultModal.style.display = 'flex';
        }

        function resetGame() {
            inputField.disabled = false;
            initGame();
        }

        inputField.addEventListener('input', (e) => {
            if (inputField.disabled || e.isComposing || currentWordIndex >= words.length) return;
            if (!isPlaying && timeLeft > 0) startGame();

            const typed = e.target.value;
            const currentWord = words[currentWordIndex];
            const wordElements = wordDisplay.querySelectorAll('.word');

            // Handle space (word submission)
            if (typed.endsWith(' ')) {
                const trimmedTyped = typed.trim();

                if (trimmedTyped === currentWord) {
                    wordElements[currentWordIndex].classList.add('correct');
                    correctWords++;
                    totalChars += currentWord.length;
                } else {
                    wordElements[currentWordIndex].classList.add('error');
                    errorWords++;
                }

                wordElements[currentWordIndex].classList.remove('current');
                currentWordIndex++;

                if (currentWordIndex < words.length) {
                    const nextWord = wordElements[currentWordIndex];
                    nextWord.classList.add('current');

                    // Improved Scrolling Logic
                    // We check if the next word is in a new row relative to the previous one
                    // Or simply ensure it's visible.

                    // Simple logic: scroll into view if needed
                    const containerRect = wordDisplay.getBoundingClientRect();
                    const wordRect = nextWord.getBoundingClientRect();

                    // If word is in the bottom half or below, scroll it to center
                    if (wordRect.bottom > containerRect.bottom - 40) {
                        // Scroll only the word box (scrollIntoView also jumped the whole page).
                        const top = nextWord.offsetTop - wordDisplay.clientHeight / 2;
                        if (wordDisplay.scrollTo) wordDisplay.scrollTo({ top, behavior: 'smooth' });
                        else wordDisplay.scrollTop = top;
                    }
                }

                inputField.value = '';

                // Update accuracy
                const total = correctWords + errorWords;
                const acc = total === 0 ? 100 : Math.round((correctWords / total) * 100);
                accDisplay.innerText = acc + '%';
                if (currentWordIndex >= words.length) endGame();
            }
        });

        // Time options
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                timeLimit = parseInt(btn.dataset.time);
                resetGame();
            });
        });

        document.getElementById('btn-restart').addEventListener('click', resetGame);

        // Init
        initGame();
    </script>
</body>

</html>
