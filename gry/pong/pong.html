<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pong - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 40px; --game-width: 900px; }
        .game-bar .kit-tabs { flex: 0 0 auto; }
        #pong-canvas {
            display: block; width: 100%; max-width: 900px; height: auto;
            background: #14322a; border: 2px solid var(--shell-border); border-radius: 12px;
            touch-action: none;
        }
        #pong-canvas:focus-visible { outline: 3px solid var(--shell-accent); outline-offset: 3px; }
        #round-status:not(:empty)::before { content: " · "; }
        #round-status { color: var(--shell-text); font-weight: 650; }
        .hidden { display: none !important; }
    </style>
<link rel="icon" href="../../assets/workshop/favicon.svg" type="image/svg+xml">

</head>
<body class="site-shell game-shell">

<div class="site-links"><a href="../../index.html">Start</a><a href="../../Programy/programy.html">Narzędzia</a><a href="../../gry/gry.html" aria-current="location">Gry</a><a href="../../LinkHub/index.html">LinkHub</a><a href="../../muzyka/muzyka.html">Muzyka</a><a href="../../filmy/filmy glowna.html">Filmy</a></div>

    <main class="game-wrapper" id="main-content" tabindex="-1">
        <div class="game-bar">
            <div class="game-title"><h1>Pong</h1><p>Odbijaj piłkę paletką — kto pierwszy zdobędzie 7 punktów, wygrywa</p></div>
            <div class="kit-tabs mode-selection" role="group" aria-label="Tryb gry">
                <button class="kit-tab mode-btn active" type="button" data-mode="ai">vs AI</button>
                <button class="kit-tab mode-btn" type="button" data-mode="coop">vs Gracz</button>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary start-btn" type="button" id="start-btn" onclick="startGame()">Start</button>
                <button class="kit-btn small primary restart-btn hidden" type="button" id="restart-btn" onclick="restartGame()">Nowy mecz</button>
                <button type="button" id="pause-game" class="kit-btn small" onclick="setPaused(!paused)">Pauza</button>
            </div>
        </div>

        <div class="game-stage">
            <canvas tabindex="0" id="pong-canvas" width="900" height="600" aria-label="Plansza Pong"></canvas>
        </div>
        <p class="game-status controls" id="controls-text"><span id="control-info">Mysz, dotyk lub ↑/↓ porusza lewą paletką · P: pauza</span><span id="round-status" role="status"></span></p>
    </main>

    <script>
        // Tryb ciemny
        // Theme is handled by assets/workshop/shell.js.

        // Logika gry Pong
        const canvas = document.getElementById('pong-canvas');
        const ctx = canvas.getContext('2d');
        const controlInfo = document.getElementById('control-info');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        let gameMode = 'ai'; // 'ai' lub 'coop'
        let gameStarted = false;
        let scoringCooldown = false;
        let gameInterval = null;
        let serveTimeout = null;
        let matchRestartTimeout = null;
        let paused = false, pendingServe = false, pendingWin = false, timerGeneration = 0, serveGeneration = 0;

        // Paletki
        const paddleWidth = 30;
        const paddleHeight = 180;

        const leftPaddle = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: '#f1ede2',
            score: 0,
            dy: 0
        };

        const rightPaddle = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: '#f1ede2',
            score: 0,
            dy: 0
        };

        // Piłka
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            speed: 10,
            velocityX: 0,
            velocityY: 0,
            color: '#f0a04b'
        };

        // Rysowanie
        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawCircle(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawNet() {
            for (let i = 0; i <= canvas.height; i += 35) {
                drawRect(canvas.width / 2 - 2, i, 4, 22, 'rgba(255,255,255,0.28)');
            }
        }

        function drawText(text, x, y) {
            ctx.fillStyle = 'rgba(255,255,255,0.32)';
            ctx.font = '700 96px Inter, system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, x, y);
            ctx.textAlign = 'left';
        }

        // Kontrola myszą (tryb AI)
        function moveMouse(evt) {
            if (gameMode === 'ai' && gameStarted && !paused) {
                const rect = canvas.getBoundingClientRect();
                if (rect.height <= 0) return;
                const pointerY = (evt.clientY - rect.top) * canvas.height / rect.height;
                leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height,
                    pointerY - leftPaddle.height / 2));
            }
        }
        canvas.addEventListener('mousemove', moveMouse);
        canvas.addEventListener('pointerdown', e => { e.preventDefault();canvas.setPointerCapture?.(e.pointerId);movePointer(e); });
        canvas.addEventListener('pointermove', e => { if(e.pointerType==='mouse'||e.buttons||e.pressure)movePointer(e); });
        function movePointer(e) {
            if(gameMode==='ai'){moveMouse(e);return;}
            if(!gameStarted||paused)return;
            const rect=canvas.getBoundingClientRect();if(!rect.height||!rect.width)return;
            const paddle=e.clientX-rect.left<rect.width/2?leftPaddle:rightPaddle;
            paddle.y=Math.max(0,Math.min(canvas.height-paddle.height,(e.clientY-rect.top)*canvas.height/rect.height-paddle.height/2));
        }
        function setPaused(value) {
            if(!gameStarted)return;
            const next=!!value;if(next===paused)return;paused=next;
            if (!paused) canvas.focus();
            Object.keys(keys).forEach(key=>keys[key]=false);
            document.getElementById('pause-game').textContent=paused?'Wznów':'Pauza';
            document.getElementById('round-status').textContent=paused?'Pauza':'';
            if(paused){pendingWin=matchRestartTimeout!==null;pendingServe=serveTimeout!==null;clearTimeout(matchRestartTimeout);clearTimeout(serveTimeout);matchRestartTimeout=null;serveTimeout=null;++timerGeneration;++serveGeneration;}
            else if(pendingWin){pendingWin=false;scheduleMatchRestart();}
            else if(pendingServe){pendingServe=false;resetBall();}
        }
        document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});

        // Kontrola klawiaturą (tryb Coop)
        const keys = {};
        document.addEventListener('keydown', (e) => {
            if(e.altKey||e.ctrlKey||e.metaKey||e.target?.closest?.('header,a,input,textarea,select'))return;
            if((e.code==='KeyP'||e.code==='Escape')&&!e.repeat){e.preventDefault();setPaused(!paused);return;}
            if(!e.target?.closest?.('button')&&['ArrowUp','ArrowDown','w','W','s','S'].includes(e.key)){e.preventDefault();keys[e.key] = true;}
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Kolizja
        function collision(b, p) {
            return b.x + b.radius > p.x &&
                   b.x - b.radius < p.x + p.width &&
                   b.y + b.radius > p.y &&
                   b.y - b.radius < p.y + p.height;
        }

        // Stare opóźnienia nie mogą zmieniać nowej gry ani ekranu startowego.
        function clearPendingTimers() {
            ++timerGeneration;++serveGeneration;pendingServe=false;pendingWin=false;
            clearTimeout(serveTimeout);
            clearTimeout(matchRestartTimeout);
            serveTimeout = null;
            matchRestartTimeout = null;
        }

        // Reset piłki z cooldownem
        function resetBall() {
            clearTimeout(serveTimeout);
            scoringCooldown = true;
            ball.velocityX = 0;
            ball.velocityY = 0;
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 10;

            // Pauza 2 sekundy przed następną rundą
            const version=timerGeneration, serve=++serveGeneration;
            serveTimeout = setTimeout(() => {
                if(version!==timerGeneration||serve!==serveGeneration||paused)return;
                serveTimeout = null;
                if (!gameStarted) return;
                ball.velocityX = (Math.random() > 0.5 ? 1 : -1) * 5;
                ball.velocityY = (Math.random() * 4) - 2;
                scoringCooldown = false;
            }, 2000);
        }

        // Start gry
        function startGame() {
            if(gameStarted)return;
            gameStarted = true;paused=false;canvas.focus();
            document.getElementById("pause-game").textContent="Pauza";
            startBtn.classList.add('hidden');
            restartBtn.classList.remove('hidden');
            ball.velocityX = 5;
            ball.velocityY = 3;

            if (!gameInterval) {
                gameInterval = setInterval(gameLoop, 1000 / 50);
            }
        }

        // Restart gry
        function restartGame() {
            clearPendingTimers();paused=false;canvas.focus();
            document.getElementById("pause-game").textContent="Pauza";document.getElementById("round-status").textContent="Nowa runda";
            leftPaddle.score = 0;
            rightPaddle.score = 0;
            ball.speed = 10;
            scoringCooldown = false;
            resetBall();
        }

        function scheduleMatchRestart() {
            const version=timerGeneration;
            matchRestartTimeout=setTimeout(()=>{if(version!==timerGeneration||paused)return;matchRestartTimeout=null;restartGame();},2000);
        }
        // Update
        function update() {
            if (!gameStarted || paused || document.hidden) return;

            // Ruch piłki tylko gdy nie ma cooldowna
            if (!scoringCooldown) {
                ball.x += ball.velocityX;
                ball.y += ball.velocityY;
            }

            if (gameMode === 'ai') {
                if(keys.ArrowUp||keys.w||keys.W)leftPaddle.y-=7;
                if(keys.ArrowDown||keys.s||keys.S)leftPaddle.y+=7;
                // AI dla prawej paletki
                let AILevel = 0.1;
                rightPaddle.y += (ball.y - (rightPaddle.y + rightPaddle.height / 2)) * AILevel;
            } else {
                // Kontrola klawiaturą
                // Lewa paletka: W/S
                if (keys['w'] || keys['W']) leftPaddle.dy = -5;
                else if (keys['s'] || keys['S']) leftPaddle.dy = 5;
                else leftPaddle.dy = 0;

                // Prawa paletka: ↑/↓
                if (keys['ArrowUp']) rightPaddle.dy = -5;
                else if (keys['ArrowDown']) rightPaddle.dy = 5;
                else rightPaddle.dy = 0;

                leftPaddle.y += leftPaddle.dy;
                rightPaddle.y += rightPaddle.dy;
            }

            // Ograniczenia palet
            leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
            rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));

            // Odbicie od góry i dołu
            if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
                ball.velocityY = -ball.velocityY;
            }

            // Kolizja z paletkami
            let player = (ball.x < canvas.width / 2) ? leftPaddle : rightPaddle;
            if (collision(ball, player) && !scoringCooldown) {
                ball.velocityX = -ball.velocityX;

                let cp = ball.y - (player.y + player.height / 2);
                cp = cp / (player.height / 2);
                let angleRad = cp * Math.PI / 4;
                let direction = (ball.x < canvas.width / 2 ? 1 : -1);
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                ball.speed = Math.min(24, ball.speed + 0.5);
            }

            // Punkty - tylko gdy nie ma cooldowna
            if (!scoringCooldown) {
                if (ball.x - ball.radius < 0) {
                    rightPaddle.score++;
                    resetBall();
                } else if (ball.x + ball.radius > canvas.width) {
                    leftPaddle.score++;
                    resetBall();
                }
            }

            // Wygranie gry
            if ((leftPaddle.score >= 7 || rightPaddle.score >= 7) && matchRestartTimeout === null) {
                clearTimeout(serveTimeout);
                serveTimeout = null;
                document.getElementById("round-status").textContent=leftPaddle.score>=7?"Wygrywa lewy gracz!":"Wygrywa prawy gracz!";
                scheduleMatchRestart();
            }
        }

        // Render
        function render() {
            // Tło
            drawRect(0, 0, canvas.width, canvas.height, '#14322a');
            // Linie boisk
            drawRect(0, 0, canvas.width, 4, 'rgba(255,255,255,0.18)');
            drawRect(0, canvas.height - 4, canvas.width, 4, 'rgba(255,255,255,0.18)');

            // Siatka
            drawNet();

            // Wyniki
            drawText(leftPaddle.score, canvas.width / 4, canvas.height / 5);
            drawText(rightPaddle.score, 3 * canvas.width / 4, canvas.height / 5);

            // Paletki
            drawRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height, leftPaddle.color);
            drawRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height, rightPaddle.color);

            // Piłka
            drawCircle(ball.x, ball.y, ball.radius, ball.color);

            // Tekst START jeśli gra nie wystartowała
            if (!gameStarted) {
                drawRect(canvas.width / 2 - 330, canvas.height / 2 - 70, 660, 140, 'rgba(8,20,16,0.78)');
                ctx.fillStyle = '#f1ede2';
                ctx.font = '700 40px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Naciśnij Start, aby zagrać', canvas.width / 2, canvas.height / 2 - 6);
                ctx.fillStyle = 'rgba(241,237,226,0.7)';
                ctx.font = '500 22px Inter, system-ui, sans-serif';
                ctx.fillText(gameMode === 'ai' ? 'Grasz lewą paletką przeciwko komputerowi' : 'Lewy gracz: W/S · prawy gracz: ↑/↓', canvas.width / 2, canvas.height / 2 + 36);
                ctx.textAlign = 'left';
            }
        }

        // Główna pętla gry
        function gameLoop() {
            update();
            render();
        }

        // Początkowe renderowanie
        render();

        // Przełączanie trybu
        const modeButtons = document.querySelectorAll('.mode-btn');
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                gameMode = btn.dataset.mode;
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                if (gameMode === 'ai') {
                    controlInfo.textContent = 'Mysz, dotyk lub ↑/↓ porusza lewą paletką · P: pauza';
                } else {
                    controlInfo.textContent = 'W/S: lewa paletka · ↑/↓: prawa paletka · dotyk: połowa planszy · P: pauza';
                }

                // Reset gry przy zmianie trybu
                clearPendingTimers();
                gameStarted = false;paused=false;
                document.getElementById("pause-game").textContent="Pauza";document.getElementById("round-status").textContent="";
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                startBtn.classList.remove('hidden');
                restartBtn.classList.add('hidden');
                leftPaddle.score = 0;
                rightPaddle.score = 0;
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.velocityX = 0;
                ball.velocityY = 0;
                scoringCooldown = false;
                render();
            });
        });
    </script>
</body>
</html>
