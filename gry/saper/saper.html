    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --header-bg: #ffffff;
            --nav-text: #666;
            --nav-hover: #000;
            --border: #e0e0e0;
            --game-bg: #f0f0f0;
            --cell-bg: #e0e0e0;
            --cell-border-light: #fff;
            --cell-border-dark: #aaa;
            --cell-revealed: #d0d0d0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --header-bg: #1a1a1a;
            --nav-text: #aaa;
            --nav-hover: #fff;
            --border: #333;
            --game-bg: #2a2a2a;
            --cell-bg: #c0c0c0;
            --cell-border-light: #ffffff;
            --cell-border-dark: #888;
            --cell-revealed: #b0b0b0;
        }

        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0; transition: background 0.3s; }
        
        /* HEADER */
        header { background: var(--header-bg); border-bottom: 1px solid var(--border); width: 100%; z-index: 100; transition: background 0.3s; }
        nav { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; flex: 1; }
        .nav-links a { color: var(--nav-text); text-decoration: none; transition: 0.2s; font-size: 1rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--nav-hover); }
        #theme-toggle { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.5rem; }
        @media (max-width: 768px) { .nav-links { display: none; } }

        .game-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .header { display: flex; justify-content: space-between; width: 300px; margin-bottom: 10px; background: var(--game-bg); padding: 10px; border-radius: 5px; border: 1px solid var(--border); }
        .stat { font-size: 1.5rem; font-family: monospace; color: #ff5555; }
        .reset-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(10, 30px); grid-template-rows: repeat(10, 30px); gap: 2px; background: #444; padding: 5px; border-radius: 5px; }
        .cell { 
            width: 30px; height: 30px; 
            background: var(--cell-bg); 
            border-top: 2px solid var(--cell-border-light); border-left: 2px solid var(--cell-border-light);
            border-bottom: 2px solid var(--cell-border-dark); border-right: 2px solid var(--cell-border-dark);
            display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; font-family: sans-serif; font-size: 18px; color: #000; 
        }
        .cell:active { border: 2px inset var(--cell-border-dark); }
        .cell.revealed { background: var(--cell-revealed); border: 1px solid #999; }
        .cell.bomb { background: #ff5555; }
        .cell[data-num="1"] { color: blue; } .cell[data-num="2"] { color: green; } .cell[data-num="3"] { color: red; }
        .game-wrapper { min-width: 0; max-width: 100%; padding: 12px; }
        .game-wrapper > div[style] { width: max-content; max-width: 100%; }
        .grid { width: max-content; }
        .header { max-width: 100%; gap: 8px; flex-wrap: wrap; }
        .cell { padding: 0; color: inherit; font: inherit; }
        .cell:focus-visible { outline: 3px solid #2563eb; outline-offset: -3px; }
    </style>

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <h1>Saper</h1>
        <div class="header">
            <select class="difficulty-select" id="difficulty-select">
                <option value="easy">Łatwy (10x10)</option>
                <option value="medium">Średni (16x16)</option>
                <option value="hard">Trudny (30x16)</option>
            </select>
            <div class="stat" id="bomb-count">010</div>
            <button class="reset-btn" id="reset-btn">🙂</button>
            <div class="stat" id="timer">000</div>
        </div>
        <button type="button" id="flag-mode" aria-pressed="false">🚩 Tryb flagi: wyłączony</button>
        <p>Kliknij pole, aby odkryć. Flaga: prawy przycisk, klawisz F lub tryb flagi.</p>
        <div style="max-width:100%;overflow-x:auto"><div class="grid" id="grid"></div></div>
    </div>

    <script>
        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        // Game Logic
        const grid = document.getElementById('grid');
        const bombCountEl = document.getElementById('bomb-count');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const diffSelect = document.getElementById('difficulty-select');
        
        let width = 10, height = 10, bombAmount = 10, flags = 0;
        let squares = [], isGameOver = false, timer = 0, timerId = null, started = false, flagMode = false;
        const flagButton = document.getElementById('flag-mode');
        function neighbors(id) {
            const row = Math.floor(id / width), col = id % width, result = [];
            for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                const y = row + dy, x = col + dx;
                if ((dy || dx) && y >= 0 && y < height && x >= 0 && x < width) result.push(y * width + x);
            }
            return result;
        }
        function calculateNumbers() {
            squares.forEach((square, id) => {
                if (square.dataset.type === 'valid') square.setAttribute('data', neighbors(id).filter(n => squares[n].dataset.type === 'bomb').length);
            });
        }
        function setDifficulty() {
            const val = diffSelect.value;
            if (val === 'easy') { width = 10; height = 10; bombAmount = 10; }
            else if (val === 'medium') { width = 16; height = 16; bombAmount = 40; }
            else if (val === 'hard') { width = 30; height = 16; bombAmount = 99; }
            createBoard();
        }
        diffSelect.addEventListener('change', setDifficulty);
        flagButton.addEventListener('click', () => {
            flagMode = !flagMode;
            flagButton.setAttribute('aria-pressed', String(flagMode));
            flagButton.textContent = flagMode ? '🚩 Tryb flagi: włączony' : '🚩 Tryb flagi: wyłączony';
        });
        function createBoard() {
            clearInterval(timerId); timerId = null;
            grid.innerHTML = ''; squares = []; isGameOver = false; flags = 0; timer = 0; started = false;
            timerEl.textContent = '000';
            grid.style.gridTemplateColumns = `repeat(${width}, 30px)`;
            grid.style.gridTemplateRows = `repeat(${height}, 30px)`;
            bombCountEl.textContent = String(bombAmount).padStart(3, '0'); resetBtn.textContent = '🙂';
            const gameArray = Array(width * height).fill('valid');
            for (let i = 0; i < bombAmount; i++) gameArray[i] = 'bomb';
            for (let i = gameArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gameArray[i], gameArray[j]] = [gameArray[j], gameArray[i]];
            }
            for (let i = 0; i < gameArray.length; i++) {
                const square = document.createElement('button');
                square.type = 'button'; square.id = i; square.className = 'cell'; square.dataset.type = gameArray[i];
                square.setAttribute('aria-label', `Wiersz ${Math.floor(i / width) + 1}, kolumna ${i % width + 1}: zakryte`);
                grid.appendChild(square); squares.push(square);
                square.addEventListener('click', () => flagMode ? addFlag(square) : click(square));
                square.addEventListener('contextmenu', e => { e.preventDefault(); addFlag(square); });
                square.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') { e.preventDefault(); addFlag(square); } });
            }
            calculateNumbers();
        }
        function addFlag(square) {
            if (isGameOver || square.classList.contains('revealed')) return;
            if (square.classList.contains('flag')) {
                square.classList.remove('flag'); square.textContent = ''; flags--;
                square.setAttribute('aria-label', 'Zakryte pole');
            } else if (flags < bombAmount) {
                square.classList.add('flag'); square.textContent = '🚩'; flags++;
                square.setAttribute('aria-label', 'Flaga');
            }
            bombCountEl.textContent = String(bombAmount - flags).padStart(3, '0'); checkForWin();
        }
        function click(square) {
            if (isGameOver || square.classList.contains('revealed') || square.classList.contains('flag')) return;
            if (!started) {
                // The first revealed square is always safe; move a mine rather than rerolling the board.
                if (square.dataset.type === 'bomb') {
                    const target = squares.find(s => s !== square && s.dataset.type === 'valid');
                    target.dataset.type = 'bomb'; square.dataset.type = 'valid'; calculateNumbers();
                }
                started = true;
                timerId = setInterval(() => { timer++; timerEl.textContent = String(timer).padStart(3, '0'); }, 1000);
            }
            if (square.dataset.type === 'bomb') { gameOver(); return; }
            // Synchronous queue: no delayed callbacks can reveal a replacement board.
            const queue = [Number(square.id)];
            while (queue.length) {
                const id = queue.pop(), cell = squares[id];
                if (cell.classList.contains('revealed') || cell.classList.contains('flag') || cell.dataset.type === 'bomb') continue;
                const total = Number(cell.getAttribute('data'));
                cell.classList.add('revealed'); cell.textContent = total || ''; cell.dataset.num = total;
                cell.setAttribute('aria-label', total ? `${total} sąsiednich min` : 'Puste pole');
                if (!total) queue.push(...neighbors(id));
            }
            checkForWin();
        }
        function gameOver() {
            isGameOver = true; resetBtn.textContent = '😵'; clearInterval(timerId);
            squares.forEach(sq => { if (sq.dataset.type === 'bomb') { sq.textContent = '💣'; sq.classList.remove('flag'); sq.classList.add('revealed', 'bomb'); sq.setAttribute('aria-label', 'Mina'); } });
        }
        function checkForWin() {
            if (isGameOver) return;
            const allSafeRevealed = squares.every(s => s.dataset.type === 'bomb' || s.classList.contains('revealed'));
            const allMinesFlagged = squares.filter(s => s.classList.contains('flag') && s.dataset.type === 'bomb').length === bombAmount;
            if (allSafeRevealed || allMinesFlagged) { isGameOver = true; resetBtn.textContent = '😎'; clearInterval(timerId); }
        }

        resetBtn.addEventListener('click', createBoard); 
        createBoard();
    </script>
