<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048 - Hub</title>
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 32px; --game-width: 500px; }
        .game-stage { flex-direction: column; align-items: center; }

        [data-game-root], [data-game-root] * { box-sizing: border-box; }
        [data-game-root] {
            touch-action: none;
            position: relative;
            width: min(500px, 100%);
            aspect-ratio: 1 / 1;
            padding: 12px;
            border-radius: 14px;
            background: var(--shell-soft);
            border: 1px solid var(--shell-border);
        }

        .grid {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
        }

        .grid_row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .grid_cell {
            position: relative;
            border-radius: 8px;
            background: var(--shell-card);
            border: 1px solid var(--shell-border);
            overflow: hidden;
        }

        .tile {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-weight: 750;
            font-size: clamp(1.5rem, 7vw, 2.2rem);
            font-variant-numeric: tabular-nums;
            color: #1a1a1a;
            transform: scale(0.9);
            opacity: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .tile.appearing,
        .grid_cell.active .tile {
            opacity: 1;
            transform: scale(1);
        }

        .tile[data-value="2"] { background: #fef3c7; }
        .tile[data-value="4"] { background: #fde68a; }
        .tile[data-value="8"] { background: #fbbf24; }
        .tile[data-value="16"] { background: #fb923c; }
        .tile[data-value="32"] { background: #f97316; }
        .tile[data-value="64"] { background: #ef4444; color: #fff; }
        .tile[data-value="128"] { background: #f472b6; }
        .tile[data-value="256"] { background: #c084fc; }
        .tile[data-value="512"] { background: #38bdf8; }
        .tile[data-value="1024"] { background: #22d3ee; font-size: clamp(1.1rem, 5vw, 1.8rem); }
        .tile[data-value="2048"] { background: #2dd4bf; font-size: clamp(1.1rem, 5vw, 1.8rem); }
        .tile[data-value="4096"] { background: #a855f7; color: #fff; font-size: clamp(1.1rem, 5vw, 1.8rem); }

        #status { min-height: 1.5em; }
        #status p { margin: 0; color: var(--shell-text); font-weight: 650; }
        @media (max-width: 560px) {
            .game-wrapper { padding: 16px 16px 24px; }
            [data-game-root], .grid, .grid_row { gap: 8px; }
            [data-game-root] { padding: 8px; }
        }
    </style>

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>2048</h1><p>Strzałki lub gest · łącz równe liczby aż do 2048</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Wynik</span><b id="value">0</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary" type="button" id="repeat">Nowa gra</button>
            </div>
        </div>

        <div class="game-stage">
            <div data-game-root aria-label="Plansza 2048"></div>
        </div>
        <div class="game-status" id="status" role="status"></div>
    </div>

    <script>
        // Motyw ciemny
        // Theme is handled by assets/workshop/shell.js.

        // Inicjalizacja gry
        window.addEventListener("load", () => {
            buildGridOverlay();
            cellCreator(2, 0);
            score(0);
            const restartButton = document.getElementById("repeat");
            if (restartButton) {
                restartButton.addEventListener("click", reset);
            }
        });

        function getGridElement() {
            return document.querySelector('[data-game-root] .grid');
        }

        /* GENERATE GRID */
        function buildGridOverlay() {
            const root = document.querySelector('[data-game-root]');
            if (!root) {
                return null;
            }
            root.innerHTML = '';
            const size = 4;
            const table = document.createElement('DIV');

            table.className = 'grid';
            table.id = ' ';
            table.dataset.value = 0;

            for (let i = 0; i < size; i++) {
                const tr = document.createElement('DIV');
                table.appendChild(tr);
                tr.id = 'row_' + (i + 1);
                tr.className += 'grid_row';

                for (let j = 0; j < size; j++) {
                    const td = document.createElement('DIV');
                    td.id = '' + (i + 1) + (j + 1);
                    td.className += 'grid_cell';
                    tr.appendChild(td);
                }
                root.appendChild(table);
            }

            return table;
        }

        /* RANDOM TILE CREATOR */
        function cellCreator(c, timeOut) {
            // Sprawdź czy są dostępne pola
            const emptyCells = [];
            for (let x = 1; x <= 4; x++) {
                for (let y = 1; y <= 4; y++) {
                    const cell = document.getElementById('' + x + y);
                    if (cell && cell.innerHTML === '') {
                        emptyCells.push({x, y});
                    }
                }
            }

            // Jeśli nie ma pustych pól, nie twórz nowych kafelków
            if (emptyCells.length === 0) return;

            // Utwórz c kafelków lub ile jest dostępnych pól (cokolwiek jest mniejsze)
            const tilesToCreate = Math.min(c, emptyCells.length);

            for (let i = 0; i < tilesToCreate; i++) {
                // Wybierz losowe puste pole
                const randomIndex = Math.floor(Math.random() * emptyCells.length);
                const {x, y} = emptyCells.splice(randomIndex, 1)[0];

                // 90% szans na 2, 10% szans na 4
                let randomValue = Math.random() < 0.9 ? 2 : 4;

                const position = document.getElementById('' + x + y);
                const tile = document.createElement('DIV');
                position.appendChild(tile);
                tile.id = 'tile_' + x + y;
                position.classList.add('active');

                colorSet(randomValue, tile);
                tile.classList.add('appearing');
                setTimeout(() => {
                    tile.classList.remove('appearing');
                }, 220);
            }
        }

        /* MOVE TILES */
        let gameActive = true;

        document.onkeydown = directions;

        function directions(e) {
            if (!gameActive) return;
            e = e || window.event;
            if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey ||
                e.target?.closest?.('input, textarea, select, [contenteditable="true"]')) return;
            if (![37, 38, 39, 40].includes(Number(e.keyCode))) return;
            e.preventDefault();
            const before = boardSignature();

            if (e.keyCode == '38') {
                let count = 2;

                for (let x = 2; x > 1; x--) {
                    for (let y = 1; y < 5; y++) {
                        moveTilesMain(x, y, -1, 0, 1, 0);
                    }
                    if (x == 2) {
                        x += count;
                        count++;
                    }
                    if (count > 4) { break; }
                }
                cellReset(boardSignature() !== before);
            }

            else if (e.keyCode == '40') {
                let count = -2;
                for (let x = 3; x < 4; x++) {
                    for (let y = 1; y < 5; y++) {
                        moveTilesMain(x, y, 1, 0, 4, 0);
                    }
                    if (x == 3) {
                        x += count;
                        count--;
                    }
                    if (count < -4) { break; }
                }
                cellReset(boardSignature() !== before);
            }

            else if (e.keyCode == '37') {
                let count = 2;
                for (let x = 2; x > 1; x--) {
                    for (let y = 1; y < 5; y++) {
                        moveTilesMain(y, x, 0, -1, 0, 1);
                    }
                    if (x == 2) {
                        x += count;
                        count++;
                    }
                    if (count > 4) { break; }
                }
                cellReset(boardSignature() !== before);
            }

            else if (e.keyCode == '39') {
                let count = -2;

                for (let x = 3; x < 4; x++) {
                    for (let y = 1; y < 5; y++) {
                        moveTilesMain(y, x, 0, 1, 0, 4);
                    }
                    if (x == 3) {
                        x += count;
                        count--;
                    }
                    if (count < -4) { break; }
                }
                cellReset(boardSignature() !== before);
            }
        }

        function moveTilesMain(x, y, X, Y, xBorder, yBorder, c, d) {
            const tile = document.getElementById('tile_' + x + y);
            const checker = document.getElementById('' + x + y);
            const xAround = x + X;
            const yAround = y + Y;

            if (xAround > 0 && xAround < 5 && yAround > 0 && yAround < 5 && checker.className == 'grid_cell active') {
                const around = document.getElementById('' + xAround + yAround);

                if (around.className == 'grid_cell active') {
                    const aroundTile = document.getElementById('tile_' + xAround + yAround);
                    if (aroundTile.innerHTML == tile.innerHTML) {
                        const value = tile.dataset.value * 2;
                        aroundTile.dataset.value = '' + value;
                        aroundTile.className = 'tile ' + value;
                        aroundTile.innerHTML = '' + value;
                        colorSet(value, aroundTile);
                        checker.removeChild(tile);
                        checker.className = 'grid_cell';
                        around.className = 'grid_cell active merged';
                        score(value);
                    }
                }

                else if (around.className == 'grid_cell') {
                    around.className = 'grid_cell active';
                    around.appendChild(tile);
                    around.id = '' + xAround + yAround;
                    tile.id = 'tile_' + xAround + yAround;
                    checker.className = 'grid_cell';
                    checker.id = '' + x + y;
                }
            }
        }

        function colorSet(value, tile) {
            tile.dataset.value = '' + value;
            tile.className = 'tile tile-' + value;
            tile.innerHTML = '' + value;
        }

        function boardSignature() {
            return Array.from(document.querySelectorAll('[data-game-root] .grid_cell'),
                cell => cell.firstElementChild?.dataset.value || '0').join(',');
        }

        function cellReset(changed) {
            if (changed) cellCreator(1, 200);
            const merged = document.getElementsByClassName('merged');
            while (merged.length) {
                merged[0].classList.remove('merged');
            }
            const grid = document.getElementsByClassName('grid_cell');
            for (let i = 0; i < grid.length; i++) {
                if (grid[i].innerHTML === '') {
                    grid[i].className = 'grid_cell';
                }
            }
            loose();
        }

        function reset() {
            touchStart = null;
            gameActive = true;
            buildGridOverlay();
            const status = document.getElementById('status');
            if (status) {
                status.innerHTML = '';
            }
            score(0);
            cellCreator(2, 0);
        }

        /* SCORE */
        function score(value) {
            const gridElement = getGridElement();
            let add = 0;
            if (gridElement) {
                gridElement.dataset.value = parseInt(gridElement.dataset.value || '0', 10) + value;
                add = gridElement.dataset.value;
            }
            const valueElement = document.getElementById('value');
            if (valueElement) {
                valueElement.innerHTML = add;
            }
        }

        /* LOOSE */
        function loose() {
            const grid = document.getElementsByClassName('grid_cell');
            let count = 0;
            for (let i = 0; i < grid.length; i++) {
                if (grid[i].innerHTML === '') {
                    count++;
                }
            }
            if (count == 0) {
                const doc = document.getElementById('status');
                if (!doc) {
                    return;
                }
                let checker = 0;
                for (let i = 0; i < grid.length; i++) {
                    const test = grid[i].id;
                    checker += check(test);
                }
                if (checker == 0) {
                    doc.innerHTML = '<p>Koniec gry! Spróbuj ponownie.</p>';
                    gameActive = false;
                }
            }
        }

        function check(id) {
            const row = Number(id[0]);
            const col = Number(id[1]);
            const tile = document.getElementById('tile_' + id);
            const right = col < 4 ? document.getElementById('tile_' + row + (col + 1)) : null;
            const bottom = row < 4 ? document.getElementById('tile_' + (row + 1) + col) : null;
            return tile && ((right && tile.dataset.value === right.dataset.value) ||
                (bottom && tile.dataset.value === bottom.dataset.value)) ? 1 : 0;
        }

        // One swipe is one move. A cancelled/multi-touch gesture never moves tiles.
        const boardRoot = document.querySelector('[data-game-root]');
        let touchStart = null;
        boardRoot.addEventListener('touchstart', event => {
            touchStart = event.touches.length === 1
                ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
        }, { passive: true });
        boardRoot.addEventListener('touchcancel', () => { touchStart = null; });
        boardRoot.addEventListener('touchend', event => {
            const start = touchStart;
            touchStart = null;
            if (!start || event.touches.length || event.changedTouches.length !== 1) return;
            const dx = event.changedTouches[0].clientX - start.x;
            const dy = event.changedTouches[0].clientY - start.y;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            const keyCode = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 39 : 37) : (dy > 0 ? 40 : 38);
            directions({ keyCode, preventDefault() {} });
        }, { passive: true });

    </script>
