    <style>
        :root {
            --tile-border: #d3d6da;
            --tile-filled: #878a8c;
            --key-bg: #d3d6da;
            --key-text: #1a1a1b;
            --w-correct: #6aaa64;
            --w-present: #c9b458;
            --w-absent: #787c7e;
        }
        [data-theme="dark"] {
            --tile-border: #3a3a3c;
            --tile-filled: #6b6e70;
            --key-bg: #818384;
            --key-text: #ffffff;
            --w-correct: #538d4e;
            --w-present: #b59f3b;
            --w-absent: #3a3a3c;
        }
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-container { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 32px; --game-width: 520px; }
        .game-stage { flex-direction: column; align-items: center; gap: 0; }
        .board-container { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .tile {
            box-sizing: border-box; width: min(62px, calc((100vw - 64px) / 5)); aspect-ratio: 1;
            border: 2px solid var(--tile-border); border-radius: 6px; background: var(--shell-card);
            display: flex; align-items: center; justify-content: center;
            font: 750 2rem/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; color: var(--shell-text);
        }
        .tile.filled { border-color: var(--tile-filled); animation: pop 0.1s; }
        .tile.correct { background: var(--w-correct); border-color: var(--w-correct); }
        .tile.present { background: var(--w-present); border-color: var(--w-present); }
        .tile.absent { background: var(--w-absent); border-color: var(--w-absent); }
        .tile.correct, .tile.present, .tile.absent { color: #fff; }
        #wordle-message { margin: 16px auto; min-height: 1.5em; color: var(--shell-text); font-weight: 600; }
        .keyboard { display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(100%, 520px); }
        .key-row { display: flex; gap: 6px; width: 100%; justify-content: center; }
        .key {
            flex: 1; min-width: 0; min-height: 52px; padding: 0; border: 0; border-radius: 6px;
            background: var(--key-bg); color: var(--key-text); cursor: pointer;
            font: 700 15px/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center;
            touch-action: manipulation;
        }
        .key:hover { filter: brightness(.94); }
        .key:focus-visible { outline: 3px solid var(--shell-accent); outline-offset: 2px; }
        .key.big { flex: 1.6; padding: 0 2px; font-size: .75rem; }
        .key.correct { background: var(--w-correct); color: #fff; }
        .key.present { background: var(--w-present); color: #fff; }
        .key.absent { background: var(--w-absent); color: #fff; }
        @media (max-width: 400px) { .key-row { gap: 4px; } .key { min-height: 48px; font-size: 14px; } }
        @keyframes pop { 50% { transform: scale(1.1); } }
        @media (prefers-reduced-motion: reduce) { .tile.filled { animation: none; } }
    </style>

    <div class="game-container" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Wordle</h1><p>Zielone: dobra litera i miejsce · żółte: litera jest w słowie</p></div>
            <div class="game-buttons"><button class="kit-btn small primary" type="button" onmousedown="event.preventDefault()" onclick="resetGame()">Nowa gra</button></div>
        </div>
        <div class="game-stage">
            <div class="board-container" id="board"></div>
            <p class="game-status" id="wordle-message" aria-live="polite">Odgadnij pięcioliterowe słowo. Masz 6 prób.</p>
            <div class="keyboard" id="keyboard"></div>
        </div>
    </div>

    <script>
        const words = ["ALARM", "BAGNO", "DOMEK", "EKRAN", "FIRMA", "HALAS", "ISKRA", "KUBEK", "LAMPA", "NIGDY", "OBIAD", "PRACA", "RADIO", "SKLEP", "TRAWA", "ZEGAR"];
        let secret = words[Math.floor(Math.random() * words.length)];
        let grid = Array(6).fill().map(() => Array(5).fill(""));
        let currentRow = 0;
        let currentCol = 0;
        let gameOver = false;
        const revealTimers = new Set();
        const message = document.getElementById('wordle-message');
        function later(callback, delay) {
            const id = setTimeout(() => { revealTimers.delete(id); callback(); }, delay);
            revealTimers.add(id);
        }
        function resetGame() {
            revealTimers.forEach(clearTimeout); revealTimers.clear();
            secret = words[Math.floor(Math.random() * words.length)];
            grid = Array.from({length:6}, () => Array(5).fill(''));
            currentRow = currentCol = 0; gameOver = false; message.textContent = 'Odgadnij pięcioliterowe słowo. Masz 6 prób.';
            init();
        }

        const boardEl = document.getElementById('board');
        const keyboardEl = document.getElementById('keyboard');
        // Keep focus off on-screen keys so a physical Enter submits instead of re-clicking the last key.
        keyboardEl.addEventListener('mousedown', e => e.preventDefault());

        function init() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 6; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';
                for (let c = 0; c < 5; c++) {
                    const tile = document.createElement('div');
                    tile.id = `tile-${r}-${c}`;
                    tile.className = 'tile';
                    rowEl.appendChild(tile);
                }
                boardEl.appendChild(rowEl);
            }
            renderKeyboard();
        }

        function renderKeyboard() {
            const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
            keyboardEl.innerHTML = '';

            rows.forEach((rowStr, i) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'key-row';

                if (i === 2) {
                    const enter = document.createElement('button');
                    enter.type = 'button';
                    enter.className = 'key big';
                    enter.innerText = 'ENTER';
                    enter.onclick = submit;
                    rowDiv.appendChild(enter);
                }

                rowStr.split('').forEach(char => {
                    const key = document.createElement('button');
                    key.type = 'button';
                    key.className = 'key';
                    key.id = `key-${char}`;
                    key.innerText = char;
                    key.onclick = () => type(char);
                    rowDiv.appendChild(key);
                });

                if (i === 2) {
                    const back = document.createElement('button');
                    back.type = 'button';
                    back.className = 'key big';
                    back.innerText = '⌫';
                    back.onclick = backspace;
                    rowDiv.appendChild(back);
                }

                keyboardEl.appendChild(rowDiv);
            });
        }

        function type(char) {
            if (gameOver || currentCol > 4) return;
            grid[currentRow][currentCol] = char;
            const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
            tile.innerText = char;
            tile.classList.add('filled');
            currentCol++;
        }

        function backspace() {
            if (gameOver || currentCol === 0) return;
            currentCol--;
            grid[currentRow][currentCol] = "";
            const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
            tile.innerText = "";
            tile.classList.remove('filled');
        }

        function submit() {
            if (gameOver || currentCol !== 5) return;
            const guess = grid[currentRow].join("");

            let secretArr = secret.split("");
            const status = Array(5).fill('absent');

            for (let i = 0; i < 5; i++) {
                if (guess[i] === secretArr[i]) {
                    status[i] = 'correct';
                    secretArr[i] = null;
                }
            }

            for (let i = 0; i < 5; i++) {
                if (status[i] !== 'correct' && secretArr.includes(guess[i])) {
                    status[i] = 'present';
                    secretArr[secretArr.indexOf(guess[i])] = null;
                }
            }

            for (let i = 0; i < 5; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                const key = document.getElementById(`key-${guess[i]}`);

                later(() => {
                    tile.classList.add(status[i]);
                    if (status[i] === 'correct') key.className = 'key correct';
                    else if (status[i] === 'present' && !key.classList.contains('correct')) key.className = 'key present';
                    else if (!key.classList.contains('correct') && !key.classList.contains('present')) key.className = 'key absent';
                }, i * 200);
            }

            if (guess === secret) {
                gameOver = true;
                later(() => { message.textContent = 'Wygrałeś! Możesz zacząć nową grę.'; }, 1000);
            } else if (currentRow === 5) {
                gameOver = true;
                const answer = secret;
                later(() => { message.textContent = `Koniec! Słowo to: ${answer}`; }, 1000);
            }

            currentRow++;
            currentCol = 0;
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.target?.matches?.('input, textarea, select, [contenteditable]')) return;
            const key = e.key.toUpperCase();
            if (key === 'ENTER' && e.target?.closest?.('button, a')) return;
            if (key === 'ENTER') { e.preventDefault(); if (!e.repeat) submit(); }
            else if (key === 'BACKSPACE') { e.preventDefault(); backspace(); }
            else if (/^[A-Z]$/.test(key)) { e.preventDefault(); type(key); }
        });

        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        init();
    </script>
