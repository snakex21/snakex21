    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 32px; --game-width: 720px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

        .memory-grid {
            box-sizing: border-box;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            padding: 14px;
            border-radius: 14px;
            background: var(--shell-soft);
            border: 1px solid var(--shell-border);
        }

        .memory-card {
            position: relative;
            display: grid;
            place-items: center;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            border: 2px solid var(--shell-border);
            background: var(--shell-card);
            font-size: clamp(1.4rem, 6vw, 2.6rem);
            line-height: 1;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s, background-color 0.15s, border-color 0.15s, opacity 0.2s;
        }

        .memory-card:hover {
            transform: translateY(-2px);
        }

        .memory-card.hidden {
            font-size: 0;
            color: transparent;
            text-shadow: none;
            background:
                radial-gradient(circle at center, var(--shell-accent) 0 3px, transparent 4px),
                repeating-linear-gradient(45deg, transparent 0 8px, var(--shell-hover) 8px 10px),
                var(--shell-card);
            border-color: var(--shell-border);
        }
        .memory-card.hidden:hover { border-color: var(--shell-accent); }

        .memory-card.off {
            cursor: default;
            opacity: 0;
            visibility: hidden;
        }

        .memory-card:not(.hidden).red { background-color: #ef4444; border-color: #dc2626; }
        .memory-card:not(.hidden).green { background-color: #22c55e; border-color: #16a34a; }
        .memory-card:not(.hidden).blue { background-color: #3b82f6; border-color: #2563eb; }
        .memory-card:not(.hidden).magenta { background-color: #e879f9; border-color: #d946ef; }
        .memory-card:not(.hidden).yellow { background-color: #facc15; border-color: #eab308; }
        .memory-card:not(.hidden).bisque { background-color: #fbbf24; border-color: #f59e0b; }
        .memory-card:not(.hidden).brown { background-color: #b45309; border-color: #92400e; }
        .memory-card:not(.hidden).cyan { background-color: #22d3ee; border-color: #06b6d4; }
        .memory-card:not(.hidden).orange { background-color: #fb923c; border-color: #f97316; }
        .memory-card:focus-visible { outline: 3px solid var(--shell-accent); outline-offset: 2px; }

        .message {
            display: none;
            max-width: var(--game-width);
            margin: 16px auto 0;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--shell-border);
            background: var(--shell-card);
            color: var(--shell-text);
            font-weight: 650;
            text-align: center;
        }

        .message.visible {
            display: block;
        }

        .best-score b { color: var(--shell-text); font-weight: 650; }

        @media (max-width: 560px) {
            .game-wrapper { padding: 16px 16px 24px; }
            .memory-grid { gap: 6px; padding: 8px; }
            .memory-card { border-radius: 8px; }
            .memory-card:hover { transform: none; }
        }
    </style>

    <script>
        // Motyw ciemny
        // Theme is handled by assets/workshop/shell.js.

        // Gra w zapamiętywanie
        const CARD_COLORS = [
            "red", "red",
            "green", "green",
            "blue", "blue",
            "magenta", "magenta",
            "yellow", "yellow",
            "bisque", "bisque",
            "brown", "brown",
            "cyan", "cyan",
            "orange", "orange",
        ];

        const gridElement = document.querySelector("[data-memory-grid]");
        const movesElement = document.querySelector("[data-memory-moves]");
        const timeElement = document.querySelector("[data-memory-time]");
        const accuracyElement = document.querySelector("[data-memory-accuracy]");
        const resetButton = document.querySelector("[data-memory-reset]");
        const messageElement = document.querySelector("[data-memory-message]");
        const bestScoreElement = document.querySelector("[data-memory-best-score]");
        const bestTimeElement = document.querySelector("[data-memory-best-time]");
        const bestMovesElement = document.querySelector("[data-memory-best-moves]");

        const BEST_SCORE_KEY = "memory-best-score";

        if (!gridElement) {
            console.warn("Nie znaleziono planszy gry w zapamiętywanie.");
        } else {
            const cards = Array.from(gridElement.querySelectorAll("[data-card]"));
            const state = {
                openCards: [],
                foundPairs: 0,
                moves: 0,
                startTime: null,
                timerId: null,
                isBusy: false,
                previewTimer: null,
                mismatchTimer: null,
            };

            const formatTime = seconds => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            const updateHud = () => {
                if (movesElement) {
                    movesElement.textContent = state.moves.toString();
                }
                if (timeElement) {
                    const elapsed = state.startTime ? Math.floor((Date.now() - state.startTime) / 1000) : 0;
                    timeElement.textContent = formatTime(elapsed);
                }
                if (accuracyElement) {
                    const accuracy = state.moves === 0 ? 100 : Math.round((state.foundPairs / state.moves) * 100);
                    accuracyElement.textContent = `${Math.max(0, Math.min(accuracy, 100))}%`;
                }
            };

            const stopTimer = () => {
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
            };

            const startTimer = () => {
                if (!state.startTime) {
                    state.startTime = Date.now();
                    state.timerId = setInterval(updateHud, 1000);
                }
            };

            const resetMessage = () => {
                if (messageElement) {
                    messageElement.textContent = "";
                    messageElement.classList.remove("visible");
                }
            };

            const showMessage = text => {
                if (!messageElement) {
                    return;
                }
                messageElement.textContent = text;
                messageElement.classList.add("visible");
            };

            const validResult = result => result && ['score', 'time', 'moves'].every(key => Number.isFinite(result[key]) && result[key] >= 0);
            const saveBestResult = result => {
                try {
                    const stored = JSON.parse(localStorage.getItem(BEST_SCORE_KEY) || "null");
                    if (!validResult(stored) || result.score > stored.score || (result.score === stored.score && result.time < stored.time)) {
                        localStorage.setItem(BEST_SCORE_KEY, JSON.stringify(result));
                        return result;
                    }
                    return stored;
                } catch (error) {
                    console.error("Nie udało się zapisać najlepszego wyniku", error);
                    return null;
                }
            };

            const loadBestResult = () => {
                try {
                    const stored = JSON.parse(localStorage.getItem(BEST_SCORE_KEY) || "null");
                    return validResult(stored) ? stored : null;
                } catch (error) {
                    console.error("Nie udało się wczytać najlepszego wyniku", error);
                    return null;
                }
            };

            const updateBestSummary = best => {
                if (!validResult(best)) {
                    return;
                }
                if (bestScoreElement) {
                    bestScoreElement.textContent = best.score.toString();
                }
                if (bestTimeElement) {
                    bestTimeElement.textContent = formatTime(best.time);
                }
                if (bestMovesElement) {
                    bestMovesElement.textContent = best.moves.toString();
                }
            };

            const finishGame = () => {
                stopTimer();
                const totalTime = state.startTime ? Math.floor((Date.now() - state.startTime) / 1000) : 0;
                const score = state.moves === 0 ? 100 : Math.round((state.foundPairs / state.moves) * 100);
                const result = { score, time: totalTime, moves: state.moves };
                const best = saveBestResult(result) || result;
                updateBestSummary(best);
                showMessage(`Gratulacje! Ukończyłeś planszę w ${formatTime(totalTime)} i ${state.moves} ruchach.`);
            };

            const hideCards = cardsToHide => {
                cardsToHide.forEach(card => { card.classList.add("hidden"); card.setAttribute('aria-label', 'Zakryta karta'); });
            };

            const markAsFound = cardsToMark => {
                cardsToMark.forEach(card => { card.classList.add("off"); card.tabIndex = -1; card.setAttribute('aria-label', 'Znaleziona para'); });
            };

            const revealCard = card => {
                if (state.isBusy || card.classList.contains("off") || state.openCards.includes(card)) {
                    return;
                }

                startTimer();
                resetMessage();
                card.classList.remove("hidden");
                card.setAttribute('aria-label', card.textContent);
                state.openCards.push(card);

                if (state.openCards.length < 2) {
                    return;
                }

                state.isBusy = true;
                state.moves += 1;
                updateHud();

                const [first, second] = state.openCards;
                const firstColor = first.dataset.color;
                const secondColor = second.dataset.color;

                if (firstColor === secondColor) {
                    markAsFound(state.openCards);
                    state.foundPairs += 1;
                    updateHud();
                    state.openCards = [];
                    state.isBusy = false;
                    if (state.foundPairs === CARD_COLORS.length / 2) {
                        finishGame();
                    }
                } else {
                    state.mismatchTimer = setTimeout(() => {
                        state.mismatchTimer = null;
                        hideCards(state.openCards);
                        state.openCards = [];
                        state.isBusy = false;
                    }, 750);
                }
            };

            const shuffleCards = () => {
                const deck = [...CARD_COLORS];
                cards.forEach(card => {
                    card.className = "memory-card"; card.tabIndex = 0;
                    const randomIndex = Math.floor(Math.random() * deck.length);
                    const color = deck.splice(randomIndex, 1)[0];
                    card.dataset.color = color;
                    card.classList.add(color);
                    card.textContent = ['🍎','🍀','💧','🌸','⭐','🍪','🐻','❄️','🍊'][Math.floor(CARD_COLORS.indexOf(color) / 2)];
                });
            };

            const stopHiding = () => {
                cards.forEach(card => card.classList.remove("hidden", "off"));
            };

            const resetGame = () => {
                stopTimer();
                clearTimeout(state.previewTimer); clearTimeout(state.mismatchTimer);
                state.previewTimer = state.mismatchTimer = null;
                state.openCards = [];
                state.foundPairs = 0;
                state.moves = 0;
                state.startTime = null;
                state.isBusy = false;
                cards.forEach(card => {
                    card.className = "memory-card";
                    delete card.dataset.color;
                });
                shuffleCards();
                stopHiding();
                state.isBusy = true;
                state.previewTimer = setTimeout(() => {
                    state.previewTimer = null; state.isBusy = false;
                    hideCards(cards);
                }, 1800);
                updateHud();
                resetMessage();
            };

            const initialise = () => {
                shuffleCards();
                const handleCardClick = event => revealCard(event.currentTarget);
                cards.forEach(card => {
                    card.classList.remove("hidden", "off");
                    card.setAttribute('role', 'button'); card.tabIndex = 0;
                    card.setAttribute('aria-label', 'Karta pamięci');
                    card.addEventListener("click", handleCardClick);
                    card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); revealCard(card); } });
                });
                state.isBusy = true;
                state.previewTimer = setTimeout(() => {
                    state.previewTimer = null; state.isBusy = false;
                    hideCards(cards);
                }, 1800);
                updateHud();
                const best = loadBestResult();
                if (best) {
                    updateBestSummary(best);
                }
            };

            if (resetButton) {
                resetButton.addEventListener("click", resetGame);
            }

            initialise();
        }
    </script>
