    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px 24px; --game-width: 720px; }

        .memory-grid {
            box-sizing: border-box;
            /* stała szerokość (nie 100%), żeby GryKit.fit mógł planszę zmniejszyć przez zoom */
            width: min(720px, calc(100vw - 32px));
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            padding: 14px;
            border-radius: 14px;
            background: var(--shell-soft);
            border: 1px solid var(--shell-border);
        }

        .memory-card {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-size: clamp(1.4rem, 6vw, 2.6rem);
            line-height: 1;
            transition: transform .15s, opacity .35s, visibility 0s;
        }
        .memory-card:hover { transform: translateY(-2px); }
        /* Karta = dwie ściany obracane w 3D (przód z obrazkiem, tył ze wzorem). */
        .card-inner {
            position: absolute; inset: 0;
            transform-style: preserve-3d;
            transform: perspective(600px) rotateY(0deg);
            transition: transform .4s cubic-bezier(.3, .7, .3, 1.15);
        }
        .memory-card.hidden .card-inner { transform: perspective(600px) rotateY(180deg); }
        .face {
            position: absolute; inset: 0; box-sizing: border-box;
            display: grid; place-items: center;
            border-radius: 10px; border: 2px solid var(--shell-border); background: var(--shell-card);
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            box-shadow: 0 2px 6px rgba(20, 40, 30, .12);
        }
        .face.back {
            transform: rotateY(180deg);
            background:
                radial-gradient(circle at center, var(--shell-accent) 0 3px, transparent 4px),
                repeating-linear-gradient(45deg, transparent 0 8px, var(--shell-hover) 8px 10px),
                var(--shell-card);
        }
        .memory-card:hover .face.back { border-color: var(--shell-accent); }

        .memory-card.off {
            cursor: default;
            opacity: 0;
            visibility: hidden;
            transform: scale(.8);
            transition: transform .35s, opacity .35s, visibility 0s .35s;
        }
        .memory-card.miss .face.front { animation: miss .38s ease-in-out; border-color: #d05c5c; }
        @keyframes miss { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

        .memory-card.red .front { background-color: #ef4444; border-color: #dc2626; }
        .memory-card.green .front { background-color: #22c55e; border-color: #16a34a; }
        .memory-card.blue .front { background-color: #3b82f6; border-color: #2563eb; }
        .memory-card.magenta .front { background-color: #e879f9; border-color: #d946ef; }
        .memory-card.yellow .front { background-color: #facc15; border-color: #eab308; }
        .memory-card.bisque .front { background-color: #fbbf24; border-color: #f59e0b; }
        .memory-card.brown .front { background-color: #b45309; border-color: #92400e; }
        .memory-card.cyan .front { background-color: #22d3ee; border-color: #06b6d4; }
        .memory-card.orange .front { background-color: #fb923c; border-color: #f97316; }
        .memory-card:focus-visible { outline: 3px solid var(--shell-accent); outline-offset: 2px; }

        @media (max-width: 560px) {
            .game-wrapper { padding: 16px 16px 24px; }
            .memory-grid { grid-template-columns: repeat(3, 1fr); width: min(380px, calc(100vw - 32px)); gap: 8px; padding: 10px; }
            .memory-card { font-size: 2.2rem; }
            .memory-card, .face { border-radius: 8px; }
            .memory-card:hover { transform: none; }
        }
        @media (max-height: 640px) { .game-wrapper { padding-top: 12px; padding-bottom: 12px; } .game-bar { margin-bottom: 10px; } }
        @media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }
    </style>

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">

    <script>
    (() => {
        const CARD_COLORS = ["red", "green", "blue", "magenta", "yellow", "bisque", "brown", "cyan", "orange"];
        const EMOJI = ['🍎', '🍀', '💧', '🌸', '⭐', '🍪', '🐻', '❄️', '🍊'];
        const HEX = ['#ef4444', '#22c55e', '#3b82f6', '#e879f9', '#facc15', '#fbbf24', '#b45309', '#22d3ee', '#fb923c'];
        const PAIRS = CARD_COLORS.length;
        const LEGACY_KEY = 'memory-best-score';   // stary zapis {score, time, moves} – czas przejmujemy jako rekord

        const gridElement = document.querySelector('[data-memory-grid]');
        const movesElement = document.querySelector('[data-memory-moves]');
        const timeElement = document.querySelector('[data-memory-time]');
        const accuracyElement = document.querySelector('[data-memory-accuracy]');
        const statusElement = document.querySelector('[data-memory-status]');
        const cards = Array.from(gridElement.querySelectorAll('[data-card]'));

        const state = { openCards: [], foundPairs: 0, moves: 0, started: false, elapsed: 0, lastTick: null, isBusy: true, gen: 0 };
        const timers = new Set();
        const later = (fn, ms) => { const g = state.gen; const id = setTimeout(() => { timers.delete(id); if (g === state.gen) fn(); }, ms); timers.add(id); };

        const formatTime = seconds => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
        const seconds = () => Math.floor(state.elapsed / 1000);
        const accuracy = () => state.moves === 0 ? 100 : Math.max(0, Math.min(100, Math.round(state.foundPairs / state.moves * 100)));

        const updateHud = () => {
            movesElement.textContent = state.moves;
            timeElement.textContent = formatTime(seconds());
            accuracyElement.textContent = accuracy() + '%';
        };
        // Zegar liczy tylko w trakcie gry – pauza (P / Esc / utrata fokusu) go zatrzymuje.
        setInterval(() => {
            const now = performance.now();
            if (!state.started || !GryKit.playing) { state.lastTick = null; return; }
            if (state.lastTick !== null) state.elapsed += now - state.lastTick;
            state.lastTick = now;
            updateHud();
        }, 250);

        const center = el => {
            const r = el.getBoundingClientRect(), b = document.body.getBoundingClientRect();
            return { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top };
        };

        const hideCards = list => list.forEach(card => {
            card.classList.add('hidden');
            card.setAttribute('aria-label', 'Zakryta karta');
        });

        const finishGame = () => {
            const time = Math.max(1, seconds());
            updateHud();
            state.started = false;
            GryKit.over({ score: time, win: true, delay: 500, text: `Wszystkie pary w ${formatTime(time)} · ruchy: ${state.moves} · celność ${accuracy()}%.` });
        };

        const revealCard = card => {
            if (!GryKit.playing || state.isBusy || card.classList.contains('off') || state.openCards.includes(card)) return;
            if (!state.started) { state.started = true; state.lastTick = performance.now(); }
            card.classList.remove('hidden', 'miss');
            card.setAttribute('aria-label', card.dataset.label);
            state.openCards.push(card);
            GryKit.sfx.play('tap');
            if (state.openCards.length < 2) return;

            state.isBusy = true;
            state.moves += 1;
            const [first, second] = state.openCards;
            if (first.dataset.color === second.dataset.color) {
                state.foundPairs += 1;
                updateHud();
                state.openCards = [];
                state.isBusy = false;
                const color = HEX[CARD_COLORS.indexOf(first.dataset.color)];
                later(() => {
                    GryKit.sfx.play('coin', { pitch: 1 + state.foundPairs * 0.04 });
                    [first, second].forEach(c => GryKit.fx.burstAt(c, { color: [color, '#fff', '#f2c14e'], count: 12 }));
                    const c = center(second);
                    GryKit.fx.float(c.x, c.y, 'Para!', { on: document.body, color: '#fff' });
                }, 280);
                later(() => [first, second].forEach(c => {
                    c.classList.add('off'); c.tabIndex = -1; c.setAttribute('aria-label', 'Znaleziona para');
                }), 520);
                if (state.foundPairs === PAIRS) finishGame();
            } else {
                updateHud();
                later(() => { GryKit.sfx.play('error'); first.classList.add('miss'); second.classList.add('miss'); }, 300);
                later(() => {
                    hideCards(state.openCards);
                    state.openCards.forEach(c => c.classList.remove('miss'));
                    state.openCards = [];
                    state.isBusy = false;
                }, 900);
            }
        };

        const shuffleCards = () => {
            const deck = [...CARD_COLORS, ...CARD_COLORS];
            cards.forEach(card => {
                const color = deck.splice(Math.floor(Math.random() * deck.length), 1)[0];
                const i = CARD_COLORS.indexOf(color);
                card.className = 'memory-card ' + color;
                card.tabIndex = 0;
                card.dataset.color = color;
                card.dataset.label = 'Karta: ' + EMOJI[i];
                card.innerHTML = `<span class="card-inner"><span class="face front" aria-hidden="true">${EMOJI[i]}</span><span class="face back"></span></span>`;
            });
        };

        // Nowa partia: tasowanie, chwilowy podgląd wszystkich kart, potem zakrycie.
        const resetGame = preview => {
            timers.forEach(clearTimeout); timers.clear();
            state.gen++;
            Object.assign(state, { openCards: [], foundPairs: 0, moves: 0, started: false, elapsed: 0, lastTick: null, isBusy: true });
            shuffleCards();
            updateHud();
            if (!preview) { hideCards(cards); return; }
            statusElement.textContent = 'Zapamiętaj karty…';
            later(() => {
                hideCards(cards);
                GryKit.sfx.play('tick');
                state.isBusy = false;
                statusElement.innerHTML = 'Odkrywaj pary · <kbd>P</kbd> / <kbd>Esc</kbd> pauza';
            }, 1800);
        };

        cards.forEach(card => {
            card.setAttribute('role', 'button');
            card.addEventListener('click', () => revealCard(card));
            card.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); revealCard(card); }
            });
        });
        document.querySelector('[data-memory-reset]').addEventListener('click', () => GryKit.start());

        GryKit.init({
            id: 'memory',
            title: 'Gra w zapamiętywanie',
            icon: '🧠',
            howTo: ['Na początku wszystkie karty są przez chwilę odkryte – zapamiętaj je.', 'Odkrywaj po dwie karty i szukaj par.', 'Liczy się czas – im szybciej, tym lepszy rekord.'],
            controls: 'Klik / dotyk albo <kbd>Tab</kbd> + <kbd>Enter</kbd> · <kbd>P</kbd> / <kbd>Esc</kbd> pauza',
            board: gridElement,
            hud: { best: '#best' },
            scoreLabel: 'Czas',
            bestLabel: 'Rekord',
            lowerIsBetter: true,
            format: v => formatTime(Math.round(v)),
            fit: { el: gridElement, zoom: true, min: 0.45 },
            onStart() { resetGame(true); },
            onPause(p) { state.lastTick = null; },
            onMenu() { resetGame(false); statusElement.innerHTML = 'Kliknij kartę (albo <kbd>Tab</kbd> + <kbd>Enter</kbd>) · <kbd>P</kbd> / <kbd>Esc</kbd> pauza'; }
        });
        // Przeniesienie starego rekordu (czasu) do wspólnego formatu, jeśli jeszcze go nie ma.
        if (!GryKit.best) {
            try {
                const old = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
                if (old && Number.isFinite(old.time) && old.time > 0) GryKit.setBest(old.time);
            } catch (e) { /* brak dostępu do pamięci – gra działa bez rekordu */ }
        }
        resetGame(false);
    })();
    </script>
