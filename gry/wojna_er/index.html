<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wojna Er - Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- UI: Top Bar (Stats) -->
        <div id="ui-top">
            <div class="base-health" id="player-health-bar">
                <div class="bar-fill" id="player-hp-fill"></div>
                <span id="player-hp-text">500/500</span>
            </div>
            <div class="resources">
                <span class="res-gold">💰 <span id="gold-display">0</span></span>
                <span class="res-xp">⭐ <span id="xp-display">0</span></span>
                <span class="era-name" id="era-display">Epoka Kamienia</span>
            </div>
            <div class="base-health enemy" id="enemy-health-bar">
                <div class="bar-fill enemy" id="enemy-hp-fill"></div>
                <span id="enemy-hp-text">500/500</span>
            </div>
        </div>

        <!-- UI: Bottom Bar (Controls) -->
        <div id="ui-bottom">
            <div class="unit-panel" id="unit-buttons">
                <!-- Buttons generated by JS -->
            </div>
            <div class="special-panel">
                <button id="turret-btn" class="action-btn" onclick="buyTurret()">Wieżyczka (500g)</button>
                <button id="special-btn" class="action-btn" disabled>Specjalny (500g)</button>
                <button id="evolve-btn" class="action-btn evolve" disabled>Ewolucja (1000xp)</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <h1 id="game-over-title">Koniec Gry</h1>
            <button onclick="location.reload()">Zagraj Ponownie</button>
            <a href="../../index.html" class="exit-btn">Wróć do Huba</a>
        </div>

        <!-- Back Button -->
        <a href="../../index.html" id="back-btn">🏠</a>
    </div>

    <script src="script.js"></script>
</body>

</html>
