<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --header-bg: #ffffff;
            --nav-text: #666;
            --nav-hover: #000;
            --border: #e0e0e0;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --text: #ffffff;
            --header-bg: #1a1a1a;
            --nav-text: #aaa;
            --nav-hover: #fff;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* HEADER */
        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            width: 100%;
            z-index: 100;
            transition: background 0.3s;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--nav-text);
            text-decoration: none;
            transition: 0.2s;
            font-size: 1rem;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--nav-hover);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }

        /* GAME */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            background: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            display: block;
        }

        .info {
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #aaa;
            display: flex;
            gap: 20px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            flex-direction: column;
            color: #fff;
        }

        .btn {
            background: #00bcd4;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #000;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn:hover {
            background: #00acc1;
        }

        .hidden {
            display: none;
        }
        #gameCanvas { max-width: 100%; height: auto; touch-action: none; }
        .round-controls { text-align: center; padding: 12px; }
        .round-controls button { padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    </style>

    <div class="game-container" id="main-content" tabindex="-1" role="main">
        <div class="round-controls"><button id="pause-game" type="button" onclick="setPaused(!paused)">Pauza</button> <button type="button" onclick="resetGame()">Nowa gra</button> <span id="game-status" role="status"></span></div>
        <div class="info">
            <span>Poziom: <span id="level">1</span></span>
            <span>Wynik: <span id="score">0</span></span>
            <span>Życia: <span id="lives">3</span></span>
        </div>
        <div style="position: relative;">
            <canvas tabindex="0" aria-label="Arkanoid. Strzałki lub przeciągnięcie: ruch. P: pauza." id="gameCanvas" width="800" height="550"></canvas>
            <div id="start-screen" class="overlay">
                <h1>Arkanoid</h1>
                <p>Sterowanie: Strzałki lub Myszka</p>
                <button class="btn" onclick="startGame()">START</button>
            </div>
            <div id="level-screen" class="overlay hidden">
                <h1>Poziom <span id="level-display">1</span></h1>
                <p>Przygotuj się!</p>
                <button class="btn" onclick="continueGame()">KONTYNUUJ</button>
            </div>
            <div id="game-over-screen" class="overlay hidden">
                <h1 id="end-msg">Koniec Gry</h1>
                <p>Wynik: <span id="final-score">0</span></p>
                <p>Osiągnięty poziom: <span id="final-level">1</span></p>
                <button class="btn" onclick="resetGame()">Zagraj ponownie</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Logic
        // Theme is handled by assets/workshop/shell.js.

        // Game Logic
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let score = 0, lives = 3, level = 1, isRunning = false, animationId;
        let round = 0, roundActive = false, waitingForLevel = false, lifeTimer = null, paused = false, lastTime = null, accumulator = 0;
        const paddle = { x: canvas.width / 2 - 60, y: canvas.height - 25, w: 120, h: 12, speed: 10, dx: 0 };
        const ball = { x: canvas.width / 2, y: canvas.height - 40, r: 8, dx: 5, dy: -5, baseSpeed: 5, speed: 5 };

        // Więcej bloków dla większego pola gry: 11 kolumn x 7 rzędów
        const brickInfo = { r: 7, c: 11, w: 65, h: 22, padding: 6, offsetTop: 40, offsetLeft: 20 };
        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickInfo.c; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickInfo.r; r++) {
                    bricks[c][r] = { x: c * (brickInfo.w + brickInfo.padding) + brickInfo.offsetLeft, y: r * (brickInfo.h + brickInfo.padding) + brickInfo.offsetTop, status: 1 };
                }
            }
        }

        document.addEventListener('keydown', e => {
            if (e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('header,a,input,textarea,select')) return;
            if (!e.target?.closest?.('button') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); paddle.dx = (e.key === 'ArrowRight' ? 1 : -1) * paddle.speed; }
            if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) { e.preventDefault(); setPaused(!paused); }
        });
        document.addEventListener('keyup', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') paddle.dx = 0; });
        function movePointer(e) {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width) return;
            paddle.x = Math.max(0,Math.min(canvas.width-paddle.w,(e.clientX-rect.left)*canvas.width/rect.width-paddle.w/2));
        }
        canvas.addEventListener('pointerdown', e => { if (e.isPrimary === false) return; e.preventDefault(); canvas.setPointerCapture?.(e.pointerId); movePointer(e); });
        canvas.addEventListener('pointermove', e => { if (e.isPrimary !== false) movePointer(e); });
        function setPaused(value) {
            if (!roundActive) return;
            paused=!!value;paddle.dx=0;lastTime=null;accumulator=0;
            document.getElementById('pause-game').textContent=paused?'Wznów':'Pauza';
            document.getElementById('game-status').textContent=paused?'Pauza':'';
            if (!paused) canvas.focus();
        }
        document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true);});
        window.addEventListener('blur',()=>{paddle.dx=0;setPaused(true);});

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            // Gradient dla piłki
            const gradient = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(1, '#00bcd4');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            // Zaokrąglona paletka
            ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(1, '#aaa');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickInfo.c; c++) {
                for (let r = 0; r < brickInfo.r; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = (c * (brickInfo.w + brickInfo.padding)) + brickInfo.offsetLeft;
                        const brickY = (r * (brickInfo.h + brickInfo.padding)) + brickInfo.offsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickInfo.w, brickInfo.h, 3);
                        // Różne kolory dla każdego rzędu
                        const hue = (r * 35 + level * 20) % 360;
                        ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                        ctx.fill();
                        // Obramowanie
                        ctx.strokeStyle = `hsl(${hue}, 70%, 35%)`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
        }

        function countBricks() {
            let count = 0;
            for (let c = 0; c < brickInfo.c; c++) {
                for (let r = 0; r < brickInfo.r; r++) {
                    if (bricks[c][r].status === 1) count++;
                }
            }
            return count;
        }

        function collisionDetection() {
            for (let c = 0; c < brickInfo.c; c++) {
                for (let r = 0; r < brickInfo.r; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + brickInfo.w &&
                            ball.y + ball.r > b.y && ball.y - ball.r < b.y + brickInfo.h) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10 * level;
                            document.getElementById('score').innerText = score;

                            // Sprawdź czy wszystkie bloki zniszczone - następny poziom
                            if (countBricks() === 0) {
                                nextLevel();
                            }
                            return;
                        }
                    }
                }
            }
        }

        function nextLevel() {
            isRunning = false;
            waitingForLevel = true;
            level++;
            document.getElementById('level').innerText = level;
            document.getElementById('level-display').innerText = level;

            // Zwiększ prędkość piłki z każdym poziomem
            ball.speed = Math.min(10, ball.baseSpeed + (level - 1) * 0.5);

            // Pokaż ekran nowego poziomu
            document.getElementById('level-screen').classList.remove('hidden');
        }

        function continueGame() {
            if (!waitingForLevel || !roundActive) return;
            waitingForLevel = false;
            canvas.focus();
            document.getElementById('level-screen').classList.add('hidden');
            initBricks();
            resetBallAndPaddle();
            isRunning = true;
            lastTime = null; accumulator = 0;
        }

        function resetBallAndPaddle() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 40;
            ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -ball.speed;
            paddle.x = (canvas.width - paddle.w) / 2;
        }

        function update() {
            if (!isRunning || paused || document.hidden) return;
            paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,paddle.x+paddle.dx));
            collisionDetection();
            if (!isRunning) return;
            if (ball.x+ball.dx > canvas.width-ball.r || ball.x+ball.dx < ball.r) ball.dx=-ball.dx;
            if (ball.y+ball.dy < ball.r) ball.dy=Math.abs(ball.dy);
            if (ball.dy > 0 && ball.y+ball.r <= paddle.y+paddle.h && ball.y+ball.r+ball.dy >= paddle.y && ball.x+ball.r > paddle.x && ball.x-ball.r < paddle.x+paddle.w) {
                const hit = Math.max(-1,Math.min(1,(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2)));
                ball.dx=Math.sin(hit*Math.PI/3)*ball.speed;ball.dy=-Math.cos(hit*Math.PI/3)*ball.speed;
                ball.y=paddle.y-ball.r;
            } else if (ball.y+ball.dy-ball.r > canvas.height) {
                lives--;document.getElementById('lives').innerText=lives;
                if (!lives) { gameOver(false); return; }
                isRunning=false;resetBallAndPaddle();
                const lostRound=round;
                lifeTimer=setTimeout(()=>{lifeTimer=null;if(lostRound!==round||!roundActive)return;isRunning=true;lastTime=null;accumulator=0;},1000);
                return;
            }
            ball.x+=ball.dx;ball.y+=ball.dy;
        }
        function render() { ctx.clearRect(0,0,canvas.width,canvas.height);drawBricks();drawBall();drawPaddle(); }
        function loop(timestamp) {
            animationId=requestAnimationFrame(loop);
            if(lastTime===null)lastTime=timestamp;
            const elapsed=Math.max(0,Math.min(100,timestamp-lastTime));lastTime=timestamp;
            if(isRunning&&!paused&&!document.hidden){accumulator+=elapsed;while(accumulator+0.00001>=1000/60&&isRunning){update();accumulator-=1000/60;}}
            else accumulator=0;
            render();
        }
        function startGame() {
            if(roundActive)return;
            ++round;clearTimeout(lifeTimer);lifeTimer=null;roundActive=true;waitingForLevel=false;paused=false;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('level-screen').classList.add('hidden');
            document.getElementById('pause-game').textContent='Pauza';document.getElementById('game-status').textContent='';
            initBricks();level=1;lives=3;score=0;ball.speed=ball.baseSpeed;paddle.dx=0;
            document.getElementById('score').innerText=score;document.getElementById('lives').innerText=lives;document.getElementById('level').innerText=level;
            resetBallAndPaddle();isRunning=true;lastTime=null;accumulator=0;canvas.focus();
        }
        function gameOver(win) {
            isRunning=false;roundActive=false;++round;clearTimeout(lifeTimer);lifeTimer=null;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('end-msg').innerText=win?'Gratulacje!':'Koniec gry';
            document.getElementById('final-score').innerText=score;document.getElementById('final-level').innerText=level;
        }
        function resetGame() { roundActive=false;startGame(); }

        // Inicjalizacja początkowa
        initBricks();
        drawBricks();
        drawPaddle();
        animationId=requestAnimationFrame(loop);
    </script>
</body>

</html>
