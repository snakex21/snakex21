<head>

    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: var(--shell-bg); color: var(--shell-text); }
        .game-wrapper { flex: 1; display: flex; flex-direction: column; padding: 24px 16px; --game-width: 804px; }
        .game-stage { position: relative; }
        #gameCanvas {
            display: block; width: 800px; height: 550px; max-width: 100%; background: #101a16;
            border: 2px solid var(--shell-border); border-radius: 12px; touch-action: none; outline: none;
        }
        #gameCanvas:focus-visible { border-color: var(--shell-accent); }
        .game-status { min-height: 21px; }
        @media (max-width: 560px) { .game-wrapper { padding: 16px; } }
    </style>

<body class="site-shell game-shell">

    <div class="game-wrapper" id="main-content" tabindex="-1" role="main">
        <div class="game-bar">
            <div class="game-title"><h1>Arkanoid</h1><p>Strzałki, mysz lub przeciągnięcie: paletka · P / Esc: pauza</p></div>
            <div class="game-stats">
                <div class="game-stat"><span>Poziom</span><b id="level">1</b></div>
                <div class="game-stat"><span>Wynik</span><b id="score">0</b></div>
                <div class="game-stat"><span>Rekord</span><b id="best">0</b></div>
                <div class="game-stat"><span>Życia</span><b id="lives">♥♥♥</b></div>
            </div>
            <div class="game-buttons">
                <button class="kit-btn small primary" type="button" id="new-game">Nowa gra</button>
            </div>
        </div>
        <div class="game-stage">
            <canvas tabindex="0" aria-label="Arkanoid. Strzałki, mysz lub przeciągnięcie: ruch paletki. P lub Esc: pauza." id="gameCanvas" width="800" height="550"></canvas>
        </div>
        <p class="game-status" id="game-status" role="status">Strzałki / mysz / przeciągnięcie palcem: paletka · P / Esc: pauza</p>
    </div>

    <script>
    (() => {
        // Plansza logiczna 800 × 550; GryKit.fit skaluje canvas do okna (bufor ostry na ekranach HiDPI).
        const W = 800, H = 550, STEP = 1000 / 60;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelEl = document.getElementById('level');
        const statusEl = document.getElementById('game-status');
        const paddle = { x: W / 2 - 60, y: H - 25, w: 120, h: 12, speed: 10, dx: 0 };
        const ball = { x: W / 2, y: H - 40, r: 8, dx: 5, dy: -5, baseSpeed: 5, speed: 5 };
        // 11 kolumn × 7 rzędów
        const brickInfo = { r: 7, c: 11, w: 65, h: 22, padding: 6, offsetTop: 40, offsetLeft: 20 };
        const RESPAWN_STEPS = 60; // ~1 s przerwy po utracie życia (liczone tylko w trakcie gry, więc pauza ją wstrzymuje)

        let bricks = [], score = 0, lives = 3, level = 1;
        let running = false;          // runda trwa (piłka w ruchu albo czeka na serw)
        let waitingForLevel = false;  // ekran „Poziom N” – gra stoi
        let respawn = 0, lastTime = null, accumulator = 0;
        const keys = { left: false, right: false };

        const brickHue = r => (r * 35 + level * 20) % 360;

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickInfo.c; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickInfo.r; r++) {
                    bricks[c][r] = { x: c * (brickInfo.w + brickInfo.padding) + brickInfo.offsetLeft, y: r * (brickInfo.h + brickInfo.padding) + brickInfo.offsetTop, status: 1 };
                }
            }
        }
        function countBricks() {
            let n = 0;
            for (const col of bricks) for (const b of col) if (b.status === 1) n++;
            return n;
        }
        function resetBallAndPaddle() {
            ball.x = W / 2;
            ball.y = H - 40;
            ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -ball.speed;
            paddle.x = (W - paddle.w) / 2;
        }

        /* ---------- logika ---------- */
        function collisionDetection() {
            for (let c = 0; c < brickInfo.c; c++) {
                for (let r = 0; r < brickInfo.r; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1 &&
                        ball.x + ball.r > b.x && ball.x - ball.r < b.x + brickInfo.w &&
                        ball.y + ball.r > b.y && ball.y - ball.r < b.y + brickInfo.h) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        const points = 10 * level;
                        score += points;
                        GryKit.score(score);
                        const hue = brickHue(r);
                        const cx = b.x + brickInfo.w / 2, cy = b.y + brickInfo.h / 2;
                        GryKit.fx.burst(cx, cy, { on: canvas, color: [`hsl(${hue},70%,50%)`, `hsl(${hue},80%,68%)`], count: 7, spread: 34, size: 6, square: true });
                        GryKit.sfx.play('hit', { pitch: 1 + (brickInfo.r - r) * 0.04 });
                        if (countBricks() === 0) nextLevel();
                        return;
                    }
                }
            }
        }

        function update() {
            paddle.dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
            paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x + paddle.dx * paddle.speed));
            if (respawn > 0) {
                // Piłka czeka na paletce, aż minie przerwa po utracie życia.
                respawn--;
                ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r;
                return;
            }
            collisionDetection();
            if (!running || waitingForLevel) return;
            if (ball.x + ball.dx > W - ball.r || ball.x + ball.dx < ball.r) { ball.dx = -ball.dx; GryKit.sfx.play('bounce', { pitch: 0.8 }); }
            if (ball.y + ball.dy < ball.r) { ball.dy = Math.abs(ball.dy); GryKit.sfx.play('bounce', { pitch: 0.8 }); }
            if (ball.dy > 0 && ball.y + ball.r <= paddle.y + paddle.h && ball.y + ball.r + ball.dy >= paddle.y && ball.x + ball.r > paddle.x && ball.x - ball.r < paddle.x + paddle.w) {
                const hit = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
                ball.dx = Math.sin(hit * Math.PI / 3) * ball.speed; ball.dy = -Math.cos(hit * Math.PI / 3) * ball.speed;
                ball.y = paddle.y - ball.r;
                GryKit.sfx.play('bounce');
            } else if (ball.y + ball.dy - ball.r > H) {
                loseLife();
                return;
            }
            ball.x += ball.dx; ball.y += ball.dy;
        }

        function loseLife() {
            lives--;
            GryKit.lives(lives);
            GryKit.fx.shake(canvas, 6, 300);
            GryKit.fx.flash('#d05c5c', { on: canvas, strength: 0.3 });
            if (lives <= 0) { gameOver(); return; }
            GryKit.sfx.play('lose');
            resetBallAndPaddle();
            respawn = RESPAWN_STEPS;
        }

        function nextLevel() {
            waitingForLevel = true;
            level++;
            levelEl.textContent = level;
            ball.speed = Math.min(10, ball.baseSpeed + (level - 1) * 0.5);
            GryKit.sfx.play('win');
            GryKit.fx.flash('#f2c14e', { on: canvas, strength: 0.25 });
            showLevelMessage();
        }
        // GryKit.message nie zmienia GryKit.state – gra stoi dzięki waitingForLevel (pętla nie wywołuje update).
        function showLevelMessage() {
            GryKit.message({
                title: 'Poziom ' + level, icon: '🧱',
                text: 'Wszystkie cegły rozbite! Piłka będzie szybsza.',
                buttons: [{ label: 'Kontynuuj', primary: true, onClick: continueGame }]
            });
        }
        function continueGame() {
            if (!waitingForLevel || !running) return;
            waitingForLevel = false;
            initBricks();
            resetBallAndPaddle();
            keys.left = keys.right = false;
            lastTime = null; accumulator = 0;
        }

        function gameOver() {
            running = false;
            GryKit.over({ score, text: 'Osiągnięty poziom: ' + level + '.', delay: 400 });
        }

        function startGame() {
            initBricks();
            level = 1; lives = 3; score = 0; ball.speed = ball.baseSpeed; respawn = 0;
            keys.left = keys.right = false;
            GryKit.score(0); GryKit.lives(lives); levelEl.textContent = level;
            resetBallAndPaddle();
            waitingForLevel = false; running = true; lastTime = null; accumulator = 0;
        }

        /* ---------- rysowanie ---------- */
        function drawBricks() {
            for (let c = 0; c < brickInfo.c; c++) {
                for (let r = 0; r < brickInfo.r; r++) {
                    const b = bricks[c][r];
                    if (b.status !== 1) continue;
                    const hue = brickHue(r);
                    ctx.beginPath();
                    ctx.roundRect(b.x, b.y, brickInfo.w, brickInfo.h, 3);
                    ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                    ctx.fill();
                    ctx.strokeStyle = `hsl(${hue}, 70%, 35%)`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,.18)';
                    ctx.fillRect(b.x + 3, b.y + 3, brickInfo.w - 6, 4);
                }
            }
        }
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(1, '#00bcd4');
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(1, '#aaa');
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        function render() {
            const k = GryKit.ratio(canvas);
            ctx.setTransform(k, 0, 0, k, 0, 0);
            ctx.clearRect(0, 0, W, H);
            drawBricks();
            drawBall();
            drawPaddle();
            if (running && respawn > 0 && GryKit.playing) {
                ctx.fillStyle = 'rgba(238,242,231,.85)';
                ctx.font = GryKit.font(22, 700);
                ctx.textAlign = 'center';
                ctx.fillText('Przygotuj się…', W / 2, H * 0.62);
            }
        }
        function loop(timestamp) {
            requestAnimationFrame(loop);
            if (lastTime === null) lastTime = timestamp;
            const elapsed = Math.max(0, Math.min(100, timestamp - lastTime)); lastTime = timestamp;
            if (running && !waitingForLevel && GryKit.playing) {
                accumulator += elapsed;
                while (accumulator + 0.00001 >= STEP && running && !waitingForLevel) { update(); accumulator -= STEP; }
            } else accumulator = 0;
            render();
        }

        /* ---------- sterowanie ---------- */
        const canMove = () => running && !waitingForLevel && GryKit.playing;
        document.addEventListener('keydown', e => {
            if (e.altKey || e.ctrlKey || e.metaKey || e.target?.closest?.('header,a,input,textarea,select,button')) return;
            if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
            e.preventDefault();
            if (!canMove()) return;
            keys[e.key === 'ArrowRight' ? 'right' : 'left'] = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowRight') keys.right = false;
            if (e.key === 'ArrowLeft') keys.left = false;
        });
        function movePointer(e) {
            if (!canMove() || !canvas.getBoundingClientRect().width) return;
            const p = GryKit.pointer(canvas, e);
            paddle.x = Math.max(0, Math.min(W - paddle.w, p.x - paddle.w / 2));
        }
        canvas.addEventListener('pointerdown', e => { if (e.isPrimary === false) return; e.preventDefault(); canvas.setPointerCapture?.(e.pointerId); movePointer(e); });
        canvas.addEventListener('pointermove', e => { if (e.isPrimary !== false) movePointer(e); });
        document.getElementById('new-game').addEventListener('click', () => GryKit.start());

        GryKit.init({
            id: 'arkanoid',
            title: 'Arkanoid',
            icon: '🧱',
            howTo: ['Odbijaj piłkę paletką i rozbij wszystkie cegły.', 'Miejsce odbicia na paletce zmienia kąt lotu piłki.', 'Masz 3 życia – każdy poziom to szybsza piłka i więcej punktów za cegłę.'],
            controls: '<kbd>←</kbd><kbd>→</kbd>, mysz albo przeciągnięcie palcem · <kbd>P</kbd>/<kbd>Esc</kbd> pauza',
            board: canvas,
            focus: canvas,
            hud: { score: '#score', best: '#best', lives: '#lives' },
            fit: { el: canvas, width: W, height: H, sharp: true },
            onStart() { startGame(); },
            onPause(p) {
                keys.left = keys.right = false; lastTime = null; accumulator = 0;
                // Pauza zastępuje komunikat „Poziom N” – po wznowieniu pokaż go ponownie.
                if (!p && waitingForLevel && running) showLevelMessage();
            },
            onMenu() { running = false; waitingForLevel = false; initBricks(); resetBallAndPaddle(); GryKit.score(0); GryKit.lives(3); levelEl.textContent = 1; }
        });
        initBricks();
        resetBallAndPaddle();
        GryKit.lives(lives);
        requestAnimationFrame(loop);
    })();
    </script>
</body>
