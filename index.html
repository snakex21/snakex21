<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hub</title>
    <link rel="icon" type="image/x-icon"
        href="https://www.solojuve.com/spolecznosc/zdj%C4%99cia/306-bezimienny-jpg/pobierz">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #e0e0e0;
            --card-bg: #f8f9fa;
            --card-hover: #e9ecef;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaa;
            --border: #333;
            --card-bg: #2a2a2a;
            --card-hover: #3a3a3a;
            --header-bg: #1a1a1a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 4px var(--shadow);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex: 1;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        main>p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .weather-widget {
            margin-bottom: 3rem;
            padding: 1.5rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            min-width: 250px;
            position: relative;
            transition: all 0.3s ease;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .weather-desc {
            color: var(--text-secondary);
            text-transform: capitalize;
            font-size: 0.9rem;
        }

        .weather-location {
            font-size: 0.9rem;
            font-weight: 600;
            color: #007aff;
            margin-top: 0.2rem;
        }

        .weather-settings-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
            font-size: 1rem;
            color: var(--text);
        }

        .weather-settings-btn:hover {
            opacity: 1;
        }

        .weather-settings-panel {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .weather-settings-panel.active {
            display: flex;
        }

        .weather-input {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            width: 100%;
            font-family: inherit;
        }

        .weather-btn {
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: var(--text);
            color: var(--bg);
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .weather-btn:hover {
            opacity: 0.8;
        }

        .clock {
            margin: 3rem 0;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .time {
            font-size: 3rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            margin-bottom: 0.5rem;
        }

        .date {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .timezone {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .quote-card {
            max-width: 600px;
            margin: 0 auto 3rem;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            position: relative;
            transition: all 0.2s;
        }

        .quote-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        .quote-card blockquote {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .quote-author {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: right;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-top: 3rem;
        }

        /* Wyśrodkowanie ostatniego nieparzystego elementu na komputerach */
        @media (min-width: 769px) {
            .grid .card:last-child:nth-child(odd) {
                grid-column: span 2;
                justify-self: center;
                width: calc(50% - 0.75rem);
                /* Szerokość jednego kafelka uwzględniając gap */
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-decoration: none;
            color: var(--text);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .icon {
            font-size: 3rem;
        }

        .label {
            font-size: 1.2rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem;
            }

            .nav-links {
                display: none;
            }

            h1 {
                font-size: 2rem;
            }

            .time {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Hub</a>
            <div class="nav-links">
                <a href="gry/gry.html">Gry</a>
                <a href="muzyka/muzyka.html">Muzyka</a>
                <a href="filmy/filmy glowna.html">Filmy</a>
                <a href="Programy/programy.html">Narzędzia</a>
                <a href="zmiany.html">Zmiany</a>
            </div>
            <button id="theme-toggle" aria-label="Przełącz tryb ciemny">🌙</button>
        </nav>
    </header>

    <main>
        <h1>Hub</h1>
        <p>Szybki dostęp do wszystkiego</p>

        <div class="clock">
            <div class="time" id="time">--:--:--</div>
            <div class="date" id="date">Ładowanie...</div>
            <div class="timezone" id="timezone">--</div>
        </div>

        <!-- Widget Pogody -->
        <div class="weather-widget" id="weather-widget">
            <button class="weather-settings-btn" onclick="toggleWeatherSettings()" title="Ustawienia pogody">⚙️</button>
            <div id="weather-display">
                <div class="weather-temp" id="weather-temp">--°C</div>
                <div class="weather-desc" id="weather-desc">Ładowanie...</div>
                <div class="weather-location" id="weather-city">--</div>
            </div>
            <div class="weather-settings-panel" id="weather-settings">
                <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="use-location-toggle" onchange="toggleLocationMode()">
                    Użyj mojej lokalizacji
                </label>
                <input type="text" class="weather-input" id="manual-city-input"
                    placeholder="Wpisz miasto (np. Warszawa)">
                <button class="weather-btn" onclick="saveWeatherSettings()">Zapisz</button>
            </div>
        </div>

        <!-- Sekcja Cytatu -->
        <div class="quote-card" title="Kliknij, aby wylosować nowy cytat" onclick="fetchQuote()">
            <blockquote id="quote-text">Szukanie inspiracji...</blockquote>
            <div class="quote-author" id="quote-author"></div>
        </div>

        <div class="grid">
            <a href="gry/gry.html" class="card">
                <div class="icon">🎮</div>
                <div class="label">Gry</div>
            </a>
            <a href="muzyka/muzyka.html" class="card">
                <div class="icon">🎵</div>
                <div class="label">Muzyka</div>
            </a>
            <a href="filmy/filmy glowna.html" class="card">
                <div class="icon">🎬</div>
                <div class="label">Filmy</div>
            </a>
            <a href="Programy/programy.html" class="card">
                <div class="icon">🛠️</div>
                <div class="label">Narzędzia</div>
            </a>
            <a href="zmiany.html" class="card">
                <div class="icon">📜</div>
                <div class="label">Dziennik Zmian</div>
            </a>
        </div>
    </main>

    <script>
        // Automatyczna detekcja strefy czasowej
        function getTimezoneName() {
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            // Wyciągnij nazwę miasta ze strefy np. "Europe/Warsaw" -> "Warszawa"
            const cityMap = {
                'Europe/Warsaw': 'Warszawa',
                'Europe/London': 'Londyn',
                'Europe/Paris': 'Paryż',
                'Europe/Berlin': 'Berlin',
                'America/New_York': 'Nowy Jork',
                'America/Los_Angeles': 'Los Angeles',
                'Asia/Tokyo': 'Tokio',
                'Asia/Shanghai': 'Szanghaj',
                'Australia/Sydney': 'Sydney'
            };

            return cityMap[tz] || tz.split('/').pop().replace(/_/g, ' ');
        }

        function updateClock() {
            const now = new Date();

            // Czas
            const time = now.toLocaleTimeString('pl-PL', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            // Data
            const date = now.toLocaleDateString('pl-PL', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            // Strefa czasowa
            const timezone = getTimezoneName();

            document.getElementById('time').textContent = time;
            document.getElementById('date').textContent = date;
            document.getElementById('timezone').textContent = timezone;
        }

        // Aktualizuj co sekundę
        updateClock();
        setInterval(updateClock, 1000);

        // Tryb ciemny
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Wczytaj zapisany tryb
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // --- Widget Pogody ---
        const weatherWidget = {
            apiKey: null, // Open-Meteo nie wymaga klucza!

            init: function () {
                const useAuto = localStorage.getItem('weatherAuto') === 'true';
                const city = localStorage.getItem('weatherCity') || 'Warszawa';

                document.getElementById('use-location-toggle').checked = useAuto;
                document.getElementById('manual-city-input').value = city;
                document.getElementById('manual-city-input').disabled = useAuto;

                this.fetchWeather();
            },

            fetchWeather: async function () {
                const useAuto = document.getElementById('use-location-toggle').checked;
                const manualCity = document.getElementById('manual-city-input').value;

                const tempEl = document.getElementById('weather-temp');
                const descEl = document.getElementById('weather-desc');
                const cityEl = document.getElementById('weather-city');

                try {
                    let lat, lon, cityName;

                    if (useAuto) {
                        if (!navigator.geolocation) throw new Error("Brak geolokalizacji");
                        const pos = await new Promise((resolve, reject) =>
                            navigator.geolocation.getCurrentPosition(resolve, reject)
                        );
                        lat = pos.coords.latitude;
                        lon = pos.coords.longitude;
                        cityName = "Twoja lokalizacja";
                    } else {
                        // Geocoding (szukanie miasta)
                        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${manualCity}&count=1&language=pl&format=json`);
                        const geoData = await geoRes.json();
                        if (!geoData.results) throw new Error("Nie znaleziono miasta");

                        lat = geoData.results[0].latitude;
                        lon = geoData.results[0].longitude;
                        cityName = geoData.results[0].name;
                    }

                    // Pobieranie pogody
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                    const weatherData = await weatherRes.json();

                    const temp = Math.round(weatherData.current_weather.temperature);
                    const code = weatherData.current_weather.weathercode;

                    tempEl.textContent = `${temp}°C`;
                    descEl.textContent = this.getWeatherDesc(code);
                    cityEl.textContent = cityName;

                } catch (err) {
                    console.error(err);
                    descEl.textContent = "Błąd pobierania";
                    cityEl.textContent = "Sprawdź ustawienia";
                }
            },

            getWeatherDesc: function (code) {
                // Proste mapowanie kodów WMO
                const codes = {
                    0: "Bezchmurnie",
                    1: "Przeważnie bezchmurnie", 2: "Częściowe zachmurzenie", 3: "Pochmurno",
                    45: "Mgła", 48: "Mgła osadzająca szadź",
                    51: "Mżawka", 53: "Mżawka", 55: "Mżawka",
                    61: "Deszcz", 63: "Deszcz", 65: "Deszcz",
                    71: "Śnieg", 73: "Śnieg", 75: "Śnieg",
                    95: "Burza"
                };
                return codes[code] || "Nieznane";
            }
        };

        function toggleWeatherSettings() {
            document.getElementById('weather-settings').classList.toggle('active');
        }

        function toggleLocationMode() {
            const isAuto = document.getElementById('use-location-toggle').checked;
            document.getElementById('manual-city-input').disabled = isAuto;
        }

        function saveWeatherSettings() {
            const isAuto = document.getElementById('use-location-toggle').checked;
            const city = document.getElementById('manual-city-input').value;

            localStorage.setItem('weatherAuto', isAuto);
            localStorage.setItem('weatherCity', city);

            toggleWeatherSettings(); // Zamknij panel
            weatherWidget.fetchWeather(); // Odśwież
        }

        // Uruchom widget
        weatherWidget.init();

        // Pobieranie cytatu z API
        async function fetchQuote() {
            const textElem = document.getElementById('quote-text');
            const authorElem = document.getElementById('quote-author');

            // Efekt ładowania (tylko przy kliknięciu, nie przy starcie)
            if (textElem.textContent !== 'Szukanie inspiracji...') {
                textElem.style.opacity = '0.5';
            }

            try {
                // Używamy darmowego API (dummyjson)
                const response = await fetch('https://dummyjson.com/quotes/random');
                if (!response.ok) throw new Error('Błąd API');

                const data = await response.json();

                textElem.style.opacity = '1';
                textElem.textContent = `„${data.quote}”`;
                authorElem.textContent = `— ${data.author}`;
            } catch (error) {
                console.error('Nie udało się pobrać cytatu:', error);
                textElem.style.opacity = '1';
                // Fallback w razie błędu
                textElem.textContent = '„Jedynym sposobem na robienie wielkich rzeczy jest robienie tego, co się kocha.”';
                authorElem.textContent = '— Steve Jobs';
            }
        }

        // Pobierz cytat przy starcie strony
        fetchQuote();
    </script>
</body>

</html>
